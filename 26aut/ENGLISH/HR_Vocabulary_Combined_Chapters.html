{padding:0 6px}.panel{padding:3px;border-radius:9px}.tab{padding:9px 12px}}</style></head><body><header><a class="back" href="../../index.html">‹ 返回资料库</a><div class="brand">HUMAN RIGHTS · VOCABULARY</div><h1 class="title">HR 单词合集</h1><p class="desc">按章节独立切换：1.x、2.x、3.x 分组；保留原版单词卡与配对练习。</p><nav id="tabs" class="tabs" role="tablist" aria-label="选择章节"></nav></header><main id="pages" class="pages"></main><footer>内容内嵌于一个 HTML；原先独立文件保持可访问。</footer><script id="data" type="application/json">[{"label":"HR1.3","group":"1.x","source":"26aut/ENGLISH/Human_Rights_Ch1.3_1.7_Vocab.html","inner":"p13","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Human Rights 1.3 / 1.7 词汇复习\u003c/title>\n\u003cstyle>\n  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+JP:wght@400;600&display=swap');\n\n  :root{\n    --cream:#f6f1e4;\n    --parchment:#efe6d2;\n    --sage:#8a9a7c;\n    --sage-dark:#657357;\n    --plum:#6e4e5c;\n    --gold:#c9a24b;\n    --ink:#3c352b;\n    --wrong:#b05c52;\n  }\n\n  *{box-sizing:border-box;}\n\n  body{\n    margin:0;\n    min-height:100vh;\n    background:var(--cream);\n    background-image:\n      radial-gradient(circle at 10% 10%, rgba(201,162,75,0.08), transparent 40%),\n      radial-gradient(circle at 90% 90%, rgba(110,78,92,0.08), transparent 40%);\n    font-family:'EB Garamond','Noto Serif JP',serif;\n    color:var(--ink);\n    display:flex;\n    flex-direction:column;\n    align-items:center;\n    padding:28px 16px 60px;\n  }\n\n  h1{\n    font-weight:600;\n    font-size:1.5rem;\n    margin:0 0 4px;\n    color:var(--plum);\n    text-align:center;\n  }\n  .subtitle{\n    font-style:italic;\n    color:var(--sage-dark);\n    margin-bottom:18px;\n    text-align:center;\n    font-size:0.9rem;\n  }\n\n  .page-tabs{\n    display:flex;\n    gap:8px;\n    margin-bottom:20px;\n    flex-wrap:wrap;\n    justify-content:center;\n  }\n  .page-tab{\n    border:1px solid var(--plum);\n    background:transparent;\n    color:var(--plum);\n    padding:8px 18px;\n    border-radius:999px;\n    font-family:inherit;\n    font-size:0.92rem;\n    cursor:pointer;\n    transition:all 0.2s;\n  }\n  .page-tab.active{\n    background:var(--plum);\n    color:#fff;\n  }\n\n  .page{\n    display:none;\n    width:100%;\n    max-width:600px;\n  }\n  .page.active{\n    display:block;\n  }\n\n  .section-title{\n    text-align:center;\n    color:var(--plum);\n    font-weight:600;\n    font-size:1.15rem;\n    margin-bottom:12px;\n  }\n\n  .list-view{\n    background:linear-gradient(160deg,#fbf7ea,var(--parchment));\n    border:1px solid rgba(201,162,75,0.4);\n    border-radius:18px;\n    box-shadow:0 8px 24px rgba(60,53,43,0.12);\n    padding:6px 20px;\n  }\n  .list-row{\n    display:flex;\n    align-items:baseline;\n    gap:14px;\n    padding:12px 0;\n    border-bottom:1px solid rgba(110,78,92,0.15);\n  }\n  .list-row:last-child{\n    border-bottom:none;\n  }\n  .list-word{\n    flex:0 0 auto;\n    background:none;\n    color:var(--plum);\n    font-weight:700;\n    font-size:1.05rem;\n    white-space:nowrap;\n  }\n  .list-def-col{\n    flex:1 1 auto;\n    display:flex;\n    flex-direction:column;\n    gap:2px;\n  }\n  .list-def{\n    font-size:0.98rem;\n    line-height:1.45;\n    color:var(--ink);\n  }\n  .kw{\n    background:#f3d675;\n    padding:1px 5px;\n    border-radius:5px;\n    font-weight:600;\n    box-shadow:0 1px 2px rgba(60,53,43,0.12);\n  }\n  .list-def-cn{\n    font-size:0.85rem;\n    color:var(--sage-dark);\n  }\n  .list-pos{\n    font-size:0.72rem;\n    color:var(--sage-dark);\n    margin-left:4px;\n    font-style:italic;\n  }\n\n  /* matching game */\n  .match-controls{\n    display:flex;\n    gap:8px;\n    justify-content:center;\n    margin-bottom:14px;\n    flex-wrap:wrap;\n  }\n  .match-progress{\n    text-align:center;\n    color:var(--plum);\n    font-size:0.95rem;\n    margin-bottom:14px;\n    letter-spacing:0.02em;\n  }\n  .match-grid{\n    display:flex;\n    gap:14px;\n  }\n  .match-col{\n    flex:1;\n    display:flex;\n    flex-direction:column;\n    gap:8px;\n  }\n  .match-item{\n    background:linear-gradient(160deg,#fbf7ea,var(--parchment));\n    border:1px solid rgba(201,162,75,0.5);\n    border-radius:10px;\n    padding:10px 12px;\n    font-size:0.88rem;\n    line-height:1.3;\n    cursor:pointer;\n    transition:all 0.15s;\n    min-height:44px;\n    display:flex;\n    align-items:center;\n    box-shadow:0 2px 6px rgba(60,53,43,0.08);\n  }\n  .match-item.word{\n    font-weight:600;\n    color:var(--plum);\n    justify-content:center;\n    text-align:center;\n  }\n  .match-item.def{\n    color:var(--ink);\n  }\n  .match-item.selected{\n    border-color:var(--gold);\n    background:linear-gradient(160deg,#fff8e0,#f3e4bd);\n    box-shadow:0 0 0 2px rgba(201,162,75,0.5);\n  }\n  .match-item.correct{\n    background:linear-gradient(160deg,#e7edd9,#d4e0c2);\n    border-color:var(--sage);\n    color:var(--sage-dark);\n    cursor:default;\n    opacity:0.75;\n  }\n  .match-item.wrong{\n    background:#f3d9d5;\n    border-color:var(--wrong);\n    animation:shake 0.3s;\n  }\n  @keyframes shake{\n    0%,100%{transform:translateX(0);}\n    25%{transform:translateX(-4px);}\n    75%{transform:translateX(4px);}\n  }\n\n  .btn{\n    border:1px solid var(--sage);\n    background:var(--sage);\n    color:#fff;\n    font-family:inherit;\n    font-size:0.95rem;\n    padding:8px 18px;\n    border-radius:10px;\n    cursor:pointer;\n    transition:transform 0.15s, opacity 0.2s;\n  }\n  .btn.gold{\n    background:var(--gold);\n    border-color:var(--gold);\n  }\n  .btn:active{transform:scale(0.96);}\n\n  .win-banner{\n    text-align:center;\n    color:var(--sage-dark);\n    font-weight:600;\n    margin-top:14px;\n    display:none;\n  }\n\n  footer{\n    margin-top:30px;\n    font-size:0.75rem;\n    color:var(--sage-dark);\n    opacity:0.7;\n    text-align:center;\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>人権 Human Rights 词汇复习\u003c/h1>\n\u003cdiv class=\"subtitle\">Chapter 1.3 · Chapter 1.7\u003c/div>\n\n\u003cdiv class=\"page-tabs\">\n  \u003cbutton class=\"page-tab active\" data-page=\"p13\">1.3 背诵\u003c/button>\n  \u003cbutton class=\"page-tab\" data-page=\"p17\">1.7 背诵\u003c/button>\n  \u003cbutton class=\"page-tab\" data-page=\"pmatch\">🎲 配对练习\u003c/button>\n\u003c/div>\n\n\u003c!-- PAGE 1: Chapter 1.3 recitation list -->\n\u003cdiv class=\"page active\" id=\"p13\">\n  \u003cdiv class=\"section-title\">Chapter 1.3 — How The Modern Idea of Human Rights was Born\u003c/div>\n  \u003cdiv class=\"list-view\" id=\"list13\">\u003c/div>\n\u003c/div>\n\n\u003c!-- PAGE 2: Chapter 1.7 recitation list -->\n\u003cdiv class=\"page\" id=\"p17\">\n  \u003cdiv class=\"section-title\">Chapter 1.7 — Protected by Human Rights\u003c/div>\n  \u003cdiv class=\"list-view\" id=\"list17\">\u003c/div>\n\u003c/div>\n\n\u003c!-- PAGE 3: matching game -->\n\u003cdiv class=\"page\" id=\"pmatch\">\n  \u003cdiv class=\"section-title\">全部单词配对练习（左侧按字母顺序）\u003c/div>\n  \u003cdiv class=\"match-controls\">\n    \u003cbutton class=\"btn gold\" id=\"reshuffleBtn\">🔀 重新打乱释义顺序\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"match-progress\" id=\"matchProgress\">已配对 0 / 24\u003c/div>\n  \u003cdiv class=\"match-grid\">\n    \u003cdiv class=\"match-col\" id=\"wordCol\">\u003c/div>\n    \u003cdiv class=\"match-col\" id=\"defCol\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"win-banner\" id=\"winBanner\">🎉 全部配对完成！点击上方按钮再来一组\u003c/div>\n\u003c/div>\n\n\u003cfooter>Osaka Jogakuin · Integrated Reading / IR Human Rights Book — Ch 1.3 & 1.7\u003c/footer>\n\n\u003cscript>\nconst data13 = [\n  [\"fairly\",\"more than average, but less than very\",\"adv\",\"相当地；颇为\",\"more than average\"],\n  [\"acquire\",\"to get something by your own or being given it\",\"v\",\"获得\",\"get something\"],\n  [\"universal\",\"true or right at all times and in all places\",\"adj\",\"普遍的\",\"true or right at all times\"],\n  [\"prevent\",\"to stop something from happening or someone from doing something\",\"v\",\"预防；阻止\",\"stop something from happening\"],\n  [\"handicapped\",\"not able to use your body or your mind because it has been damaged\",\"adj\",\"有残疾的\",\"not able to use your body or your mind\"],\n  [\"attitude\",\"a feeling or opinion about something, especially when this shows in your behavior\",\"n\",\"态度\",\"feeling or opinion\"],\n  [\"establish\",\"to start a company or organization that will continue for a long time\",\"v\",\"建立；设立\",\"start a company or organization\"],\n  [\"freedom\",\"the state of being able to do what you want, without anything stopping you\",\"n\",\"自由\",\"do what you want\"],\n  [\"shelter\",\"a place to stay or live, especially when you need protection from bad weather or danger\",\"n\",\"住所；庇护所\",\"place to stay or live\"],\n  [\"article\",\"a section of a formal agreement or document which deals with a particular point\",\"n\",\"条款；项目\",\"section of a formal agreement\"],\n  [\"deserve\",\"it should happen to someone because of the way (s)he has behaved\",\"v\",\"应得；值得\",\"should happen to someone\"],\n  [\"mental\",\"relating to the mind, or involving the process of thinking\",\"adj\",\"精神的；心理的\",\"relating to the mind\"]\n];\n\nconst data17 = [\n  [\"suffer\",\"experience physical or mental pain\",\"v\",\"遭受；忍受\",\"physical or mental pain\"],\n  [\"legal\",\"concerned with or relating to the law\",\"adj\",\"法律的；合法的\",\"relating to the law\"],\n  [\"press\",\"reports in newspapers and on radio and television\",\"n\",\"新闻界；媒体报道\",\"reports in newspapers\"],\n  [\"arrest\",\"put them in custody for breaking the law\",\"v\",\"逮捕\",\"in custody\"],\n  [\"prison\",\"a building where people are kept as a punishment for a crime, or while they are waiting to go to court for their trial\",\"n\",\"监狱\",\"kept as a punishment\"],\n  [\"trial\",\"a formal meeting in a law court, at which a judge and jury listen to evidence and decide whether a person is guilty of a crime\",\"n\",\"审判\",\"decide whether a person is guilty\"],\n  [\"evidence\",\"facts or signs that show clearly that something exists or is true\",\"n\",\"证据\",\"facts or signs\"],\n  [\"proper\",\"right, suitable, and correct\",\"adj\",\"适当的；恰当的\",\"right, suitable, and correct\"],\n  [\"torture\",\"the act of deliberately hurting someone in order to force them to tell you something, to punish them, or to be cruel\",\"n\",\"拷问；折磨\",\"deliberately hurting someone\"],\n  [\"bondage\",\"the state of having your freedom limited, or being prevented from doing what you want\",\"n\",\"束缚\",\"freedom limited\"],\n  [\"criticize\",\"express your disapproval of someone or something, or to talk about their feeling\",\"v\",\"批评\",\"disapproval\"],\n  [\"abuse\",\"the act of treating someone cruelly and violently or the use of something in a wrong way or for a bad purpose\",\"n\",\"虐待；滥用\",\"treating someone cruelly\"]\n];\n\nfunction buildHighlightedDef(defText, keyword){\n  const frag = document.createDocumentFragment();\n  const idx = keyword ? defText.indexOf(keyword) : -1;\n  if(idx === -1){\n    frag.appendChild(document.createTextNode(defText));\n    return frag;\n  }\n  if(idx > 0) frag.appendChild(document.createTextNode(defText.slice(0, idx)));\n  const kw = document.createElement('span');\n  kw.className = 'kw';\n  kw.textContent = defText.slice(idx, idx + keyword.length);\n  frag.appendChild(kw);\n  const rest = defText.slice(idx + keyword.length);\n  if(rest) frag.appendChild(document.createTextNode(rest));\n  return frag;\n}\n\nfunction renderList(containerId, data){\n  const el = document.getElementById(containerId);\n  el.innerHTML = \"\";\n  data.forEach(([w,d,pos,cn,kw])=>{\n    const row = document.createElement('div');\n    row.className = 'list-row';\n    const wordEl = document.createElement('span');\n    wordEl.className = 'list-word';\n    wordEl.textContent = w;\n    const defCol = document.createElement('span');\n    defCol.className = 'list-def-col';\n    const defEl = document.createElement('span');\n    defEl.className = 'list-def';\n    defEl.appendChild(buildHighlightedDef(d, kw));\n    const posEl = document.createElement('span');\n    posEl.className = 'list-pos';\n    posEl.textContent = `[${pos}]`;\n    defEl.appendChild(posEl);\n    const cnEl = document.createElement('span');\n    cnEl.className = 'list-def-cn';\n    cnEl.textContent = cn;\n    defCol.appendChild(defEl);\n    defCol.appendChild(cnEl);\n    row.appendChild(wordEl);\n    row.appendChild(defCol);\n    el.appendChild(row);\n  });\n}\nrenderList('list13', data13);\nrenderList('list17', data17);\n\n// page tab switching\ndocument.querySelectorAll('.page-tab').forEach(tab=>{\n  tab.addEventListener('click', ()=>{\n    document.querySelectorAll('.page-tab').forEach(t=>t.classList.remove('active'));\n    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n    tab.classList.add('active');\n    document.getElementById(tab.dataset.page).classList.add('active');\n  });\n});\n\n// ---- matching game ----\nfunction shuffle(arr){\n  const a = [...arr];\n  for(let i=a.length-1;i>0;i--){\n    const j = Math.floor(Math.random()*(i+1));\n    [a[i],a[j]] = [a[j],a[i]];\n  }\n  return a;\n}\n\nconst wordCol = document.getElementById('wordCol');\nconst defCol = document.getElementById('defCol');\nconst matchProgress = document.getElementById('matchProgress');\nconst winBanner = document.getElementById('winBanner');\n\nlet roundPairs = [];\nlet matchedCount = 0;\nlet selectedWord = null;\nlet selectedDef = null;\nlet lock = false;\n\nfunction startRound(){\n  const pool = [...data13, ...data17].sort((a,b)=> a[0].localeCompare(b[0]));\n\n  roundPairs = pool.map((item, i)=>({id:i, word:item[0], def:item[1]}));\n  matchedCount = 0;\n  selectedWord = null;\n  selectedDef = null;\n  lock = false;\n  winBanner.style.display = 'none';\n  matchProgress.textContent = `已配对 0 / ${roundPairs.length}`;\n\n  const words = roundPairs; // alphabetical, unshuffled\n  const defs = shuffle(roundPairs);\n\n  wordCol.innerHTML = \"\";\n  defCol.innerHTML = \"\";\n\n  words.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item word';\n    el.textContent = p.word;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'word', p.id));\n    wordCol.appendChild(el);\n  });\n\n  defs.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item def';\n    el.textContent = p.def;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'def', p.id));\n    defCol.appendChild(el);\n  });\n}\n\nfunction onPick(el, kind, id){\n  if(lock || el.classList.contains('correct')) return;\n\n  if(kind === 'word'){\n    if(selectedWord) selectedWord.el.classList.remove('selected');\n    selectedWord = {el, id};\n    el.classList.add('selected');\n  } else {\n    if(selectedDef) selectedDef.el.classList.remove('selected');\n    selectedDef = {el, id};\n    el.classList.add('selected');\n  }\n\n  if(selectedWord && selectedDef){\n    lock = true;\n    if(selectedWord.id === selectedDef.id){\n      selectedWord.el.classList.remove('selected');\n      selectedDef.el.classList.remove('selected');\n      selectedWord.el.classList.add('correct');\n      selectedDef.el.classList.add('correct');\n      matchedCount++;\n      matchProgress.textContent = `已配对 ${matchedCount} / ${roundPairs.length}`;\n      selectedWord = null;\n      selectedDef = null;\n      lock = false;\n      if(matchedCount === roundPairs.length){\n        winBanner.style.display = 'block';\n      }\n    } else {\n      selectedWord.el.classList.add('wrong');\n      selectedDef.el.classList.add('wrong');\n      setTimeout(()=>{\n        selectedWord.el.classList.remove('selected','wrong');\n        selectedDef.el.classList.remove('selected','wrong');\n        selectedWord = null;\n        selectedDef = null;\n        lock = false;\n      }, 500);\n    }\n  }\n}\n\ndocument.getElementById('reshuffleBtn').addEventListener('click', startRound);\n\nstartRound();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"},{"label":"HR1.7","group":"1.x","source":"26aut/ENGLISH/Human_Rights_Ch1.3_1.7_Vocab.html","inner":"p17","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Human Rights 1.3 / 1.7 词汇复习\u003c/title>\n\u003cstyle>\n  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+JP:wght@400;600&display=swap');\n\n  :root{\n    --cream:#f6f1e4;\n    --parchment:#efe6d2;\n    --sage:#8a9a7c;\n    --sage-dark:#657357;\n    --plum:#6e4e5c;\n    --gold:#c9a24b;\n    --ink:#3c352b;\n    --wrong:#b05c52;\n  }\n\n  *{box-sizing:border-box;}\n\n  body{\n    margin:0;\n    min-height:100vh;\n    background:var(--cream);\n    background-image:\n      radial-gradient(circle at 10% 10%, rgba(201,162,75,0.08), transparent 40%),\n      radial-gradient(circle at 90% 90%, rgba(110,78,92,0.08), transparent 40%);\n    font-family:'EB Garamond','Noto Serif JP',serif;\n    color:var(--ink);\n    display:flex;\n    flex-direction:column;\n    align-items:center;\n    padding:28px 16px 60px;\n  }\n\n  h1{\n    font-weight:600;\n    font-size:1.5rem;\n    margin:0 0 4px;\n    color:var(--plum);\n    text-align:center;\n  }\n  .subtitle{\n    font-style:italic;\n    color:var(--sage-dark);\n    margin-bottom:18px;\n    text-align:center;\n    font-size:0.9rem;\n  }\n\n  .page-tabs{\n    display:flex;\n    gap:8px;\n    margin-bottom:20px;\n    flex-wrap:wrap;\n    justify-content:center;\n  }\n  .page-tab{\n    border:1px solid var(--plum);\n    background:transparent;\n    color:var(--plum);\n    padding:8px 18px;\n    border-radius:999px;\n    fo    gap:8px;\n  }\n  .match-item{\n    background:linear-gradient(160deg,#fbf7ea,var(--parchment));\n    border:1px solid rgba(201,162,75,0.5);\n    border-radius:10px;\n    padding:10px 12px;\n    font-size:0.88rem;\n    line-height:1.3;\n    cursor:pointer;\n    transition:all 0.15s;\n    min-height:44px;\n    display:flex;\n    align-items:center;\n    box-shadow:0 2px 6px rgba(60,53,43,0.08);\n  }\n  .match-item.word{\n    font-weight:600;\n    color:var(--plum);\n    justify-content:center;\n    text-align:center;\n  }\n  .match-item.def{\n    color:var(--ink);\n  }\n  .match-item.selected{\n    border-color:var(--gold);\n    background:linear-gradient(160deg,#fff8e0,#f3e4bd);\n    box-shadow:0 0 0 2px rgba(201,162,75,0.5);\n  }\n  .match-item.correct{\n    background:linear-gradient(160deg,#e7edd9,#d4e0c2);\n    border-color:var(--sage);\n    color:var(--sage-dark);\n    cursor:default;\n    opacity:0.75;\n  }\n  .match-item.wrong{\n    background:#f3d9d5;\n    border-color:var(--wrong);\n    animation:shake 0.3s;\n  }\n  @keyframes shake{\n    0%,100%{transform:translateX(0);}\n    25%{transform:translateX(-4px);}\n    75%{transform:translateX(4px);}\n  }\n\n  .btn{\n    border:1px solid var(--sage);\n    background:var(--sage);\n    color:#fff;\n    font-family:inherit;\n    font-size:0.95rem;\n    padding:8px 18px;\n    border-radius:10px;\n    cursor:pointer;\n    transition:transform 0.15s, opacity 0.2s;\n  }\n  .btn.gold{\n    background:var(--gold);\n    border-color:var(--gold);\n  }\n  .btn:active{transform:scale(0.96);}\n\n  .win-banner{\n    text-align:center;\n    color:var(--sage-dark);\n    font-weight:600;\n    margin-top:14px;\n    display:none;\n  }\n\n  footer{\n    margin-top:30px;\n    font-size:0.75rem;\n    color:var(--sage-dark);\n    opacity:0.7;\n    text-align:center;\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>人権 Human Rights 词汇复习\u003c/h1>\n\u003cdiv class=\"subtitle\">Chapter 1.3 · Chapter 1.7\u003c/div>\n\n\u003cdiv class=\"page-tabs\">\n  \u003cbutton class=\"page-tab active\" data-page=\"p13\">1.3 背诵\u003c/button>\n  \u003cbutton class=\"page-tab\" data-page=\"p17\">1.7 背诵\u003c/button>\n  \u003cbutton class=\"page-tab\" data-page=\"pmatch\">🎲 配对练习\u003c/button>\n\u003c/div>\n\n\u003c!-- PAGE 1: Chapter 1.3 recitation list -->\n\u003cdiv class=\"page active\" id=\"p13\">\n  \u003cdiv class=\"section-title\">Chapter 1.3 — How The Modern Idea of Human Rights was Born\u003c/div>\n  \u003cdiv class=\"list-view\" id=\"list13\">\u003c/div>\n\u003c/div>\n\n\u003c!-- PAGE 2: Chapter 1.7 recitation list -->\n\u003cdiv class=\"page\" id=\"p17\">\n  \u003cdiv class=\"section-title\">Chapter 1.7 — Protected by Human Rights\u003c/div>\n  \u003cdiv class=\"list-view\" id=\"list17\">\u003c/div>\n\u003c/div>\n\n\u003c!-- PAGE 3: matching game -->\n\u003cdiv class=\"page\" id=\"pmatch\">\n  \u003cdiv class=\"section-title\">全部单词配对练习（左侧按字母顺序）\u003c/div>\n  \u003cdiv class=\"match-controls\">\n    \u003cbutton class=\"btn gold\" id=\"reshuffleBtn\">🔀 重新打乱释义顺序\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"match-progress\" id=\"matchProgress\">已配对 0 / 24\u003c/div>\n  \u003cdiv class=\"match-grid\">\n    \u003cdiv class=\"match-col\" id=\"wordCol\">\u003c/div>\n    \u003cdiv class=\"match-col\" id=\"defCol\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"win-banner\" id=\"winBanner\">🎉 全部配对完成！点击上方按钮再来一组\u003c/div>\n\u003c/div>\n\n\u003cfooter>Osaka Jogakuin · Integrated Reading / IR Human Rights Book — Ch 1.3 & 1.7\u003c/footer>\n\n\u003cscript>\nconst data13 = [\n  [\"fairly\",\"more than average, but less than very\",\"adv\",\"相当地；颇为\",\"more than average\"],\n  [\"acquire\",\"to get something by your own or being given it\",\"v\",\"获得\",\"get something\"],\n  [\"universal\",\"true or right at all times and in all places\",\"adj\",\"普遍的\",\"true or right at all times\"],\n  [\"prevent\",\"to stop something from happening or someone from doing something\",\"v\",\"预防；阻止\",\"stop something from happening\"],\n  [\"handicapped\",\"not able to use your body or your mind because it has been damaged\",\"adj\",\"有残疾的\",\"not able to use your body or your mind\"],\n  [\"attitude\",\"a feeling or opinion about something, especially when this shows in your behavior\",\"n\",\"态度\",\"feeling or opinion\"],\n  [\"establish\",\"to start a company or organization that will continue for a long time\",\"v\",\"建立；设立\",\"start a company or organization\"],\n  [\"freedom\",\"the state of being able to do what you want, without anything stopping you\",\"n\",\"自由\",\"do what you want\"],\n  [\"shelter\",\"a place to stay or live, especially when you need protection from bad weather or danger\",\"n\",\"住所；庇护所\",\"place to stay or live\"],\n  [\"article\",\"a section of a formal agreement or document which deals with a particular point\",\"n\",\"条款；项目\",\"section of a formal agreement\"],\n  [\"deserve\",\"it should happen to someone because of the way (s)he has behaved\",\"v\",\"应得；值得\",\"should happen to someone\"],\n  [\"mental\",\"relating to the mind, or involving the process of thinking\",\"adj\",\"精神的；心理的\",\"relating to the mind\"]\n];\n\nconst data17 = [\n  [\"suffer\",\"experience physical or mental pain\",\"v\",\"遭受；忍受\",\"physical or mental pain\"],\n  [\"legal\",\"concerned with or relating to the law\",\"adj\",\"法律的；合法的\",\"relating to the law\"],\n  [\"press\",\"reports in newspapers and on radio and television\",\"n\",\"新闻界；媒体报道\",\"reports in newspapers\"],\n  [\"arrest\",\"put them in custody for breaking the law\",\"v\",\"逮捕\",\"in custody\"],\n  [\"prison\",\"a building where people are kept as a punishment for a crime, or while they are waiting to go to court for their trial\",\"n\",\"监狱\",\"kept as a punishment\"],\n  [\"trial\",\"a formal meeting in a law court, at which a judge and jury listen to evidence and decide whether a person is guilty of a crime\",\"n\",\"审判\",\"decide whether a person is guilty\"],\n  [\"evidence\",\"facts or signs that show clearly that something exists or is true\",\"n\",\"证据\",\"facts or signs\"],\n  [\"proper\",\"right, suitable, and correct\",\"adj\",\"适当的；恰当的\",\"right, suitable, and correct\"],\n  [\"torture\",\"the act of deliberately hurting someone in order to force them to tell you something, to punish them, or to be cruel\",\"n\",\"拷问；折磨\",\"deliberately hurting someone\"],\n  [\"bondage\",\"the state of having your freedom limited, or being prevented from doing what you want\",\"n\",\"束缚\",\"freedom limited\"],\n  [\"criticize\",\"express your disapproval of someone or something, or to talk about their feeling\",\"v\",\"批评\",\"disapproval\"],\n  [\"abuse\",\"the act of treating someone cruelly and violently or the use of something in a wrong way or for a bad purpose\",\"n\",\"虐待；滥用\",\"treating someone cruelly\"]\n];\n\nfunction buildHighlightedDef(defText, keyword){\n  const frag = document.createDocumentFragment();\n  const idx = keyword ? defText.indexOf(keyword) : -1;\n  if(idx === -1){\n    frag.appendChild(document.createTextNode(defText));\n    return frag;\n  }\n  if(idx > 0) frag.appendChild(document.createTextNode(defText.slice(0, idx)));\n  const kw = document.createElement('span');\n  kw.className = 'kw';\n  kw.textContent = defText.slice(idx, idx + keyword.length);\n  frag.appendChild(kw);\n  const rest = defText.slice(idx + keyword.length);\n  if(rest) frag.appendChild(document.createTextNode(rest));\n  return frag;\n}\n\nfunction renderList(containerId, data){\n  const el = document.getElementById(containerId);\n  el.innerHTML = \"\";\n  data.forEach(([w,d,pos,cn,kw])=>{\n    const row = document.createElement('div');\n    row.className = 'list-row';\n    const wordEl = document.createElement('span');\n    wordEl.className = 'list-word';\n    wordEl.textContent = w;\n    const defCol = document.createElement('span');\n    defCol.className = 'list-def-col';\n    const defEl = document.createElement('span');\n    defEl.className = 'list-def';\n    defEl.appendChild(buildHighlightedDef(d, kw));\n    const posEl = document.createElement('span');\n    posEl.className = 'list-pos';\n    posEl.textContent = `[${pos}]`;\n    defEl.appendChild(posEl);\n    const cnEl = document.createElement('span');\n    cnEl.className = 'list-def-cn';\n    cnEl.textContent = cn;\n    defCol.appendChild(defEl);\n    defCol.appendChild(cnEl);\n    row.appendChild(wordEl);\n    row.appendChild(defCol);\n    el.appendChild(row);\n  });\n}\nrenderList('list13', data13);\nrenderList('list17', data17);\n\n// page tab switching\ndocument.querySelectorAll('.page-tab').forEach(tab=>{\n  tab.addEventListener('click', ()=>{\n    document.querySelectorAll('.page-tab').forEach(t=>t.classList.remove('active'));\n    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n    tab.classList.add('active');\n    document.getElementById(tab.dataset.page).classList.add('active');\n  });\n});\n\n// ---- matching game ----\nfunction shuffle(arr){\n  const a = [...arr];\n  for(let i=a.length-1;i>0;i--){\n    const j = Math.floor(Math.random()*(i+1));\n    [a[i],a[j]] = [a[j],a[i]];\n  }\n  return a;\n}\n\nconst wordCol = document.getElementById('wordCol');\nconst defCol = document.getElementById('defCol');\nconst matchProgress = document.getElementById('matchProgress');\nconst winBanner = document.getElementById('winBanner');\n\nlet roundPairs = [];\nlet matchedCount = 0;\nlet selectedWord = null;\nlet selectedDef = null;\nlet lock = false;\n\nfunction startRound(){\n  const pool = [...data13, ...data17].sort((a,b)=> a[0].localeCompare(b[0]));\n\n  roundPairs = pool.map((item, i)=>({id:i, word:item[0], def:item[1]}));\n  matchedCount = 0;\n  selectedWord = null;\n  selectedDef = null;\n  lock = false;\n  winBanner.style.display = 'none';\n  matchProgress.textContent = `已配对 0 / ${roundPairs.length}`;\n\n  const words = roundPairs; // alphabetical, unshuffled\n  const defs = shuffle(roundPairs);\n\n  wordCol.innerHTML = \"\";\n  defCol.innerHTML = \"\";\n\n  words.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item word';\n    el.textContent = p.word;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'word', p.id));\n    wordCol.appendChild(el);\n  });\n\n  defs.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item def';\n    el.textContent = p.def;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'def', p.id));\n    defCol.appendChild(el);\n  });\n}\n\nfunction onPick(el, kind, id){\n  if(lock || el.classList.contains('correct')) return;\n\n  if(kind === 'word'){\n    if(selectedWord) selectedWord.el.classList.remove('selected');\n    selectedWord = {el, id};\n    el.classList.add('selected');\n  } else {\n    if(selectedDef) selectedDef.el.classList.remove('selected');\n    selectedDef = {el, id};\n    el.classList.add('selected');\n  }\n\n  if(selectedWord && selectedDef){\n    lock = true;\n    if(selectedWord.id === selectedDef.id){\n      selectedWord.el.classList.remove('selected');\n      selectedDef.el.classList.remove('selected');\n      selectedWord.el.classList.add('correct');\n      selectedDef.el.classList.add('correct');\n      matchedCount++;\n      matchProgress.textContent = `已配对 ${matchedCount} / ${roundPairs.length}`;\n      selectedWord = null;\n      selectedDef = null;\n      lock = false;\n      if(matchedCount === roundPairs.length){\n        winBanner.style.display = 'block';\n      }\n    } else {\n      selectedWord.el.classList.add('wrong');\n      selectedDef.el.classList.add('wrong');\n      setTimeout(()=>{\n        selectedWord.el.classList.remove('selected','wrong');\n        selectedDef.el.classList.remove('selected','wrong');\n        selectedWord = null;\n        selectedDef = null;\n        lock = false;\n      }, 500);\n    }\n  }\n}\n\ndocument.getElementById('reshuffleBtn').addEventListener('click', startRound);\n\nstartRound();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"},{"label":"HR2.3","group":"2.x","source":"26aut/ENGLISH/Human_Rights_Ch2.3_2.7_Vocab.html","inner":"p23","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Human Rights 2.3 / 2.7 词汇复习\u003c/title>\n\u003cstyle>\n  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+JP:wght@400;600&display=swap');\n\n  :root{\n    --cream:#f6f1e4;\n    --parchment:#efe6d2;\n    --sage:#8a9a7c;\n    --sage-dark:#657357;\n    --plum:#6e4e5c;\n    --gold:#c9a24b;\n    --ink:#3c352b;\n    --wrong:#b05c52;\n  }\n\n  *{box-sizing:border-box;}\n\n  body{\n    margin:0;\n    min-height:100vh;\n    background:var(--cream);\n    background-image:\n      radial-gradient(circle at 10% 10%, rgba(201,162,75,0.08), transparent 40%),\n      radial-gradient(circle at 90% 90%, rgba(110,78,92,0.08), transparent 40%);\n    font-family:'EB Garamond','Noto Serif JP',serif;\n    color:var(--ink);\n    display:flex;\n    flex-direction:column;\n    align-items:center;\n    padding:28px 16px 60px;\n  }\n\n  h1{\n    font-weight:600;\n    font-size:1.5rem;\n    margin:0 0 4px;\n    color:var(--plum);\n    text-align:center;\n  }\n  .subtitle{\n    font-style:italic;\n    color:var(--sage-dark);\n    margin-bottom:18px;\n    text-align:center;\n    font-size:0.9rem;\n  }\n\n  .page-tabs{\n    display:flex;\n    gap:8px;\n    margin-bottom:20px;\n    flex-wrap:wrap;\n    justify-content:center;\n  }\n  .page-tab{\n    border:1px solid var(--plum);\n    background:transparent;\n    color:var(--plum);\n    padding:8px 18px;\n    border-radius:999px;\n    font-family:inherit;\n    font-size:0.92rem;\n    cursor:pointer;\n    transition:all 0.2s;\n  }\n  .page-tab.active{\n    background:var(--plum);\n    color:#fff;\n  }\n\n  .page{\n    display:none;\n    width:100%;\n    max-w -height:1.3;\n    cursor:pointer;\n    transition:all 0.15s;\n    min-height:44px;\n    display:flex;\n    align-items:center;\n    box-shadow:0 2px 6px rgba(60,53,43,0.08);\n  }\n  .match-item.word{\n    font-weight:600;\n    color:var(--plum);\n    justify-content:center;\n    text-align:center;\n  }\n  .match-item.def{\n    color:var(--ink);\n  }\n  .match-item.selected{\n    border-color:var(--gold);\n    background:linear-gradient(160deg,#fff8e0,#f3e4bd);\n    box-shadow:0 0 0 2px rgba(201,162,75,0.5);\n  }\n  .match-item.correct{\n    background:linear-gradient(160deg,#e7edd9,#d4e0c2);\n    border-color:var(--sage);\n    color:var(--sage-dark);\n    cursor:default;\n    opacity:0.75;\n  }\n  .match-item.wrong{\n    background:#f3d9d5;\n    border-color:var(--wrong);\n    animation:shake 0.3s;\n  }\n  @keyframes shake{\n    0%,100%{transform:translateX(0);}\n    25%{transform:translateX(-4px);}\n    75%{transform:translateX(4px);}\n  }\n\n  .btn{\n    border:1px solid var(--sage);\n    background:var(--sage);\n    color:#fff;\n    font-family:inherit;\n    font-size:0.95rem;\n    padding:8px 18px;\n    border-radius:10px;\n    cursor:pointer;\n    transition:transform 0.15s, opacity 0.2s;\n  }\n  .btn.gold{\n    background:var(--gold);\n    border-color:var(--gold);\n  }\n  .btn:active{transform:scale(0.96);}\n\n  .win-banner{\n    text-align:center;\n    color:var(--sage-dark);\n    font-weight:600;\n    margin-top:14px;\n    display:none;\n  }\n\n  footer{\n    margin-top:30px;\n    font-size:0.75rem;\n    color:var(--sage-dark);\n    opacity:0.7;\n    text-align:center;\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>人権 Human Rights 词汇复习\u003c/h1>\n\u003cdiv class=\"subtitle\">Chapter 2.3 · Chapter 2.7\u003c/div>\n\n\u003cdiv class=\"page-tabs\">\n  \u003cbutton class=\"page-tab active\" data-page=\"p23\">2.3 背诵\u003c/button>\n  \u003cbutton class=\"page-tab\" data-page=\"p27\">2.7 背诵\u003c/button>\n  \u003cbutton class=\"page-tab\" data-page=\"pmatch\">🎲 配对练习\u003c/button>\n\u003c/div>\n\n\u003c!-- PAGE 1: Chapter 2.3 recitation list -->\n\u003cdiv class=\"page active\" id=\"p23\">\n  \u003cdiv class=\"section-title\">Chapter 2.3 — Dominant Minorities and Powerless Majorities\u003c/div>\n  \u003cdiv class=\"list-view\" id=\"list23\">\u003c/div>\n\u003c/div>\n\n\u003c!-- PAGE 2: Chapter 2.7 recitation list -->\n\u003cdiv class=\"page\" id=\"p27\">\n  \u003cdiv class=\"section-title\">Chapter 2.7 — Changing Attitudes as Japan Welcomes International Workers and Students\u003c/div>\n  \u003cdiv class=\"list-view\" id=\"list27\">\u003c/div>\n\u003c/div>\n\n\u003c!-- PAGE 3: matching game -->\n\u003cdiv class=\"page\" id=\"pmatch\">\n  \u003cdiv class=\"section-title\">全部单词配对练习（左侧按字母顺序）\u003c/div>\n  \u003cdiv class=\"match-controls\">\n    \u003cbutton class=\"btn gold\" id=\"reshuffleBtn\">🔀 重新打乱释义顺序\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"match-progress\" id=\"matchProgress\">已配对 0 / 26\u003c/div>\n  \u003cdiv class=\"match-grid\">\n    \u003cdiv class=\"match-col\" id=\"wordCol\">\u003c/div>\n    \u003cdiv class=\"match-col\" id=\"defCol\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"win-banner\" id=\"winBanner\">🎉 全部配对完成！点击上方按钮再来一组\u003c/div>\n\u003c/div>\n\n\u003cfooter>Osaka Jogakuin · Integrated Reading / IR Human Rights Book — Ch 2.3 & 2.7\u003c/footer>\n\n\u003cscript>\nconst data23 = [\n  [\"majority\",\"the biggest group of people or things\",\"n\",\"多数派\",\"biggest group\"],\n  [\"minority\",\"less than half of the group or things\",\"n\",\"少数派\",\"less than half\"],\n  [\"exception(s)\",\"someone or something that is not included in a rule, group, or list\",\"n\",\"例外\",\"not included\"],\n  [\"a large number of\",\"many\",\"phr\",\"大量的；许多\",\"many\"],\n  [\"dominant\",\"more important, strong, or noticeable than anything else of the same type\",\"adj\",\"支配性的；占主导地位的\",\"more important, strong\"],\n  [\"vote\",\"to choose someone or something in an election or meeting by making a mark on an official piece of paper or by putting your hand up\",\"v\",\"投票\",\"choose someone\"],\n  [\"nearly\",\"almost\",\"adv\",\"几乎\",\"almost\"],\n  [\"realize\",\"to notice or understand something that you did not notice or understand before\",\"v\",\"意识到；理解\",\"notice or understand\"],\n  [\"in contrast\",\"it is used to show something or somebody is clearly different from somebody or something else\",\"id\",\"相比之下\",\"clearly different\"],\n  [\"compared to\",\"it is used to show somebody/something is similar to somebody/something else, either better or worse\",\"phv\",\"与……相比\",\"similar to\"]\n];\n\nconst data27 = [\n  [\"immigrant\",\"someone who comes to live in a different country\",\"n\",\"移民\",\"live in a different country\"],\n  [\"remote\",\"far away\",\"adj\",\"偏远的；人迹罕至的\",\"far away\"],\n  [\"current\",\"happening and existing now\",\"adj\",\"当前的；现在的\",\"existing now\"],\n  [\"permanent\",\"continuing always or for a long time\",\"adj\",\"永久的\",\"long time\"],\n  [\"temporary\",\"existing or happening for only a short time\",\"adj\",\"临时的；暂时的\",\"short time\"],\n  [\"advanced\",\"at a higher, more difficult level\",\"adj\",\"高级的；先进的\",\"higher, more difficult level\"],\n  [\"agent\",\"someone whose job is to deal with business for someone else\",\"n\",\"代理人；经纪人\",\"deal with business\"],\n  [\"deprive\",\"to take something, especially something necessary or pleasant, away from someone\",\"v\",\"剥夺\",\"away from someone\"],\n  [\"vocational\",\"providing skills and educational that prepare you for a job\",\"adj\",\"职业的；职业培训的\",\"prepare you for a job\"],\n  [\"credentials\",\"documents that state the abilities and experience of a person and show that the person is qualified for a particular job or activity\",\"n\",\"资格证明；证书\",\"qualified\"],\n  [\"sacrifice\",\"to give something that is valuable to you in order to help another person\",\"v\",\"牺牲\",\"help another person\"],\n  [\"hospitality\",\"the act of being friendly and welcoming to guests and visitors\",\"n\",\"好客；款待\",\"friendly and welcoming\"],\n  [\"up to\",\"used to say that something is less than or equal to but not more than a stated value, number, or level\",\"ph\",\"直到；多达\",\"less than or equal to\"],\n  [\"end up\",\"to reach or come to a place, condition, or situation that was not planned or expected\",\"phv\",\"最终落得；最后变成\",\"not planned or expected\"],\n  [\"turn to\",\"to go to somebody/something for help, advice, etc\",\"phv\",\"向……求助\",\"for help\"],\n  [\"sever\",\"to break or separate, especially by cutting\",\"v\",\"(强行)切断；断绝\",\"break or separate\"]\n];\n\nfunction buildHighlightedDef(defText, keyword){\n  const frag = document.createDocumentFragment();\n  const idx = keyword ? defText.indexOf(keyword) : -1;\n  if(idx === -1){\n    frag.appendChild(document.createTextNode(defText));\n    return frag;\n  }\n  if(idx > 0) frag.appendChild(document.createTextNode(defText.slice(0, idx)));\n  const kw = document.createElement('span');\n  kw.className = 'kw';\n  kw.textContent = defText.slice(idx, idx + keyword.length);\n  frag.appendChild(kw);\n  const rest = defText.slice(idx + keyword.length);\n  if(rest) frag.appendChild(document.createTextNode(rest));\n  return frag;\n}\n\nfunction renderList(containerId, data){\n  const el = document.getElementById(containerId);\n  el.innerHTML = \"\";\n  data.forEach(([w,d,pos,cn,kw])=>{\n    const row = document.createElement('div');\n    row.className = 'list-row';\n    const wordEl = document.createElement('span');\n    wordEl.className = 'list-word';\n    wordEl.textContent = w;\n    const defCol = document.createElement('span');\n    defCol.className = 'list-def-col';\n    const defEl = document.createElement('span');\n    defEl.className = 'list-def';\n    defEl.appendChild(buildHighlightedDef(d, kw));\n    const posEl = document.createElement('span');\n    posEl.className = 'list-pos';\n    posEl.textContent = `[${pos}]`;\n    defEl.appendChild(posEl);\n    const cnEl = document.createElement('span');\n    cnEl.className = 'list-def-cn';\n    cnEl.textContent = cn;\n    defCol.appendChild(defEl);\n    defCol.appendChild(cnEl);\n    row.appendChild(wordEl);\n    row.appendChild(defCol);\n    el.appendChild(row);\n  });\n}\nrenderList('list23', data23);\nrenderList('list27', data27);\n\n// page tab switching\ndocument.querySelectorAll('.page-tab').forEach(tab=>{\n  tab.addEventListener('click', ()=>{\n    document.querySelectorAll('.page-tab').forEach(t=>t.classList.remove('active'));\n    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n    tab.classList.add('active');\n    document.getElementById(tab.dataset.page).classList.add('active');\n  });\n});\n\n// ---- matching game ----\nfunction shuffle(arr){\n  const a = [...arr];\n  for(let i=a.length-1;i>0;i--){\n    const j = Math.floor(Math.random()*(i+1));\n    [a[i],a[j]] = [a[j],a[i]];\n  }\n  return a;\n}\n\nconst wordCol = document.getElementById('wordCol');\nconst defCol = document.getElementById('defCol');\nconst matchProgress = document.getElementById('matchProgress');\nconst winBanner = document.getElementById('winBanner');\n\nlet roundPairs = [];\nlet matchedCount = 0;\nlet selectedWord = null;\nlet selectedDef = null;\nlet lock = false;\n\nfunction startRound(){\n  const pool = [...data23, ...data27].sort((a,b)=> a[0].localeCompare(b[0]));\n\n  roundPairs = pool.map((item, i)=>({id:i, word:item[0], def:item[1]}));\n  matchedCount = 0;\n  selectedWord = null;\n  selectedDef = null;\n  lock = false;\n  winBanner.style.display = 'none';\n  matchProgress.textContent = `已配对 0 / ${roundPairs.length}`;\n\n  const words = roundPairs; // alphabetical, unshuffled\n  const defs = shuffle(roundPairs);\n\n  wordCol.innerHTML = \"\";\n  defCol.innerHTML = \"\";\n\n  words.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item word';\n    el.textContent = p.word;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'word', p.id));\n    wordCol.appendChild(el);\n  });\n\n  defs.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item def';\n    el.textContent = p.def;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'def', p.id));\n    defCol.appendChild(el);\n  });\n}\n\nfunction onPick(el, kind, id){\n  if(lock || el.classList.contains('correct')) return;\n\n  if(kind === 'word'){\n    if(selectedWord) selectedWord.el.classList.remove('selected');\n    selectedWord = {el, id};\n    el.classList.add('selected');\n  } else {\n    if(selectedDef) selectedDef.el.classList.remove('selected');\n    selectedDef = {el, id};\n    el.classList.add('selected');\n  }\n\n  if(selectedWord && selectedDef){\n    lock = true;\n    if(selectedWord.id === selectedDef.id){\n      selectedWord.el.classList.remove('selected');\n      selectedDef.el.classList.remove('selected');\n      selectedWord.el.classList.add('correct');\n      selectedDef.el.classList.add('correct');\n      matchedCount++;\n      matchProgress.textContent = `已配对 ${matchedCount} / ${roundPairs.length}`;\n      selectedWord = null;\n      selectedDef = null;\n      lock = false;\n      if(matchedCount === roundPairs.length){\n        winBanner.style.display = 'block';\n      }\n    } else {\n      selectedWord.el.classList.add('wrong');\n      selectedDef.el.classList.add('wrong');\n      setTimeout(()=>{\n        selectedWord.el.classList.remove('selected','wrong');\n        selectedDef.el.classList.remove('selected','wrong');\n        selectedWord = null;\n        selectedDef = null;\n        lock = false;\n      }, 500);\n    }\n  }\n}\n\ndocument.getElementById('reshuffleBtn').addEventListener('click', startRound);\n\nstartRound();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"},{"label":"HR2.7","group":"2.x","source":"26aut/ENGLISH/Human_Rights_Ch2.3_2.7_Vocab.html","inner":"p27","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"U nd:linear-gradient(160deg,#fbf7ea,var(--parchment));\n    border:1px solid rgba(201,162,75,0.4);\n    border-radius:18px;\n    box-shadow:0 8px 24px rgba(60,53,43,0.12);\n    padding:6px 20px;\n  }\n  .list-row{\n    display:flex;\n    align-items:baseline;\n    gap:14px;\n    padding:12px 0;\n    border-bottom:1px solid rgba(110,78,92,0.15);\n  }\n  .list-row:last-child{\n    border-bottom:none;\n  }\n  .list-word{\n    flex:0 0 auto;\n    background:none;\n    color:var(--plum);\n    font-weight:700;\n    font-size:1.05rem;\n    white-space:nowrap;\n  }\n  .list-def-col{\n    flex:1 1 auto;\n    display:flex;\n    flex-direction:column;\n    gap:2px;\n  }\n  .list-def{\n    font-size:0.98rem;\n    line-height:1.45;\n    color:var(--ink);\n  }\n  .kw{\n    background:#f3d675;\n    padding:1px 5px;\n    border-radius:5px;\n    font-weight:600;\n    box-shadow:0 1px 2px rgba(60,53,43,0.12);\n  }\n  .list-def-cn{\n    font-size:0.85rem;\n    color:var(--sage-dark);\n  }\n  .list-pos{\n    font-size:0.72rem;\n    color:var(--sage-dark);\n    margin-left:4px;\n    font-style:italic;\n  }\n\n  /* matching game */\n  .match-controls{\n    display:flex;\n    gap:8px;\n    justify-content:center;\n    margin-bottom:14px;\n    flex-wrap:wrap;\n  }\n  .match-progress{\n    text-align:center;\n    color:var(--plum);\n    font-size:0.95rem;\n    margin-bottom:14px;\n    letter-spacing:0.02em;\n  }\n  .match-grid{\n    display:flex;\n    gap:14px;\n  }\n  .match-col{\n    flex:1;\n    display:flex;\n    flex-direction:column;\n    gap:8px;\n  }\n  .match-item{\n    background:linear-gradient(160deg,#fbf7ea,var(--parchment));\n    border:1px solid rgba(201,162,75,0.5);\n    border-radius:10px;\n    padding:10px 12px;\n    font-size:0.88rem;\n    line-height:1.3;\n    cursor:pointer;\n    transition:all 0.15s;\n    min-height:44px;\n    display:flex;\n    align-items:center;\n    box-shadow:0 2px 6px rgba(60,53,43,0.08);\n  }\n  .match-item.word{\n    font-weight:600;\n    color:var(--plum);\n    justify-content:center;\n    text-align:center;\n  }\n  .match-item.def{\n    color:var(--ink);\n  }\n  .match-item.selected{\n    border-color:var(--gold);\n    background:linear-gradient(160deg,#fff8e0,#f3e4bd);\n    box-shadow:0 0 0 2px rgba(201,162,75,0.5);\n  }\n  .match-item.correct{\n    background:linear-gradient(160deg,#e7edd9,#d4e0c2);\n    border-color:var(--sage);\n    color:var(--sage-dark);\n    cursor:default;\n    opacity:0.75;\n  }\n  .match-item.wrong{\n    background:#f3d9d5;\n    border-color:var(--wrong);\n    animation:shake 0.3s;\n  }\n  @keyframes shake{\n    0%,100%{transform:translateX(0);}\n    25%{transform:translateX(-4px);}\n    75%{transform:translateX(4px);}\n  }\n\n  .btn{\n    border:1px solid var(--sage);\n    background:var(--sage);\n    color:#fff;\n    font-family:inherit;\n    font-size:0.95rem;\n    padding:8px 18px;\n    border-radius:10px;\n    cursor:pointer;\n    transition:transform 0.15s, opacity 0.2s;\n  }\n  .btn.gold{\n    background:var(--gold);\n    border-color:var(--gold);\n  }\n  .btn:active{transform:scale(0.96);}\n\n  .win-banner{\n    text-align:center;\n    color:var(--sage-dark);\n    font-weight:600;\n    margin-top:14px;\n    display:none;\n  }\n\n  footer{\n    margin-top:30px;\n    font-size:0.75rem;\n    color:var(--sage-dark);\n    opacity:0.7;\n    text-align:center;\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>人権 Human Rights 词汇复习\u003c/h1>\n\u003cdiv class=\"subtitle\">Chapter 2.3 · Chapter 2.7\u003c/div>\n\n\u003cdiv class=\"page-tabs\">\n  \u003cbutton class=\"page-tab active\" data-page=\"p23\">2.3 背诵\u003c/button>\n  \u003cbutton class=\"page-tab\" data-page=\"p27\">2.7 背诵\u003c/button>\n  \u003cbutton class=\"page-tab\" data-page=\"pmatch\">🎲 配对练习\u003c/button>\n\u003c/div>\n\n\u003c!-- PAGE 1: Chapter 2.3 recitation list -->\n\u003cdiv class=\"page active\" id=\"p23\">\n  \u003cdiv class=\"section-title\">Chapter 2.3 — Dominant Minorities and Powerless Majorities\u003c/div>\n  \u003cdiv class=\"list-view\" id=\"list23\">\u003c/div>\n\u003c/div>\n\n\u003c!-- PAGE 2: Chapter 2.7 recitation list -->\n\u003cdiv class=\"page\" id=\"p27\">\n  \u003cdiv class=\"section-title\">Chapter 2.7 — Changing Attitudes as Japan Welcomes International Workers and Students\u003c/div>\n  \u003cdiv class=\"list-view\" id=\"list27\">\u003c/div>\n\u003c/div>\n\n\u003c!-- PAGE 3: matching game -->\n\u003cdiv class=\"page\" id=\"pmatch\">\n  \u003cdiv class=\"section-title\">全部单词配对练习（左侧按字母顺序）\u003c/div>\n  \u003cdiv class=\"match-controls\">\n    \u003cbutton class=\"btn gold\" id=\"reshuffleBtn\">🔀 重新打乱释义顺序\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"match-progress\" id=\"matchProgress\">已配对 0 / 26\u003c/div>\n  \u003cdiv class=\"match-grid\">\n    \u003cdiv class=\"match-col\" id=\"wordCol\">\u003c/div>\n    \u003cdiv class=\"match-col\" id=\"defCol\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"win-banner\" id=\"winBanner\">🎉 全部配对完成！点击上方按钮再来一组\u003c/div>\n\u003c/div>\n\n\u003cfooter>Osaka Jogakuin · Integrated Reading / IR Human Rights Book — Ch 2.3 & 2.7\u003c/footer>\n\n\u003cscript>\nconst data23 = [\n  [\"majority\",\"the biggest group of people or things\",\"n\",\"多数派\",\"biggest group\"],\n  [\"minority\",\"less than half of the group or things\",\"n\",\"少数派\",\"less than half\"],\n  [\"exception(s)\",\"someone or something that is not included in a rule, group, or list\",\"n\",\"例外\",\"not included\"],\n  [\"a large number of\",\"many\",\"phr\",\"大量的；许多\",\"many\"],\n  [\"dominant\",\"more important, strong, or noticeable than anything else of the same type\",\"adj\",\"支配性的；占主导地位的\",\"more important, strong\"],\n  [\"vote\",\"to choose someone or something in an election or meeting by making a mark on an official piece of paper or by putting your hand up\",\"v\",\"投票\",\"choose someone\"],\n  [\"nearly\",\"almost\",\"adv\",\"几乎\",\"almost\"],\n  [\"realize\",\"to notice or understand something that you did not notice or understand before\",\"v\",\"意识到；理解\",\"notice or understand\"],\n  [\"in contrast\",\"it is used to show something or somebody is clearly different from somebody or something else\",\"id\",\"相比之下\",\"clearly different\"],\n  [\"compared to\",\"it is used to show somebody/something is similar to somebody/something else, either better or worse\",\"phv\",\"与……相比\",\"similar to\"]\n];\n\nconst data27 = [\n  [\"immigrant\",\"someone who comes to live in a different country\",\"n\",\"移民\",\"live in a different country\"],\n  [\"remote\",\"far away\",\"adj\",\"偏远的；人迹罕至的\",\"far away\"],\n  [\"current\",\"happening and existing now\",\"adj\",\"当前的；现在的\",\"existing now\"],\n  [\"permanent\",\"continuing always or for a long time\",\"adj\",\"永久的\",\"long time\"],\n  [\"temporary\",\"existing or happening for only a short time\",\"adj\",\"临时的；暂时的\",\"short time\"],\n  [\"advanced\",\"at a higher, more difficult level\",\"adj\",\"高级的；先进的\",\"higher, more difficult level\"],\n  [\"agent\",\"someone whose job is to deal with business for someone else\",\"n\",\"代理人；经纪人\",\"deal with business\"],\n  [\"deprive\",\"to take something, especially something necessary or pleasant, away from someone\",\"v\",\"剥夺\",\"away from someone\"],\n  [\"vocational\",\"providing skills and educational that prepare you for a job\",\"adj\",\"职业的；职业培训的\",\"prepare you for a job\"],\n  [\"credentials\",\"documents that state the abilities and experience of a person and show that the person is qualified for a particular job or activity\",\"n\",\"资格证明；证书\",\"qualified\"],\n  [\"sacrifice\",\"to give something that is valuable to you in order to help another person\",\"v\",\"牺牲\",\"help another person\"],\n  [\"hospitality\",\"the act of being friendly and welcoming to guests and visitors\",\"n\",\"好客；款待\",\"friendly and welcoming\"],\n  [\"up to\",\"used to say that something is less than or equal to but not more than a stated value, number, or level\",\"ph\",\"直到；多达\",\"less than or equal to\"],\n  [\"end up\",\"to reach or come to a place, condition, or situation that was not planned or expected\",\"phv\",\"最终落得；最后变成\",\"not planned or expected\"],\n  [\"turn to\",\"to go to somebody/something for help, advice, etc\",\"phv\",\"向……求助\",\"for help\"],\n  [\"sever\",\"to break or separate, especially by cutting\",\"v\",\"(强行)切断；断绝\",\"break or separate\"]\n];\n\nfunction buildHighlightedDef(defText, keyword){\n  const frag = document.createDocumentFragment();\n  const idx = keyword ? defText.indexOf(keyword) : -1;\n  if(idx === -1){\n    frag.appendChild(document.createTextNode(defText));\n    return frag;\n  }\n  if(idx > 0) frag.appendChild(document.createTextNode(defText.slice(0, idx)));\n  const kw = document.createElement('span');\n  kw.className = 'kw';\n  kw.textContent = defText.slice(idx, idx + keyword.length);\n  frag.appendChild(kw);\n  const rest = defText.slice(idx + keyword.length);\n  if(rest) frag.appendChild(document.createTextNode(rest));\n  return frag;\n}\n\nfunction renderList(containerId, data){\n  const el = document.getElementById(containerId);\n  el.innerHTML = \"\";\n  data.forEach(([w,d,pos,cn,kw])=>{\n    const row = document.createElement('div');\n    row.className = 'list-row';\n    const wordEl = document.createElement('span');\n    wordEl.className = 'list-word';\n    wordEl.textContent = w;\n    const defCol = document.createElement('span');\n    defCol.className = 'list-def-col';\n    const defEl = document.createElement('span');\n    defEl.className = 'list-def';\n    defEl.appendChild(buildHighlightedDef(d, kw));\n    const posEl = document.createElement('span');\n    posEl.className = 'list-pos';\n    posEl.textContent = `[${pos}]`;\n    defEl.appendChild(posEl);\n    const cnEl = document.createElement('span');\n    cnEl.className = 'list-def-cn';\n    cnEl.textContent = cn;\n    defCol.appendChild(defEl);\n    defCol.appendChild(cnEl);\n    row.appendChild(wordEl);\n    row.appendChild(defCol);\n    el.appendChild(row);\n  });\n}\nrenderList('list23', data23);\nrenderList('list27', data27);\n\n// page tab switching\ndocument.querySelectorAll('.page-tab').forEach(tab=>{\n  tab.addEventListener('click', ()=>{\n    document.querySelectorAll('.page-tab').forEach(t=>t.classList.remove('active'));\n    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n    tab.classList.add('active');\n    document.getElementById(tab.dataset.page).classList.add('active');\n  });\n});\n\n// ---- matching game ----\nfunction shuffle(arr){\n  const a = [...arr];\n  for(let i=a.length-1;i>0;i--){\n    const j = Math.floor(Math.random()*(i+1));\n    [a[i],a[j]] = [a[j],a[i]];\n  }\n  return a;\n}\n\nconst wordCol = document.getElementById('wordCol');\nconst defCol = document.getElementById('defCol');\nconst matchProgress = document.getElementById('matchProgress');\nconst winBanner = document.getElementById('winBanner');\n\nlet roundPairs = [];\nlet matchedCount = 0;\nlet selectedWord = null;\nlet selectedDef = null;\nlet lock = false;\n\nfunction startRound(){\n  const pool = [...data23, ...data27].sort((a,b)=> a[0].localeCompare(b[0]));\n\n  roundPairs = pool.map((item, i)=>({id:i, word:item[0], def:item[1]}));\n  matchedCount = 0;\n  selectedWord = null;\n  selectedDef = null;\n  lock = false;\n  winBanner.style.display = 'none';\n  matchProgress.textContent = `已配对 0 / ${roundPairs.length}`;\n\n  const words = roundPairs; // alphabetical, unshuffled\n  const defs = shuffle(roundPairs);\n\n  wordCol.innerHTML = \"\";\n  defCol.innerHTML = \"\";\n\n  words.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item word';\n    el.textContent = p.word;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'word', p.id));\n    wordCol.appendChild(el);\n  });\n\n  defs.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item def';\n    el.textContent = p.def;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'def', p.id));\n    defCol.appendChild(el);\n  });\n}\n\nfunction onPick(el, kind, id){\n  if(lock || el.classList.contains('correct')) return;\n\n  if(kind === 'word'){\n    if(selectedWord) selectedWord.el.classList.remove('selected');\n    selectedWord = {el, id};\n    el.classList.add('selected');\n  } else {\n    if(selectedDef) selectedDef.el.classList.remove('selected');\n    selectedDef = {el, id};\n    el.classList.add('selected');\n  }\n\n  if(selectedWord && selectedDef){\n    lock = true;\n    if(selectedWord.id === selectedDef.id){\n      selectedWord.el.classList.remove('selected');\n      selectedDef.el.classList.remove('selected');\n      selectedWord.el.classList.add('correct');\n      selectedDef.el.classList.add('correct');\n      matchedCount++;\n      matchProgress.textContent = `已配对 ${matchedCount} / ${roundPairs.length}`;\n      selectedWord = null;\n      selectedDef = null;\n      lock = false;\n      if(matchedCount === roundPairs.length){\n        winBanner.style.display = 'block';\n      }\n    } else {\n      selectedWord.el.classList.add('wrong');\n      selectedDef.el.classList.add('wrong');\n      setTimeout(()=>{\n        selectedWord.el.classList.remove('selected','wrong');\n        selectedDef.el.classList.remove('selected','wrong');\n        selectedWord = null;\n        selectedDef = null;\n        lock = false;\n      }, 500);\n    }\n  }\n}\n\ndocument.getElementById('reshuffleBtn').addEventListener('click', startRound);\n\nstartRound();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"},{"label":"HR2.10","group":"2.x","source":"26aut/ENGLISH/Human_Rights_Ch2.10_Vocab.html","inner":"p210","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Human Rights 2.10 词汇复习\u003c/title>\n\u003cstyle>\n  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,40 n-items:baseline;\n    gap:14px;\n    padding:12px 0;\n    border-bottom:1px solid rgba(110,78,92,0.15);\n  }\n  .list-row:last-child{\n    border-bottom:none;\n  }\n  .list-word{\n    flex:0 0 auto;\n    background:none;\n    color:var(--plum);\n    font-weight:700;\n    font-size:1.05rem;\n    white-space:nowrap;\n  }\n  .list-def-col{\n    flex:1 1 auto;\n    display:flex;\n    flex-direction:column;\n    gap:2px;\n  }\n  .list-def{\n    font-size:0.98rem;\n    line-height:1.45;\n    color:var(--ink);\n  }\n  .list-def-cn{\n    font-size:0.85rem;\n    color:var(--sage-dark);\n  }\n  .list-pos{\n    font-size:0.72rem;\n    color:var(--sage-dark);\n    margin-left:4px;\n    font-style:italic;\n  }\n  .kw{\n    background:#f3d675;\n    padding:1px 5px;\n    border-radius:5px;\n    font-weight:600;\n    box-shadow:0 1px 2px rgba(60,53,43,0.12);\n  }\n\n  /* matching game */\n  .match-controls{\n    display:flex;\n    gap:8px;\n    justify-content:center;\n    margin-bottom:14px;\n    flex-wrap:wrap;\n  }\n  .match-progress{\n    text-align:center;\n    color:var(--plum);\n    font-size:0.95rem;\n    margin-bottom:14px;\n    letter-spacing:0.02em;\n  }\n  .match-grid{\n    display:flex;\n    gap:14px;\n  }\n  .match-col{\n    flex:1;\n    display:flex;\n    flex-direction:column;\n    gap:8px;\n  }\n  .match-item{\n    background:linear-gradient(160deg,#fbf7ea,var(--parchment));\n    border:1px solid rgba(201,162,75,0.5);\n    border-radius:10px;\n    padding:10px 12px;\n    font-size:0.88rem;\n    line-height:1.3;\n    cursor:pointer;\n    transition:all 0.15s;\n    min-height:44px;\n    display:flex;\n    align-items:center;\n    box-shadow:0 2px 6px rgba(60,53,43,0.08);\n  }\n  .match-item.word{\n    font-weight:600;\n    color:var(--plum);\n    justify-content:center;\n    text-align:center;\n  }\n  .match-item.def{\n    color:var(--ink);\n  }\n  .match-item.selected{\n    border-color:var(--gold);\n    background:linear-gradient(160deg,#fff8e0,#f3e4bd);\n    box-shadow:0 0 0 2px rgba(201,162,75,0.5);\n  }\n  .match-item.correct{\n    background:linear-gradient(160deg,#e7edd9,#d4e0c2);\n    border-color:var(--sage);\n    color:var(--sage-dark);\n    cursor:default;\n    opacity:0.75;\n  }\n  .match-item.wrong{\n    background:#f3d9d5;\n    border-color:var(--wrong);\n    animation:shake 0.3s;\n  }\n  @keyframes shake{\n    0%,100%{transform:translateX(0);}\n    25%{transform:translateX(-4px);}\n    75%{transform:translateX(4px);}\n  }\n\n  .btn{\n    border:1px solid var(--sage);\n    background:var(--sage);\n    color:#fff;\n    font-family:inherit;\n    font-size:0.95rem;\n    padding:8px 18px;\n    border-radius:10px;\n    cursor:pointer;\n    transition:transform 0.15s, opacity 0.2s;\n  }\n  .btn.gold{\n    background:var(--gold);\n    border-color:var(--gold);\n  }\n  .btn:active{transform:scale(0.96);}\n\n  .win-banner{\n    text-align:center;\n    color:var(--sage-dark);\n    font-weight:600;\n    margin-top:14px;\n    display:none;\n  }\n\n  footer{\n    margin-top:30px;\n    font-size:0.75rem;\n    color:var(--sage-dark);\n    opacity:0.7;\n    text-align:center;\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>人権 Human Rights 词汇复习\u003c/h1>\n\u003cdiv class=\"subtitle\">Chapter 2.10\u003c/div>\n\n\u003cdiv class=\"page-tabs\">\n  \u003cbutton class=\"page-tab active\" data-page=\"p210\">2.10 背诵\u003c/button>\n  \u003cbutton class=\"page-tab\" data-page=\"pmatch\">🎲 配对练习\u003c/button>\n\u003c/div>\n\n\u003c!-- PAGE 1: Chapter 2.10 recitation list -->\n\u003cdiv class=\"page active\" id=\"p210\">\n  \u003cdiv class=\"section-title\">Chapter 2.10 — Model Essay: First People of the New World\u003c/div>\n  \u003cdiv class=\"list-view\" id=\"list210\">\u003c/div>\n\u003c/div>\n\n\u003c!-- PAGE 2: matching game -->\n\u003cdiv class=\"page\" id=\"pmatch\">\n  \u003cdiv class=\"section-title\">全部单词配对练习（左侧按字母顺序）\u003c/div>\n  \u003cdiv class=\"match-controls\">\n    \u003cbutton class=\"btn gold\" id=\"reshuffleBtn\">🔀 重新打乱释义顺序\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"match-progress\" id=\"matchProgress\">已配对 0 / 12\u003c/div>\n  \u003cdiv class=\"match-grid\">\n    \u003cdiv class=\"match-col\" id=\"wordCol\">\u003c/div>\n    \u003cdiv class=\"match-col\" id=\"defCol\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"win-banner\" id=\"winBanner\">🎉 全部配对完成！点击上方按钮再来一组\u003c/div>\n\u003c/div>\n\n\u003cfooter>Osaka Jogakuin · Integrated Reading / IR Human Rights Book — Ch 2.10\u003c/footer>\n\n\u003cscript>\nconst data210 = [\n  [\"explorer\",\"someone who travels to places where no one has ever been in order to find out what is there\",\"n\",\"探险家\",\"travels to places where no one has ever been\"],\n  [\"genocide\",\"the crime of deliberately destroying part or all of a national, ethnic, racial, or religious group by killing people\",\"n\",\"种族灭绝；大屠杀\",\"destroying part or all of a national, ethnic, racial, or religious group\"],\n  [\"violation\",\"an action that breaks a law, agreement, rule, etc.\",\"n\",\"违反；侵犯\",\"breaks a law, agreement, rule\"],\n  [\"property\",\"an object, a building, or an area of land that belongs to someone\",\"n\",\"财产；地产\",\"belongs to someone\"],\n  [\"murder\",\"the crime of intentionally killing a person\",\"n\",\"谋杀\",\"intentionally killing a person\"],\n  [\"vast\",\"extremely big; huge\",\"adj\",\"巨大的；辽阔的\",\"extremely big; huge\"],\n  [\"distinct\",\"clearly noticeable; that certainly exists\",\"adj\",\"明显的；独特的\",\"clearly noticeable\"],\n  [\"indigenous\",\"existing naturally or having always lived in a place; native\",\"adj\",\"土著的；本土的\",\"having always lived in a place\"],\n  [\"marginalize\",\"to treat someone or something as if they are not important\",\"v\",\"边缘化；轻视\",\"not important\"],\n  [\"settler\",\"a person who arrives, especially from another country, in a new place in order to live there and use the land\",\"n\",\"定居者；移民\",\"live there and use the land\"],\n  [\"citizenship\",\"the state of being a member of a particular country and having rights because of it\",\"n\",\"公民身份；国籍\",\"member of a particular country\"],\n  [\"descendant\",\"a person who is related to you and who lives after you, such as your child or grandchildren\",\"n\",\"后代；子孙\",\"lives after you\"]\n];\n\nfunction buildHighlightedDef(defText, keyword){\n  const frag = document.createDocumentFragment();\n  const idx = keyword ? defText.indexOf(keyword) : -1;\n  if(idx === -1){\n    frag.appendChild(document.createTextNode(defText));\n    return frag;\n  }\n  if(idx > 0) frag.appendChild(document.createTextNode(defText.slice(0, idx)));\n  const kw = document.createElement('span');\n  kw.className = 'kw';\n  kw.textContent = defText.slice(idx, idx + keyword.length);\n  frag.appendChild(kw);\n  const rest = defText.slice(idx + keyword.length);\n  if(rest) frag.appendChild(document.createTextNode(rest));\n  return frag;\n}\n\nfunction renderList(containerId, data){\n  const el = document.getElementById(containerId);\n  el.innerHTML = \"\";\n  data.forEach(([w,d,pos,cn,kw])=>{\n    const row = document.createElement('div');\n    row.className = 'list-row';\n    const wordEl = document.createElement('span');\n    wordEl.className = 'list-word';\n    wordEl.textContent = w;\n    const defCol = document.createElement('span');\n    defCol.className = 'list-def-col';\n    const defEl = document.createElement('span');\n    defEl.className = 'list-def';\n    defEl.appendChild(buildHighlightedDef(d, kw));\n    const posEl = document.createElement('span');\n    posEl.className = 'list-pos';\n    posEl.textContent = `[${pos}]`;\n    defEl.appendChild(posEl);\n    const cnEl = document.createElement('span');\n    cnEl.className = 'list-def-cn';\n    cnEl.textContent = cn;\n    defCol.appendChild(defEl);\n    defCol.appendChild(cnEl);\n    row.appendChild(wordEl);\n    row.appendChild(defCol);\n    el.appendChild(row);\n  });\n}\nrenderList('list210', data210);\n\n// page tab switching\ndocument.querySelectorAll('.page-tab').forEach(tab=>{\n  tab.addEventListener('click', ()=>{\n    document.querySelectorAll('.page-tab').forEach(t=>t.classList.remove('active'));\n    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n    tab.classList.add('active');\n    document.getElementById(tab.dataset.page).classList.add('active');\n  });\n});\n\n// ---- matching game ----\nfunction shuffle(arr){\n  const a = [...arr];\n  for(let i=a.length-1;i>0;i--){\n    const j = Math.floor(Math.random()*(i+1));\n    [a[i],a[j]] = [a[j],a[i]];\n  }\n  return a;\n}\n\nconst wordCol = document.getElementById('wordCol');\nconst defCol = document.getElementById('defCol');\nconst matchProgress = document.getElementById('matchProgress');\nconst winBanner = document.getElementById('winBanner');\n\nlet roundPairs = [];\nlet matchedCount = 0;\nlet selectedWord = null;\nlet selectedDef = null;\nlet lock = false;\n\nfunction startRound(){\n  const pool = [...data210].sort((a,b)=> a[0].localeCompare(b[0]));\n\n  roundPairs = pool.map((item, i)=>({id:i, word:item[0], def:item[1]}));\n  matchedCount = 0;\n  selectedWord = null;\n  selectedDef = null;\n  lock = false;\n  winBanner.style.display = 'none';\n  matchProgress.textContent = `已配对 0 / ${roundPairs.length}`;\n\n  const words = roundPairs; // alphabetical, unshuffled\n  const defs = shuffle(roundPairs);\n\n  wordCol.innerHTML = \"\";\n  defCol.innerHTML = \"\";\n\n  words.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item word';\n    el.textContent = p.word;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'word', p.id));\n    wordCol.appendChild(el);\n  });\n\n  defs.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item def';\n    el.textContent = p.def;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'def', p.id));\n    defCol.appendChild(el);\n  });\n}\n\nfunction onPick(el, kind, id){\n  if(lock || el.classList.contains('correct')) return;\n\n  if(kind === 'word'){\n    if(selectedWord) selectedWord.el.classList.remove('selected');\n    selectedWord = {el, id};\n    el.classList.add('selected');\n  } else {\n    if(selectedDef) selectedDef.el.classList.remove('selected');\n    selectedDef = {el, id};\n    el.classList.add('selected');\n  }\n\n  if(selectedWord && selectedDef){\n    lock = true;\n    if(selectedWord.id === selectedDef.id){\n      selectedWord.el.classList.remove('selected');\n      selectedDef.el.classList.remove('selected');\n      selectedWord.el.classList.add('correct');\n      selectedDef.el.classList.add('correct');\n      matchedCount++;\n      matchProgress.textContent = `已配对 ${matchedCount} / ${roundPairs.length}`;\n      selectedWord = null;\n      selectedDef = null;\n      lock = false;\n      if(matchedCount === roundPairs.length){\n        winBanner.style.display = 'block';\n      }\n    } else {\n      selectedWord.el.classList.add('wrong');\n      selectedDef.el.classList.add('wrong');\n      setTimeout(()=>{\n        selectedWord.el.classList.remove('selected','wrong');\n        selectedDef.el.classList.remove('selected','wrong');\n        selectedWord = null;\n        selectedDef = null;\n        lock = false;\n      }, 500);\n    }\n  }\n}\n\ndocument.getElementById('reshuffleBtn').addEventListener('click', startRound);\n\nstartRound();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"},{"label":"HR3.3","group":"3.x","source":"26aut/ENGLISH/Human_Rights_Ch3.3_Vocab.html","inner":"p33","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Human Rights 3.3 词汇复习\u003c/title>\n\u003cstyle>\n  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+JP:wght@400;600&display=swap');\n\n  :root{\n    --cream:#f6f1e4;\n    --parchment:#efe6d2;\n    --sage:# color:var(--sage);\n    color:var(--sage-dark);\n    cursor:default;\n    opacity:0.75;\n  }\n  .match-item.wrong{\n    background:#f3d9d5;\n    border-color:var(--wrong);\n    animation:shake 0.3s;\n  }\n  @keyframes shake{\n    0%,100%{transform:translateX(0);}\n    25%{transform:translateX(-4px);}\n    75%{transform:translateX(4px);}\n  }\n\n  .btn{\n    border:1px solid var(--sage);\n    background:var(--sage);\n    color:#fff;\n    font-family:inherit;\n    font-size:0.95rem;\n    padding:8px 18px;\n    border-radius:10px;\n    cursor:pointer;\n    transition:transform 0.15s, opacity 0.2s;\n  }\n  .btn.gold{\n    background:var(--gold);\n    border-color:var(--gold);\n  }\n  .btn:active{transform:scale(0.96);}\n\n  .win-banner{\n    text-align:center;\n    color:var(--sage-dark);\n    font-weight:600;\n    margin-top:14px;\n    display:none;\n  }\n\n  footer{\n    margin-top:30px;\n    font-size:0.75rem;\n    color:var(--sage-dark);\n    opacity:0.7;\n    text-align:center;\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>人権 Human Rights 词汇复习\u003c/h1>\n\u003cdiv class=\"subtitle\">Chapter 3.3\u003c/div>\n\n\u003cdiv class=\"page-tabs\">\n  \u003cbutton class=\"page-tab active\" data-page=\"p33\">3.3 背诵\u003c/button>\n  \u003cbutton class=\"page-tab\" data-page=\"pmatch\">🎲 配对练习\u003c/button>\n\u003c/div>\n\n\u003c!-- PAGE 1: Chapter 3.3 recitation list -->\n\u003cdiv class=\"page active\" id=\"p33\">\n  \u003cdiv class=\"section-title\">Chapter 3.3 — Discrimination Against Women in Japan\u003c/div>\n  \u003cdiv class=\"list-view\" id=\"list33\">\u003c/div>\n\u003c/div>\n\n\u003c!-- PAGE 2: matching game -->\n\u003cdiv class=\"page\" id=\"pmatch\">\n  \u003cdiv class=\"section-title\">全部单词配对练习（左侧按字母顺序）\u003c/div>\n  \u003cdiv class=\"match-controls\">\n    \u003cbutton class=\"btn gold\" id=\"reshuffleBtn\">🔀 重新打乱释义顺序\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"match-progress\" id=\"matchProgress\">已配对 0 / 10\u003c/div>\n  \u003cdiv class=\"match-grid\">\n    \u003cdiv class=\"match-col\" id=\"wordCol\">\u003c/div>\n    \u003cdiv class=\"match-col\" id=\"defCol\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"win-banner\" id=\"winBanner\">🎉 全部配对完成！点击上方按钮再来一组\u003c/div>\n\u003c/div>\n\n\u003cfooter>Osaka Jogakuin · Integrated Reading / IR Human Rights Book — Ch 3.3\u003c/footer>\n\n\u003cscript>\nconst data33 = [\n  [\"face\",\"to deal with something (e.g., problem, or difficult situations)\",\"v\",\"面对；面临\",\"deal with something\"],\n  [\"discrimination\",\"treating a person or particular group of people differently, especially in a worse way from the way in which you treat other people, because of the skin color, sex, sexuality, etc\",\"n\",\"歧视\",\"treating a person or particular group of people differently\"],\n  [\"manager\",\"the person who is responsible for managing an organization\",\"n\",\"经理；管理者\",\"responsible for managing an organization\"],\n  [\"qualified\",\"having the standard skill, knowledge, or ability that is necessary for doing or being something\",\"adj\",\"合格的；有资格的\",\"standard skill, knowledge, or ability\"],\n  [\"patriarchal\",\"ruled or controlled by men\",\"adj\",\"父权制的；家长制的\",\"ruled or controlled by men\"],\n  [\"promote\",\"to raise someone to a higher or more important position or rank\",\"v\",\"晋升；提升\",\"higher or more important position or rank\"],\n  [\"pregnant\",\"having a baby or babies developing inside the womb\",\"adj\",\"怀孕的\",\"developing inside the womb\"],\n  [\"leave\",\"time allowed away from work for a holiday or illness\",\"n\",\"假期；休假\",\"time allowed away from work\"],\n  [\"housewife\",\"a woman whose job is inside the home, doing the cleaning, cooking, etc., and who usually dose not have any other job\",\"n\",\"家庭主妇\",\"job is inside the home\"],\n  [\"give birth to\",\"to produce a baby from one's body\",\"phv\",\"生育；产下\",\"produce a baby\"]\n];\n\nfunction buildHighlightedDef(defText, keyword){\n  const frag = document.createDocumentFragment();\n  const idx = keyword ? defText.indexOf(keyword) : -1;\n  if(idx === -1){\n    frag.appendChild(document.createTextNode(defText));\n    return frag;\n  }\n  if(idx > 0) frag.appendChild(document.createTextNode(defText.slice(0, idx)));\n  const kw = document.createElement('span');\n  kw.className = 'kw';\n  kw.textContent = defText.slice(idx, idx + keyword.length);\n  frag.appendChild(kw);\n  const rest = defText.slice(idx + keyword.length);\n  if(rest) frag.appendChild(document.createTextNode(rest));\n  return frag;\n}\n\nfunction renderList(containerId, data){\n  const el = document.getElementById(containerId);\n  el.innerHTML = \"\";\n  data.forEach(([w,d,pos,cn,kw])=>{\n    const row = document.createElement('div');\n    row.className = 'list-row';\n    const wordEl = document.createElement('span');\n    wordEl.className = 'list-word';\n    wordEl.textContent = w;\n    const defCol = document.createElement('span');\n    defCol.className = 'list-def-col';\n    const defEl = document.createElement('span');\n    defEl.className = 'list-def';\n    defEl.appendChild(buildHighlightedDef(d, kw));\n    const posEl = document.createElement('span');\n    posEl.className = 'list-pos';\n    posEl.textContent = `[${pos}]`;\n    defEl.appendChild(posEl);\n    const cnEl = document.createElement('span');\n    cnEl.className = 'list-def-cn';\n    cnEl.textContent = cn;\n    defCol.appendChild(defEl);\n    defCol.appendChild(cnEl);\n    row.appendChild(wordEl);\n    row.appendChild(defCol);\n    el.appendChild(row);\n  });\n}\nrenderList('list33', data33);\n\n// page tab switching\ndocument.querySelectorAll('.page-tab').forEach(tab=>{\n  tab.addEventListener('click', ()=>{\n    document.querySelectorAll('.page-tab').forEach(t=>t.classList.remove('active'));\n    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n    tab.classList.add('active');\n    document.getElementById(tab.dataset.page).classList.add('active');\n  });\n});\n\n// ---- matching game ----\nfunction shuffle(arr){\n  const a = [...arr];\n  for(let i=a.length-1;i>0;i--){\n    const j = Math.floor(Math.random()*(i+1));\n    [a[i],a[j]] = [a[j],a[i]];\n  }\n  return a;\n}\n\nconst wordCol = document.getElementById('wordCol');\nconst defCol = document.getElementById('defCol');\nconst matchProgress = document.getElementById('matchProgress');\nconst winBanner = document.getElementById('winBanner');\n\nlet roundPairs = [];\nlet matchedCount = 0;\nlet selectedWord = null;\nlet selectedDef = null;\nlet lock = false;\n\nfunction startRound(){\n  const pool = [...data33].sort((a,b)=> a[0].localeCompare(b[0]));\n\n  roundPairs = pool.map((item, i)=>({id:i, word:item[0], def:item[1]}));\n  matchedCount = 0;\n  selectedWord = null;\n  selectedDef = null;\n  lock = false;\n  winBanner.style.display = 'none';\n  matchProgress.textContent = `已配对 0 / ${roundPairs.length}`;\n\n  const words = roundPairs; // alphabetical, unshuffled\n  const defs = shuffle(roundPairs);\n\n  wordCol.innerHTML = \"\";\n  defCol.innerHTML = \"\";\n\n  words.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item word';\n    el.textContent = p.word;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'word', p.id));\n    wordCol.appendChild(el);\n  });\n\n  defs.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item def';\n    el.textContent = p.def;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'def', p.id));\n    defCol.appendChild(el);\n  });\n}\n\nfunction onPick(el, kind, id){\n  if(lock || el.classList.contains('correct')) return;\n\n  if(kind === 'word'){\n    if(selectedWord) selectedWord.el.classList.remove('selected');\n    selectedWord = {el, id};\n    el.classList.add('selected');\n  } else {\n    if(selectedDef) selectedDef.el.classList.remove('selected');\n    selectedDef = {el, id};\n    el.classList.add('selected');\n  }\n\n  if(selectedWord && selectedDef){\n    lock = true;\n    if(selectedWord.id === selectedDef.id){\n      selectedWord.el.classList.remove('selected');\n      selectedDef.el.classList.remove('selected');\n      selectedWord.el.classList.add('correct');\n      selectedDef.el.classList.add('correct');\n      matchedCount++;\n      matchProgress.textContent = `已配对 ${matchedCount} / ${roundPairs.length}`;\n      selectedWord = null;\n      selectedDef = null;\n      lock = false;\n      if(matchedCount === roundPairs.length){\n        winBanner.style.display = 'block';\n      }\n    } else {\n      selectedWord.el.classList.add('wrong');\n      selectedDef.el.classList.add('wrong');\n      setTimeout(()=>{\n        selectedWord.el.classList.remove('selected','wrong');\n        selectedDef.el.classList.remove('selected','wrong');\n        selectedWord = null;\n        selectedDef = null;\n        lock = false;\n      }, 500);\n    }\n  }\n}\n\ndocument.getElementById('reshuffleBtn').addEventListener('click', startRound);\n\nstartRound();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"},{"label":"HR3.7","group":"3.x","source":"26aut/ENGLISH/Human_Rights_Ch3.7_Vocab.html","inner":"p37","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Human Rights 3.7 词汇复习\u003c/title>\n\u003cstyle>\n  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+JP:wght@400;600&display=swap');\n\n  :root{\n    --cream:#f6f1e4;\n    --parchment:#efe6d2;\n    --sage:#8a9a7c;\n    --sage-dark:#657357;\n    --plum:#6e4e5c;\n    --gold:#c9a24b;\n    --ink:#3c352b;\n    --wrong:#b05c52;\n  }\n\n  *{box-sizing:border-box;}\n\n  body{\n    margin:0;\n    min-height:100vh;\n    background:var(--cream);\n    background-image:\n      radial-gradient(circle at 10% 10%, rgba(201,162,75,0.08), transparent 40%),\n      radial-gradient(circle a
