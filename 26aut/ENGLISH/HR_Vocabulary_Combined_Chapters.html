 solid var(--sage);\n    background:var(--sage);\n    color:#fff;\n    font-family:inherit;\n    font-size:0.95rem;\n    padding:8px 18px;\n    border-radius:10px;\n    cursor:pointer;\n    transition:transform 0.15s, opacity 0.2s;\n  }\n  .btn.gold{\n    background:var(--gold);\n    border-color:var(--gold);\n  }\n  .btn:active{transform:scale(0.96);}\n\n  .win-banner{\n    text-align:center;\n    color:var(--sage-dark);\n    font-weight:600;\n    margin-top:14px;\n    display:none;\n  }\n\n  footer{\n    margin-top:30px;\n    font-size:0.75rem;\n    color:var(--sage-dark);\n    opacity:0.7;\n    text-align:center;\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>人権 Human Rights 词汇复习\u003c/h1>\n\u003cdiv class=\"subtitle\">Chapter 3.7\u003c/div>\n\n\u003cdiv class=\"page-tabs\">\n  \u003cbutton class=\"page-tab active\" data-page=\"p37\">3.7 背诵\u003c/button>\n  \u003cbutton class=\"page-tab\" data-page=\"pmatch\">🎲 配对练习\u003c/button>\n\u003c/div>\n\n\u003c!-- PAGE 1: Chapter 3.7 recitation list -->\n\u003cdiv class=\"page active\" id=\"p37\">\n  \u003cdiv class=\"section-title\">Chapter 3.7 — Working in my Family: Equal Opportunities for Women\u003c/div>\n  \u003cdiv class=\"list-view\" id=\"list37\">\u003c/div>\n\u003c/div>\n\n\u003c!-- PAGE 2: matching game -->\n\u003cdiv class=\"page\" id=\"pmatch\">\n  \u003cdiv class=\"section-title\">全部单词配对练习（左侧按字母顺序）\u003c/div>\n  \u003cdiv class=\"match-controls\">\n    \u003cbutton class=\"btn gold\" id=\"reshuffleBtn\">🔀 重新打乱释义顺序\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"match-progress\" id=\"matchProgress\">已配对 0 / 14\u003c/div>\n  \u003cdiv class=\"match-grid\">\n    \u003cdiv class=\"match-col\" id=\"wordCol\">\u003c/div>\n    \u003cdiv class=\"match-col\" id=\"defCol\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"win-banner\" id=\"winBanner\">🎉 全部配对完成！点击上方按钮再来一组\u003c/div>\n\u003c/div>\n\n\u003cfooter>Osaka Jogakuin · Integrated Reading / IR Human Rights Book — Ch 3.7\u003c/footer>\n\n\u003cscript>\nconst data37 = [\n  [\"birthrate\",\"a measure of how many children are born during a period of time in a particular place\",\"n\",\"出生率\",\"how many children are born\"],\n  [\"pursue\",\"to try to do something over a period of time\",\"v\",\"追求；从事\",\"try to do something\"],\n  [\"promotion\",\"the advancement of someone to a more important rank or position\",\"n\",\"晋升；升职\",\"more important rank or position\"],\n  [\"authority\",\"the power to control or demand obedience from others\",\"n\",\"权力；权限\",\"power to control or demand obedience\"],\n  [\"global\",\"relating to the whole world\",\"adj\",\"全球的；世界性的\",\"whole world\"],\n  [\"collapse\",\"the sudden failing movement of a person or structure that has become too weak to stand\",\"n\",\"崩溃；倒塌\",\"too weak to stand\"],\n  [\"harassment\",\"behavior that annoys or troubles someone\",\"n\",\"骚扰\",\"annoys or troubles someone\"],\n  [\"inappropriate\",\"not suitable for a particular situation or person\",\"adj\",\"不恰当的；不合适的\",\"not suitable\"],\n  [\"remarks\",\"something that you say, giving your opinion about something or stating a fact\",\"n\",\"言论；评论\",\"giving your opinion\"],\n  [\"consultation\",\"a meeting to discuss something or to get advice\",\"n\",\"商议；咨询\",\"get advice\"],\n  [\"executive(s)\",\"someone in a high position, especially in business, who makes decisions and puts them into action\",\"n\",\"(企业)高管；行政人员\",\"makes decisions and puts them into action\"],\n  [\"barrier(s)\",\"something that prevents something else from happening or makes it more difficult\",\"n\",\"障碍；壁垒\",\"prevents something else from happening\"],\n  [\"welfare\",\"money or help that a government gives to people who are poor or do not have jobs\",\"n\",\"福利；福祉\",\"money or help that a government gives\"],\n  [\"in terms of\",\"used to describe which particular area of a subject you are discussing\",\"phr\",\"就……而言；从……角度看\",\"particular area of a subject\"]\n];\n\nfunction buildHighlightedDef(defText, keyword){\n  const frag = document.createDocumentFragment();\n  const idx = keyword ? defText.indexOf(keyword) : -1;\n  if(idx === -1){\n    frag.appendChild(document.createTextNode(defText));\n    return frag;\n  }\n  if(idx > 0) frag.appendChild(document.createTextNode(defText.slice(0, idx)));\n  const kw = document.createElement('span');\n  kw.className = 'kw';\n  kw.textContent = defText.slice(idx, idx + keyword.length);\n  frag.appendChild(kw);\n  const rest = defText.slice(idx + keyword.length);\n  if(rest) frag.appendChild(document.createTextNode(rest));\n  return frag;\n}\n\nfunction renderList(containerId, data){\n  const el = document.getElementById(containerId);\n  el.innerHTML = \"\";\n  data.forEach(([w,d,pos,cn,kw])=>{\n    const row = document.createElement('div');\n    row.className = 'list-row';\n    const wordEl = document.createElement('span');\n    wordEl.className = 'list-word';\n    wordEl.textContent = w;\n    const defCol = document.createElement('span');\n    defCol.className = 'list-def-col';\n    const defEl = document.createElement('span');\n    defEl.className = 'list-def';\n    defEl.appendChild(buildHighlightedDef(d, kw));\n    const posEl = document.createElement('span');\n    posEl.className = 'list-pos';\n    posEl.textContent = `[${pos}]`;\n    defEl.appendChild(posEl);\n    const cnEl = document.createElement('span');\n    cnEl.className = 'list-def-cn';\n    cnEl.textContent = cn;\n    defCol.appendChild(defEl);\n    defCol.appendChild(cnEl);\n    row.appendChild(wordEl);\n    row.appendChild(defCol);\n    el.appendChild(row);\n  });\n}\nrenderList('list37', data37);\n\n// page tab switching\ndocument.querySelectorAll('.page-tab').forEach(tab=>{\n  tab.addEventListener('click', ()=>{\n    document.querySelectorAll('.page-tab').forEach(t=>t.classList.remove('active'));\n    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n    tab.classList.add('active');\n    document.getElementById(tab.dataset.page).classList.add('active');\n  });\n});\n\n// ---- matching game ----\nfunction shuffle(arr){\n  const a = [...arr];\n  for(let i=a.length-1;i>0;i--){\n    const j = Math.floor(Math.random()*(i+1));\n    [a[i],a[j]] = [a[j],a[i]];\n  }\n  return a;\n}\n\nconst wordCol = document.getElementById('wordCol');\nconst defCol = document.getElementById('defCol');\nconst matchProgress = document.getElementById('matchProgress');\nconst winBanner = document.getElementById('winBanner');\n\nlet roundPairs = [];\nlet matchedCount = 0;\nlet selectedWord = null;\nlet selectedDef = null;\nlet lock = false;\n\nfunction startRound(){\n  const pool = [...data37].sort((a,b)=> a[0].localeCompare(b[0]));\n\n  roundPairs = pool.map((item, i)=>({id:i, word:item[0], def:item[1]}));\n  matchedCount = 0;\n  selectedWord = null;\n  selectedDef = null;\n  lock = false;\n  winBanner.style.display = 'none';\n  matchProgress.textContent = `已配对 0 / ${roundPairs.length}`;\n\n  const words = roundPairs; // alphabetical, unshuffled\n  const defs = shuffle(roundPairs);\n\n  wordCol.innerHTML = \"\";\n  defCol.innerHTML = \"\";\n\n  words.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item word';\n    el.textContent = p.word;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'word', p.id));\n    wordCol.appendChild(el);\n  });\n\n  defs.forEach(p=>{\n    const el = document.createElement('div');\n    el.className = 'match-item def';\n    el.textContent = p.def;\n    el.dataset.id = p.id;\n    el.addEventListener('click', ()=>onPick(el, 'def', p.id));\n    defCol.appendChild(el);\n  });\n}\n\nfunction onPick(el, kind, id){\n  if(lock || el.classList.contains('correct')) return;\n\n  if(kind === 'word'){\n    if(selectedWord) selectedWord.el.classList.remove('selected');\n    selectedWord = {el, id};\n    el.classList.add('selected');\n  } else {\n    if(selectedDef) selectedDef.el.classList.remove('selected');\n    selectedDef = {el, id};\n    el.classList.add('selected');\n  }\n\n  if(selectedWord && selectedDef){\n    lock = true;\n    if(selectedWord.id === selectedDef.id){\n      selectedWord.el.classList.remove('selected');\n      selectedDef.el.classList.remove('selected');\n      selectedWord.el.classList.add('correct');\n      selectedDef.el.classList.add('correct');\n      matchedCount++;\n      matchProgress.textContent = `已配对 ${matchedCount} / ${roundPairs.length}`;\n      selectedWord = null;\n      selectedDef = null;\n      lock = false;\n      if(matchedCount === roundPairs.length){\n        winBanner.style.display = 'block';\n      }\n    } else {\n      selectedWord.el.classList.add('wrong');\n      selectedDef.el.classList.add('wrong');\n      setTimeout(()=>{\n        selectedWord.el.classList.remove('selected','wrong');\n        selectedDef.el.classList.remove('selected','wrong');\n        selectedWord = null;\n        selectedDef = null;\n        lock = false;\n      }, 500);\n    }\n  }\n}\n\ndocument.getElementById('reshuffleBtn').addEventListener('click', startRound);\n\nstartRound();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"}]</script><script>(()=>{
 const entries=JSON.parse(document.getElementById('data').textContent);
 const nav=document.getElementById('tabs'),host=document.getElementById('pages'),panels=new Map();
 let lastGroup='';
 for(const info of entries){
   if(info.group && info.group!==lastGroup){const g=document.createElement('span');g.className='group';g.textContent=info.group;nav.append(g);lastGroup=info.group;}
   const id=info.label.replace(/[^a-z0-9]/gi,'-');
   const b=document.createElement('button');b.type='button';b.className='tab';b.textContent=info.label;b.setAttribute('role','tab');b.setAttribute('aria-controls','panel-'+id);b.id='tab-'+id;nav.append(b);
   const section=document.createElement('section');section.className='panel';section.hidden=true;section.setAttribute('role','tabpanel');section.setAttribute('aria-labelledby',b.id);section.id='panel-'+id;
   const heading=document.createElement('div');heading.className='panelhead';heading.textContent=info.label+(info.topic?' · '+info.topic:' · 单词与配对练习');section.append(heading);
   const frame=document.createElement('iframe');frame.className='iframe';frame.title=info.label;frame.setAttribute('scrolling','no');section.append(frame);host.append(section);
   panels.set(info.label,{b,section,frame,info,loaded:false});
   frame.addEventListener('load',()=>{
      try{
       const doc=frame.contentDocument;if(!doc)return;
       if(info.inner){const btn=doc.querySelector('.page-tab[data-page="'+info.inner+'"]');if(btn)btn.click();}
       const update=()=>{const h=Math.max(doc.documentElement?.scrollHeight||0,doc.body?.scrollHeight||0,500);frame.style.height=h+'px';};
       update();
       if(typeof ResizeObserver!=='undefined'){const ro=new ResizeObserver(()=>requestAnimationFrame(update));ro.observe(doc.documentElement);if(doc.body)ro.observe(doc.body);}
       doc.addEventListener('click',()=>requestAnimationFrame(update));setTimeout(update,250);setTimeout(update,1000);
      }catch(e){frame.style.height='1000px';}
   });
   b.addEventListener('click',()=>activate(info.label,true));
 }
 function activate(label,change){
   if(!panels.has(label))label=entries[0].label;
   for(const [k,p] of panels){const yes=k===label;p.section.hidden=!yes;p.b.setAttribute('aria-selected',String(yes));p.b.tabIndex=yes?0:-1;}
   const p=panels.get(label);
   if(!p.loaded){p.loaded=true;p.frame.srcdoc=p.info.html;}
   if(change){history.replaceState(null,'','#'+label);nav.scrollIntoView({block:'start',behavior:'smooth'});}
   document.title=label+' · HR 单词合集';
 }
 function hash(){const h=decodeURIComponent(location.hash.slice(1));return panels.has(h)?h:entries[0].label;}
 window.addEventListener('hashchange',()=>activate(hash(),false));
 nav.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const keys=entries.map(x=>x.label),idx=keys.findIndex(x=>panels.get(x).b.getAttribute('aria-selected')==='true');const next=keys[(idx+(e.key==='ArrowRight'?1:-1)+keys.length)%keys.length];activate(next,true);panels.get(next).b.focus();});
 activate(hash(),false);
})();</script></body></html>
