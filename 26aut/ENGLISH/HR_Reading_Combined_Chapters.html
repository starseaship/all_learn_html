eak:clone;font-weight:750}.qmark{background:var(--yellow)}.answer-line{display:block}.answer-line+.answer-line{margin-top:3px}.example{margin-top:5px;color:#677181;font-size:14px}.hidden-translation .translation{display:none}.only-focus .question-card:not(.featured){display:none}.legend{display:flex;align-items:center;gap:17px;flex-wrap:wrap;color:#7d8492;font-size:12px}.legend span{display:inline-flex;align-items:center;gap:7px}.legend i{width:14px;height:12px;border-radius:3px;display:inline-block}.legend .q{background:var(--yellow)}.legend .a{background:var(--cyan)}.footnote{color:#a2a8b1;font-size:12px;line-height:1.7;margin-top:23px;text-align:center}\n@media(max-width:560px){.container{padding:32px 15px 56px}.toolbar{margin-top:27px}.question-card{padding:20px 18px 22px;border-radius:16px}.english{font-size:15px}.question-en{font-size:16px}.translation{font-size:12px}.jumps{width:100%}.heading{letter-spacing:-.02em}}\n@media print{body{background:#fff}.container{max-width:none;padding:0 5mm}.toolbar,.jumps,.footnote{display:none}.heading{font-size:25px}.question-card{page-break-inside:avoid;box-shadow:none;border:1px solid #ddd;padding:12px 16px;margin-bottom:8px}.cards{display:block}.question-card.featured{border-left:4px solid #8e7bc6}.translation{display:block!important}mark{-webkit-print-color-adjust:exact;print-color-adjust:exact}.number{font-size:14px}.section-name{font-size:9px}.question-en{font-size:13px}.answer-en{font-size:12px}.translation{font-size:10px}}\n\u003c/style>\n\u003cstyle>\n.translation.note{margin-top:7px;padding-left:24px;position:relative;color:#9193a3;line-height:1.75}\n.translation.note::before{content:\"注\";position:absolute;left:0;top:0;font-size:10px;color:#9c96b2;font-weight:800}\n.source-note{margin-top:22px;font-size:11.5px;line-height:1.8;color:#959ca8;text-align:center}\n.source-note a{color:#7263a7;text-decoration:underline;text-underline-offset:2px}\n@media print{.source-note{display:none}}\n\u003c/style>\n\u003cmeta name=\"description\" content=\"Dominant Minority 与 Powerless Majority：10道阅读理解问答，补全答案、重点标记及中文翻译。\">\n\u003cmeta name=\"subject\" content=\"english\">\n\u003cmeta name=\"type\" content=\"reference\">\n\u003cmeta name=\"course\" content=\"阅读\">\n\u003cmeta name=\"date\" content=\"2026-10-18\">\n\u003c/head>\n\u003cbody>\n\u003cmain class=\"container\" id=\"app\">\n  \u003cheader>\n    \u003cdiv class=\"eyebrow\">READING HOMEWORK · COMPREHENSION III\u003c/div>\n    \u003ch1 class=\"heading\">阅读2.3 \u003cspan style=\"color:#9b92b2;font-weight:500\">/\u003c/span> 中英对照\u003c/h1>\n    \u003cp class=\"subtitle\">Dominant Minority &amp; Powerless Majority\u003cbr>Comprehension Questions &amp; Improved Answers\u003c/p>\n    \u003cdiv class=\"meta\">\u003cspan class=\"chip\">共 \u003cstrong>10\u003c/strong> 道题\u003c/span>\u003cspan class=\"chip\">重点 \u003cstrong>2 · 7 · 8 · 9\u003c/strong>\u003c/span>\u003cspan class=\"chip\">题目＋答案逐条翻译\u003c/span>\u003cspan class=\"chip\">已补全手写答案\u003c/span>\u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"toolbar\">\n    \u003cdiv class=\"button-group\">\u003cbutton id=\"focusBtn\" class=\"tool-button\" type=\"button\" aria-pressed=\"false\">☆ 只看重点题\u003c/button>\u003cbutton id=\"translateBtn\" class=\"tool-button active\" type=\"button\" aria-pressed=\"true\">中译显示中\u003c/button>\u003c/div>\n    \u003cnav class=\"jumps\" aria-label=\"重点题快捷跳转\">\u003cspan>重点直达\u003c/span>\u003ca href=\"#q2\">02\u003c/a>\u003ca href=\"#q7\">07\u003c/a>\u003ca href=\"#q8\">08\u003c/a>\u003ca href=\"#q9\">09\u003c/a>\u003c/nav>\n  \u003c/div>\n  \u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"q\">\u003c/i>黄色 = 题目关键词\u003c/span>\u003cspan>\u003ci class=\"a\">\u003c/i>绿色 = 答案关键词\u003c/span>\u003c/div>\n  \u003csection class=\"cards\" aria-label=\"阅读理解题目\">\n  \u003carticle class=\"question-card\" id=\"q1\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">01\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What kind of people are in the \u003cmark class=\"qmark\">majority\u003c/mark> according to this paragraph?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>根据这一段，什么样的人属于多数群体？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">IMPROVED ANSWER · 完善答案\u003c/div>\n        \u003cp class=\"english answer-en\">The \u003cmark>majority\u003c/mark> is the group with \u003cmark>more people\u003c/mark>. It often has \u003cmark>more power\u003c/mark>, but this is not always true.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>多数群体是人数较多的群体。他们通常拥有较大的权力，但并不总是如此。\u003c/p>\n        \n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card featured\" id=\"q2\" data-focus=\"true\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">02\u003c/span>\u003cspan class=\"focus-label\">★ 重点复习\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What is a \u003cmark class=\"qmark\">“dominant minority”\u003c/mark>? \u003cmark class=\"qmark\">Give an example\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>什么是“掌权的少数群体”？请举一个例子。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">IMPROVED ANSWER · 完善答案\u003c/div>\n        \u003cp class=\"english answer-en\">A \u003cmark>dominant minority\u003c/mark> is a \u003cmark>small group\u003c/mark> that has \u003cmark>more power\u003c/mark> than a larger group. For example, the \u003cmark>five permanent members\u003c/mark> of the UN Security Council have special power.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>“掌权的少数群体”指人数较少，却比人数更多的群体掌握更大权力的一群人。例如，联合国安全理事会的五个常任理事国拥有特殊权力。\u003c/p>\n        \n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q3\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">03\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">Which \u003cmark class=\"qmark\">countries\u003c/mark> make many of the \u003cmark class=\"qmark\">decisions\u003c/mark> in the \u003cmark class=\"qmark\">United Nations\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>哪些国家在联合国的许多重要决定中有较大影响力？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">IMPROVED ANSWER · 完善答案\u003c/div>\n        \u003cp class=\"english answer-en\">The \u003cmark>five permanent members of the UN Security Council\u003c/mark> are \u003cmark>China, France, Russia, the United Kingdom, and the United States\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>联合国安理会的五个常任理事国是中国、法国、俄罗斯、英国和美国。\u003c/p>\n        \u003cp class=\"translation note\">这里特指安理会的特殊决策权，并不是说联合国所有决定都由这五个国家作出。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q4\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">04\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">How many \u003cmark class=\"qmark\">countries\u003c/mark> are the \u003cmark class=\"qmark\">members of the United Nations\u003c/mark> now?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>目前联合国有多少个会员国？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">IMPROVED ANSWER · 完善答案\u003c/div>\n        \u003cp class=\"english answer-en\">There are \u003cmark>193 member states\u003c/mark> in the United Nations.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>联合国目前有193个会员国。\u003c/p>\n        \n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q5\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">05\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What is a \u003cmark class=\"qmark\">powerless majority\u003c/mark>? Is \u003cmark class=\"qmark\">Japan\u003c/mark> a part of the \u003cmark class=\"qmark\">“dominant minority”\u003c/mark> or the \u003cmark class=\"qmark\">“powerless majority”\u003c/mark> in the United Nations?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>什么是“缺乏权力的多数群体”？日本在联合国属于“掌权的少数群体”还是“缺乏权力的多数群体”？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">IMPROVED ANSWER · 完善答案\u003c/div>\n        \u003cp class=\"english answer-en\">A \u003cmark>powerless majority\u003c/mark> is a \u003cmark>large group\u003c/mark> with \u003cmark>less power\u003c/mark> than a smaller group. In this example, \u003cmark>Japan belongs to the “powerless majority”\u003c/mark> because it is \u003cmark>not a permanent member\u003c/mark> of the UN Security Council and has \u003cmark>no veto power\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>“缺乏权力的多数群体”指人数较多，却比小群体掌握更少权力的一群人。在这个例子中，日本属于“缺乏权力的多数群体”，因为它不是安理会常任理事国，没有否决权。\u003c/p>\n        \u003cp class=\"translation note\">这里的“powerless”是课文用于对比权力差异的说法；日本仍有联合国大会投票权，也能参与联合国事务。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q6\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">06\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What is an example of an \u003cmark class=\"qmark\">economically powerless majority\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>请举出一个在经济上缺乏权力的多数群体的例子。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">IMPROVED ANSWER · 完善答案\u003c/div>\n        \u003cp class=\"english answer-en\">\u003cmark>Black South Africans\u003c/mark> under \u003cmark>apartheid\u003c/mark> are an example. They were the \u003cmark>majority\u003c/mark> of the population, but the \u003cmark>white minority controlled much of the wealth\u003c/mark> and economic power.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>种族隔离制度时期的南非黑人就是一个例子。虽然他们在人口中占多数，但大量财富和经济权力掌握在白人少数群体手中。\u003c/p>\n        \u003cp class=\"translation note\">这是南非历史上的例子，不能直接当作对当今南非所有群体的概括。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card featured\" id=\"q7\" data-focus=\"true\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">07\u003c/span>\u003cspan class=\"focus-label\">★ 重点复习\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">Which group is the \u003cmark class=\"qmark\">“dominant minority”\u003c/mark> in \u003cmark class=\"qmark\">South Africa\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>在南非，哪个群体属于“掌权的少数群体”？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">IMPROVED ANSWER · 完善答案\u003c/div>\n        \u003cp class=\"english answer-en\">The \u003cmark>white minority\u003c/mark> was the \u003cmark>dominant minority\u003c/mark> in South Africa \u003cmark>during apartheid\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>在种族隔离制度时期，南非的白人少数群体是掌权的少数群体。\u003c/p>\n        \n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card featured\" id=\"q8\" data-focus=\"true\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">08\u003c/span>\u003cspan class=\"focus-label\">★ 重点复习\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What is \u003cmark class=\"qmark\">one of the ways\u003c/mark> that show \u003cmark class=\"qmark\">women\u003c/mark> are a \u003cmark class=\"qmark\">powerless majority group\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>有什么例子可以说明女性属于权力较少的多数群体？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">IMPROVED ANSWER · 完善答案\u003c/div>\n        \u003cp class=\"english answer-en\">One example is that women may \u003cmark>receive lower pay\u003c/mark> than men for similar work. They may also have \u003cmark>fewer leadership positions\u003c/mark> and \u003cmark>less decision-making power\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>一个例子是，女性做类似的工作时可能比男性获得更低的报酬。她们还可能拥有更少的领导职位和决策权。\u003c/p>\n        \n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card featured\" id=\"q9\" data-focus=\"true\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">09\u003c/span>\u003cspan class=\"focus-label\">★ 重点复习\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">\u003cmark class=\"qmark\">Give three examples\u003c/mark> of \u003cmark class=\"qmark\">large groups of people with no power\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>请举出三个虽然人数众多但缺乏权力的群体的例子。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">IMPROVED ANSWER · 完善答案\u003c/div>\n        \u003cp class=\"english answer-en\">\u003cspan class=\"answer-line\">1) \u003cmark>Women\u003c/mark> who have less political or economic power.\u003c/span>\u003cspan class=\"answer-line\">2) \u003cmark>Black South Africans\u003c/mark> during apartheid.\u003c/span>\u003cspan class=\"answer-line\">3) People in the \u003cmark>188 UN member states without permanent Security Council seats\u003c/mark> (in the comparison used in the reading).\u003c/span>\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>① 在政治或经济方面权力较少的女性。② 种族隔离制度时期的南非黑人。③ 按课文的比较方式，没有安理会常任席位的188个联合国会员国的民众。\u003c/p>\n        \u003cp class=\"translation note\">第③个例子强调安理会没有常任席位及否决权，不代表这些国家完全没有政治影响力。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q10\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">10\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What does the \u003cmark class=\"qmark\">author think\u003c/mark> about the \u003cmark class=\"qmark\">position of minority groups\u003c/mark> in society?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>作者如何看待少数群体在社会中的地位？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">IMPROVED ANSWER · 完善答案\u003c/div>\n        \u003cp class=\"english answer-en\">The author thinks that a \u003cmark>small group\u003c/mark> can have \u003cmark>most of the power\u003c/mark>, while a \u003cmark>larger group\u003c/mark> may have \u003cmark>little power\u003c/mark>. \u003cmark>Numbers do not always decide power\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>作者认为，少数群体可能掌握大部分权力，而人数更多的群体却可能权力很少。群体的人数不一定决定它掌握多少权力。\u003c/p>\n        \n      \u003c/div>\n    \u003c/article>\n  \u003c/section>\n  \u003cp class=\"footnote\">依据照片题目与手写要点整理；对不完整答案进行补充和语法润色，非课文原文逐字摘录。可使用浏览器打印或保存为 PDF。\u003c/p>\n  \u003cp class=\"source-note\">事实核对：\u003ca href=\"https://www.un.org/en/node/122499\" target=\"_blank\" rel=\"noopener\">联合国会员国数\u003c/a> · \u003ca href=\"https://main.un.org/securitycouncil/en/content/voting-system\" target=\"_blank\" rel=\"noopener\">安理会常任理事国与否决权\u003c/a> · \u003ca href=\"https://www.un.org/en/events/mandeladay/court_statement_1962.shtml\" target=\"_blank\" rel=\"noopener\">南非种族隔离历史背景\u003c/a>\u003c/p>\n\u003c/main>\n\u003cscript>\n(function(){\n const app=document.getElementById('app');\n const fb=document.getElementById('focusBtn');\n const tb=document.getElementById('translateBtn');\n fb.addEventListener('click',()=>{\n  const on=app.classList.toggle('only-focus');\n  fb.classList.toggle('active',on);fb.setAttribute('aria-pressed',String(on));\n  fb.textContent=on?'★ 显示全部题目':'☆ 只看重点题';\n });\n tb.addEventListener('click',()=>{\n  const off=app.classList.toggle('hidden-translation');\n  tb.classList.toggle('active',!off);tb.setAttribute('aria-pressed',String(!off));\n  tb.textContent=off?'中译已隐藏':'中译显示中';\n });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>"},{"label":"HR2.7","source":"26aut/ENGLISH/reading_chapter_2_17_bilingual.html","topic":"外国劳动者与留学生","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003cmeta name=\"theme-color\" content=\"#f5f6f9\">\n\u003ctitle>阅读2.7｜日本的国际劳动者与留学生｜中英对照\u003c/title>\n\u003cstyle>\n:root{--ink:#1c2431;--muted:#858d99;--purple:#6657a2;--purple-faint:#f6f2ff;--line:#e8eaf0;--paper:#fff;--page:#f4f6f9;--yellow:#fff1a1;--cyan:#d3f2e6}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Noto Sans SC\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif;line-height:1.65}\n.container{max-width:920px;margin:auto;padding:46px 22px 80px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.14em;color:#7465a4;text-transform:uppercase}.heading{font-size:clamp(28px,4.6vw,43px);letter-spacing:-.035em;line-height:1.2;margin:12px 0 10px}.subtitle{font-size:15px;line-height:1.6;color:#64708 content=\"english\">\n\u003cmeta name=\"type\" content=\"reference\">\n\u003cmeta name=\"course\" content=\"阅读\">\n\u003cmeta name=\"date\" content=\"2026-10-18\">\n\u003c/head>\n\u003cbody>\n\u003cmain class=\"container\" id=\"app\">\n  \u003cheader>\n    \u003cdiv class=\"eyebrow\">READING HOMEWORK · CHAPTER 2.17\u003c/div>\n    \u003ch1 class=\"heading\">阅读2.7 \u003cspan style=\"color:#9b92b2;font-weight:500\">/\u003c/span> 中英对照\u003c/h1>\n    \u003cp class=\"subtitle\">Changing Attitude as Japan Welcomes International Workers and Students\u003cbr>Comprehension Questions &amp; Model Answers\u003c/p>\n    \u003cdiv class=\"meta\">\u003cspan class=\"chip\">共 \u003cstrong>10\u003c/strong> 道题\u003c/span>\u003cspan class=\"chip\">重点 \u003cstrong>2 · 7 · 8 · 9\u003c/strong>\u003c/span>\u003cspan class=\"chip\">题目＋答案逐条翻译\u003c/span>\u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"toolbar\">\n    \u003cdiv class=\"button-group\">\u003cbutton id=\"focusBtn\" class=\"tool-button\" type=\"button\" aria-pressed=\"false\">☆ 只看重点题\u003c/button>\u003cbutton id=\"translateBtn\" class=\"tool-button active\" type=\"button\" aria-pressed=\"true\">中译显示中\u003c/button>\u003c/div>\n    \u003cnav class=\"jumps\" aria-label=\"重点题快捷跳转\">\u003cspan>重点直达\u003c/span>\u003ca href=\"#q2\">02\u003c/a>\u003ca href=\"#q7\">07\u003c/a>\u003ca href=\"#q8\">08\u003c/a>\u003ca href=\"#q9\">09\u003c/a>\u003c/nav>\n  \u003c/div>\n  \u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"q\">\u003c/i>黄色 = 题目关键词\u003c/span>\u003cspan>\u003ci class=\"a\">\u003c/i>绿色 = 答案关键词\u003c/span>\u003c/div>\n  \u003csection class=\"cards\" aria-label=\"阅读理解题目\">\u003carticle class=\"question-card\" id=\"q1\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">01\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What does the \u003cmark class=\"qmark\">first paragraph\u003c/mark> say about the \u003cmark class=\"qmark\">number of foreigners in Japan\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>第一段关于日本外国人人数的变化说明了什么？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">MODEL ANSWER · 参考答案\u003c/div>\n        \u003cp class=\"english answer-en\">Until the \u003cmark>1990s\u003c/mark>, foreigners living in Japan made up \u003cmark>less than one percent\u003c/mark> of the population, but since then the number of people visiting, working, or studying there has \u003cmark>increased rapidly\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>直到20世纪90年代，居住在日本的外国人还不到总人口的1%。但从那以后，赴日旅游、工作或学习的人数迅速增加。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card featured\" id=\"q2\" data-focus=\"true\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">02\u003c/span>\u003cspan class=\"focus-label\">★ 重点复习\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What are the \u003cmark class=\"qmark\">reasons\u003c/mark> that \u003cmark class=\"qmark\">foreigners come to live in Japan\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>外国人来日本居住的原因有哪些？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">MODEL ANSWER · 参考答案\u003c/div>\n        \u003cp class=\"english answer-en\">Reasons foreigners come to live in Japan: \u003cmark>to work (work visas, 18%)\u003c/mark>, as \u003cmark>technical trainees (19%)\u003c/mark>, and as \u003cmark>students (22%)\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>外国人来日本居住的原因包括：工作（工作签证，18%）、作为技能实习生（19%），以及作为留学生（22%）。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q3\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">03\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">Which are the \u003cmark class=\"qmark\">main cities\u003c/mark> that are \u003cmark class=\"qmark\">popular for tourists from overseas\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>哪些主要城市受到海外游客的欢迎？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">MODEL ANSWER · 参考答案\u003c/div>\n        \u003cp class=\"english answer-en\">\u003cmark>Kyoto\u003c/mark>, \u003cmark>Osaka\u003c/mark>, and \u003cmark>Tokyo\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>京都、大阪和东京。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q4\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">04\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">\u003cmark class=\"qmark\">How many more tourists\u003c/mark> visited Japan in \u003cmark class=\"qmark\">2023\u003c/mark> compared to \u003cmark class=\"qmark\">20 years prior\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>2023年赴日游客人数比20年前增加了多少？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">MODEL ANSWER · 参考答案\u003c/div>\n        \u003cp class=\"english answer-en\">Increase in tourists: \u003cmark>about 20 million more\u003c/mark> — from roughly \u003cmark>5 million in 2003\u003c/mark> to \u003cmark>more than 25 million in 2023\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>游客大约增加了2000万人：从2003年的约500万人增加到2023年的2500多万人。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q5\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">05\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What \u003cmark class=\"qmark\">type of workers\u003c/mark> are \u003cmark class=\"qmark\">eligible\u003c/mark> for the \u003cmark class=\"qmark\">second work visa type\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>哪类工作者符合第二种工作签证类型的申请资格？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">MODEL ANSWER · 参考答案\u003c/div>\n        \u003cp class=\"english answer-en\">They are \u003cmark>engineers\u003c/mark> and \u003cmark>computer programmers\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>他们是工程师和计算机程序员。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q6\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">06\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What were the \u003cmark class=\"qmark\">technical workers\u003c/mark> in Japan \u003cmark class=\"qmark\">not allowed to do\u003c/mark> before the recent \u003cmark class=\"qmark\">changes in the law\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>在最近的法律修改之前，日本的技能工作者不被允许做什么？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">MODEL ANSWER · 参考答案\u003c/div>\n        \u003cp class=\"english answer-en\">\u003cspan class=\"answer-line\">1) They were \u003cmark>not allowed to stay up to five years\u003c/mark>.\u003c/span>\u003cspan class=\"answer-line\">2) They were \u003cmark>not allowed to change their jobs\u003c/mark>.\u003c/span>\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>① 他们不被允许停留长达五年。② 他们不被允许更换工作。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card featured\" id=\"q7\" data-focus=\"true\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">07\u003c/span>\u003cspan class=\"focus-label\">★ 重点复习\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">Why do some \u003cmark class=\"qmark\">workers from other countries\u003c/mark> \u003cmark class=\"qmark\">pay agents more than 1 million yen\u003c/mark> before coming to Japan?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>为什么一些外国劳动者在来日本之前，要向中介支付超过100万日元？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">MODEL ANSWER · 参考答案\u003c/div>\n        \u003cp class=\"english answer-en\">Because they hoped that they could \u003cmark>work five years\u003c/mark>, \u003cmark>pay back their debt\u003c/mark>, and \u003cmark>save more money\u003c/mark> than they have earned in the country they came from.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>因为他们希望在日本工作五年，偿还债务，并且存下比在自己国家工作时更多的钱。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card featured\" id=\"q8\" data-focus=\"true\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">08\u003c/span>\u003cspan class=\"focus-label\">★ 重点复习\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What \u003cmark class=\"qmark\">limits\u003c/mark> do \u003cmark class=\"qmark\">international students in Japan\u003c/mark> have \u003cmark class=\"qmark\">regarding work\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>在日本的留学生在打工方面受到哪些限制？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">MODEL ANSWER · 参考答案\u003c/div>\n        \u003cp class=\"english answer-en\">They are allowed to \u003cmark>work part-time\u003c/mark> up to \u003cmark>28 hours a week\u003c/mark>, \u003cmark>8 hours a day\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>他们被允许兼职，每周最多28小时，每天最多8小时。（这里的每天8小时通常指学校规定的长期休假期间。）\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card featured\" id=\"q9\" data-focus=\"true\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">09\u003c/span>\u003cspan class=\"focus-label\">★ 重点复习\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What \u003cmark class=\"qmark\">kinds of companies\u003c/mark> particularly \u003cmark class=\"qmark\">need workers from other countries\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>哪类企业尤其需要外国劳动者？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">MODEL ANSWER · 参考答案\u003c/div>\n        \u003cp class=\"english answer-en\">\u003cmark>Small businesses\u003c/mark>, particularly those located \u003cmark>outside the major city\u003c/mark> do.\u003cspan class=\"answer-line example\">(Factories that produce lunch boxes, convenience stores, restaurants, eating places, delivery companies)\u003c/span>\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>小型企业，特别是大城市以外的小型企业。（例如：便当工厂、便利店、餐厅、餐饮店和配送公司。）\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q10\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">10\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">Why might the \u003cmark class=\"qmark\">issues of immigrants\u003c/mark> \u003cmark class=\"qmark\">change the Japanese view\u003c/mark> of people from other countries?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>为什么移民问题可能改变日本人对外国人的看法？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">MODEL ANSWER · 参考答案\u003c/div>\n        \u003cp class=\"english answer-en\">Now Japan is getting poor and poor because of \u003cmark>shrinking its population and aging\u003c/mark>. In order to prevent Japan from falling into poverty, it is necessary to \u003cmark>invite skilled labor forces from abroad\u003c/mark>. In fact all the rich and developed countries of the world \u003cmark>competing for getting skilled labors\u003c/mark>. Therefore, Japan needs to \u003cmark>improve its hospitality to foreign workers\u003c/mark> in order to compete with other developed countries.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中\u003c/span>由于人口减少和老龄化，日本正变得越来越贫困。为了避免陷入贫困，日本有必要吸引海外技术劳动力。事实上，世界各发达国家都在争夺有技能的人才。因此，日本需要改善对外国劳动者的接纳和友好程度，才能与其他发达国家竞争。\u003c/p>\n      \u003c/div>\n    \u003c/article>\u003c/section>\n  \u003cp class=\"footnote\">英文依照图片中的 Model Answers 整理，中文为便于理解的翻译。可使用浏览器打印或保存为 PDF。\u003c/p>\n\u003c/main>\n\u003cscript>\n(function(){\n const app=document.getElementById('app');\n const fb=document.getElementById('focusBtn');\n const tb=document.getElementById('translateBtn');\n fb.addEventListener('click',()=>{\n  const on=app.classList.toggle('only-focus');\n  fb.classList.toggle('active',on);fb.setAttribute('aria-pressed',String(on));\n  fb.textContent=on?'★ 显示全部题目':'☆ 只看重点题';\n });\n tb.addEventListener('click',()=>{\n  const off=app.classList.toggle('hidden-translation');\n  tb.classList.toggle('active',!off);tb.setAttribute('aria-pressed',String(!off));\n  tb.textContent=off?'中译已隐藏':'中译显示中';\n });\n document.querySelectorAll('.jumps a').forEach(link=>link.addEventListener('click',()=>{\n  if(app.classList.contains('only-focus'))return;\n }));\n})();\n\u003c/script>\n\u003c/body>\u003c/html>"},{"label":"HR2.10","source":"26aut/ENGLISH/HR_Chapter_2_10_First_People_Bilingual.html","topic":"First People · 原住民人权","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003cmeta name=\"theme-color\" content=\"#f5f6f9\">\n\u003ctitle>HR Chapter 2.10 · First People of the New World 中英对照\u003c/title>\n\u003cstyle>\n:root{--ink:#1c2431;--muted:#858d99;--purple:#6657a2;--purple-faint:#f6f2ff;--line:#e8eaf0;--paper:#fff;--page:#f4f6f9;--yellow:#fff1a1;--cyan:#d3f2e6;--pink:#ffe2e6}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Noto Sans SC\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif;line-height:1.68}\n.container{max-width:960px;margin:auto;padding:46px 22px 80px}.eyebrow{font-size:12px;font-weight:780;letter-spacing:.14em;color:#7465a4;text-transform:uppercase}.heading{font-size:clamp(28px,4.6vw,43px);letter-spacing:-.035em;line-height:1.2;margin:12px 0 10px}.subtitle{font-size:15px;line-height:1.65;color:#647083;margin:0 0 10px;max-width:760px}.note{display:inline-block;margin:0 0 22px;padding:8px 12px;border-radius:12px;background:#fff7e9;border:1px solid #f1ddb0;color:#8a6a23;font-size:13px;font-weight:650}.meta{display:flex;gap:9px;flex-wrap:wrap}.chip{padding:5px 12px;font-size:12px;background:#fff;border:1px solid #e8e8ee;border-radius:999px;color:#5f697a}.chip strong{color:#55438f}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin:33px 0 19px}.button-group{display:flex;flex-wrap:wrap;gap:9px}.tool-button{appearance:none;cursor:pointer;border:1px solid #dddfea;border-radius:12px;background:#fff;padding:10px 15px;font-size:13px;font-weight:650;color:#4f5868;transition:background .15s,border-color .15s}.tool-button:hover{border-color:#afa6ce}.tool-button.active{background:#eee9fb;border-color:#c7b9eb;color:#594592}.j ont-weight:750}.qmark{background:var(--yellow)}.fmark{background:var(--pink)}.answer-line{display:block}.answer-line+.answer-line{margin-top:7px}.footer-note{margin-top:32px;padding:18px 20px;background:#fff;border:1px solid #e6e8ee;border-radius:16px;color:#667085;font-size:13px;line-height:1.8}@media(max-width:680px){.container{padding:30px 14px 60px}.question-card{padding:20px 18px 22px}.toolbar{margin:24px 0 16px}.english{font-size:15px}.question-en{font-size:16px}.jumps{align-items:flex-start}.legend{gap:12px}}\n.only-focus .question-card[data-focus=\"false\"]{display:none}.hide-trans .translation{display:none}\n\u003c/style>\n\u003cmeta name=\"description\" content=\"非小测，是期末。Human Rights Chapter 2.10：美洲原住民的权利与殖民历史，8道中英阅读问答，重点4、5、6题，关键词底色辅助记忆。\">\n\u003cmeta name=\"subject\" content=\"english\">\n\u003cmeta name=\"type\" content=\"reference\">\n\u003cmeta name=\"course\" content=\"阅读\">\n\u003cmeta name=\"date\" content=\"2026-10-19\">\n\u003c/head>\n\u003cbody>\n\u003cmain class=\"container\" id=\"app\">\n  \u003cheader>\n    \u003cdiv class=\"eyebrow\">HUMAN RIGHTS · CHAPTER 2.10\u003c/div>\n    \u003ch1 class=\"heading\">First People of the New World \u003cspan style=\"color:#9b92b2;font-weight:500\">/\u003c/span> 中英对照\u003c/h1>\n    \u003cp class=\"subtitle\">Model Essay · Reading Comprehension Questions · Answer Key\u003c/p>\n    \u003cp class=\"note\">备注：\u003cstrong>非小测，是期末\u003c/strong> 复习资料。\u003c/p>\n    \u003cdiv class=\"meta\">\u003cspan class=\"chip\">共 \u003cstrong>8\u003c/strong> 题\u003c/span>\u003cspan class=\"chip\">重点 \u003cstrong>4 · 5 · 6\u003c/strong>\u003c/span>\u003cspan class=\"chip\">题目＋答案逐条翻译\u003c/span>\u003cspan class=\"chip\">关键词底色帮助记忆\u003c/span>\u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"toolbar\">\n    \u003cdiv class=\"button-group\">\u003cbutton id=\"focusBtn\" class=\"tool-button\" type=\"button\" aria-pressed=\"false\">☆ 只看重点题\u003c/button>\u003cbutton id=\"translateBtn\" class=\"tool-button active\" type=\"button\" aria-pressed=\"true\">中译显示中\u003c/button>\u003c/div>\n    \u003cnav class=\"jumps\" aria-label=\"重点题快捷跳转\">\u003cspan>重点直达\u003c/span>\u003ca href=\"#q4\">04\u003c/a>\u003ca href=\"#q5\">05\u003c/a>\u003ca href=\"#q6\">06\u003c/a>\u003c/nav>\n  \u003c/div>\n\n  \u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"q\">\u003c/i>黄色 = 题目关键词\u003c/span>\u003cspan>\u003ci class=\"a\">\u003c/i>绿色 = 答案关键词\u003c/span>\u003cspan>\u003ci class=\"f\">\u003c/i>粉色 = 重点记忆点\u003c/span>\u003c/div>\n\n  \u003csection class=\"cards\" aria-label=\"阅读理解题目\">\n\n    \u003carticle class=\"question-card\" id=\"q1\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">01\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What did \u003cmark class=\"qmark\">Columbus\u003c/mark> believe when he first saw people in the \u003cmark class=\"qmark\">Americas\u003c/mark>, and where had he actually landed?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>当哥伦布第一次在美洲看到当地人时，他以为自己到了哪里？而他实际上登陆在什么地方？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">ANSWER · 答案\u003c/div>\n        \u003cp class=\"english answer-en\">Columbus believed he had arrived in \u003cmark>India\u003c/mark> and assumed the people he saw were \u003cmark>locals\u003c/mark>. In reality, he had landed in the \u003cmark>Caribbean\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>哥伦布以为自己到了印度，并认为他看到的人是当地人。实际上，他登陆的是加勒比地区。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\n    \u003carticle class=\"question-card\" id=\"q2\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">02\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">Who are \u003cmark class=\"qmark\">“The First People”\u003c/mark>, and what \u003cmark class=\"qmark\">European groups\u003c/mark> contributed to their mistreatment?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>“The First People（第一批人民/原住民）”指的是谁？有哪些欧洲群体参与了对他们的虐待与压迫？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">ANSWER · 答案\u003c/div>\n        \u003cp class=\"english answer-en\">The First People were \u003cmark>indigenous people\u003c/mark> of the Americas. The \u003cmark>British\u003c/mark>, \u003cmark>French\u003c/mark>, \u003cmark>Dutch\u003c/mark>, \u003cmark>Portuguese\u003c/mark>, \u003cmark>Russians\u003c/mark>, and \u003cmark>Spanish\u003c/mark> all contributed to their mistreatment.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>“第一批人民”指的是美洲的原住民。英国人、法国人、荷兰人、葡萄牙人、俄罗斯人和西班牙人都参与了对他们的虐待与压迫。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\n    \u003carticle class=\"question-card\" id=\"q3\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">03\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What factors led to the \u003cmark class=\"qmark\">99% population decline\u003c/mark> of the First People by the \u003cmark class=\"qmark\">late 1800s\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>到了 19 世纪后期，是什么因素导致第一批人民的人口下降了 99%？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">ANSWER · 答案\u003c/div>\n        \u003cp class=\"english answer-en\">It was caused by \u003cmark>systematic killing\u003c/mark> through \u003cmark>wars\u003c/mark>, \u003cmark>murders\u003c/mark>, \u003cmark>disease\u003c/mark>, and \u003cmark>marginalization\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>这是由系统性的杀害造成的，包括战争、谋杀、疾病以及边缘化。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\n    \u003carticle class=\"question-card featured\" id=\"q4\" data-focus=\"true\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">04\u003c/span>\u003cspan class=\"focus-label\">重点题\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">How did the Europeans’ concept of \u003cmark class=\"qmark\">property ownership\u003c/mark> differ from the \u003cmark class=\"qmark\">First People\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>欧洲人的“财产所有权”观念，与第一批人民（原住民）的观念有什么不同？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">ANSWER · 答案\u003c/div>\n        \u003cp class=\"english answer-en\">\u003cspan class=\"answer-line\">In Europe, \u003cmark class=\"fmark\">property ownership\u003c/mark> had long been established as a \u003cmark>law\u003c/mark>, but for the First People, their land was \u003cmark class=\"fmark\">communal\u003c/mark>.\u003c/span>\u003cspan class=\"answer-line\">The Europeans \u003cmark>stole the land\u003c/mark> and imposed their legal concept of property ownership on the people in the Americas.\u003c/span>\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>在欧洲，财产所有权早已被确立为法律；但对第一批人民来说，土地是共有的。欧洲人夺走了土地，并把他们的法律性财产观念强加给了美洲的原住民。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\n    \u003carticle class=\"question-card featured\" id=\"q5\" data-focus=\"true\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">05\u003c/span>\u003cspan class=\"focus-label\">重点题\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">Why were native groups like the \u003cmark class=\"qmark\">Cherokee\u003c/mark> forced to move, even when they followed the \u003cmark class=\"qmark\">settlers’ rules\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>为什么像切罗基人这样的原住民群体，即使遵守了殖民者的规则，仍然被迫迁移？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">ANSWER · 答案\u003c/div>\n        \u003cp class=\"english answer-en\">\u003cspan class=\"answer-line\">Despite adopting a society modeled after the \u003cmark>United States\u003c/mark>, including \u003cmark>courts\u003c/mark> and \u003cmark>schools\u003c/mark>, the Cherokee were forced to relocate\u003c/span>\u003cspan class=\"answer-line\">because \u003cmark class=\"fmark\">settlers and the government\u003c/mark> desired their \u003cmark class=\"fmark\">land\u003c/mark>.\u003c/span>\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>尽管切罗基人建立了一个仿照美国的社会，包括法院和学校，他们仍然被迫迁移，因为殖民者和政府想要他们的土地。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\n    \u003carticle class=\"question-card featured\" id=\"q6\" data-focus=\"true\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">06\u003c/span>\u003cspan class=\"focus-label\">重点题\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">How did denying the First People the \u003cmark class=\"qmark\">right to vote\u003c/mark> affect their ability to \u003cmark class=\"qmark\">influence governance\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>剥夺第一批人民的投票权，如何影响了他们参与并影响治理的能力？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">ANSWER · 答案\u003c/div>\n        \u003cp class=\"english answer-en\">\u003cspan class=\"answer-line\">Denying voting rights \u003cmark class=\"fmark\">excluded\u003c/mark> the First People from \u003cmark>governance\u003c/mark>,\u003c/span>\u003cspan class=\"answer-line\">allowing European settlers to \u003cmark class=\"fmark\">control the land\u003c/mark> without indigenous \u003cmark>input\u003c/mark> or \u003cmark>opposition\u003c/mark>.\u003c/span>\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>剥夺投票权使第一批人民被排除在治理之外，让欧洲殖民者在没有原住民参与或反对的情况下控制土地。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\n    \u003carticle class=\"question-card\" id=\"q7\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">07\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What is significant about the fact that native people in \u003cmark class=\"qmark\">Canada\u003c/mark> were not allowed to vote until \u003cmark class=\"qmark\">1963\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>加拿大的原住民直到 1963 年才被允许投票，这一事实的重要意义是什么？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">ANSWER · 答案\u003c/div>\n        \u003cp class=\"english answer-en\">It highlights the \u003cmark>long-lasting denial\u003c/mark> of basic human rights to the First People, as they were not fully recognized as \u003cmark>citizens\u003c/mark> for centuries after European arrival.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>这凸显了对第一批人民基本人权的长期剥夺，因为在欧洲人到来后的几个世纪里，他们一直没有被充分承认为公民。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\n    \u003carticle class=\"question-card\" id=\"q8\" data-focus=\"false\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">08\u003c/span>\u003cspan class=\"ordinary-label\">COMPREHENSION\u003c/span>\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name question-name\">QUESTION · 题目\u003c/div>\n        \u003cp class=\"english question-en\">What three main \u003cmark class=\"qmark\">human rights violations\u003c/mark> were committed against the First People in the Americas, as mentioned in the \u003cmark class=\"qmark\">conclusion\u003c/mark>?\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>正如结论中提到的，对美洲第一批人民实施的三项主要人权侵犯是什么？\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"qa-section\">\n        \u003cdiv class=\"section-name answer-name\">ANSWER · 答案\u003c/div>\n        \u003cp class=\"english answer-en\">The denial of basic human rights continued to impact the descendants of the First People, as they were \u003cmark>marginalized\u003c/mark>, \u003cmark>excluded from political participation\u003c/mark>, and \u003cmark>deprived of their property and cultural heritage\u003c/mark>.\u003c/p>\n        \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>对基本人权的剥夺持续影响着第一批人民的后代，因为他们被边缘化、被排除在政治参与之外，并被剥夺了财产和文化遗产。\u003c/p>\n      \u003c/div>\n    \u003c/article>\n\n  \u003c/section>\n\n  \u003cdiv class=\"footer-note\">\u003cstrong>记忆提示：\u003c/strong>第 \u003cstrong>4 / 5 / 6\u003c/strong> 题建议重点背诵。可以抓住这些核心词来记：\u003cstrong>property ownership / communal land\u003c/strong>、\u003cstrong>Cherokee / land\u003c/strong>、\u003cstrong>right to vote / governance / control the land\u003c/strong>。\u003c/div>\n\u003c/main>\n\u003cscript>\n(()=>{\n  const app=document.getElementById('app');\n  const focusBtn=document.getElementById('focusBtn');\n  const translateBtn=document.getElementById('translateBtn');\n  focusBtn.addEventListener('click',()=>{\n    const on=app.classList.toggle('only-focus');\n    focusBtn.classList.toggle('active',on);\n    focusBtn.setAttribute('aria-pressed',String(on));\n    focusBtn.textContent=on?'★ 正在只看重点题':'☆ 只看重点题';\n  });\n  translateBtn.addEventListener('click',()=>{\n    const hidden=app.classList.toggle('hide-trans');\n    translateBtn.classList.toggle('active',!hidden);\n    translateBtn.setAttribute('aria-pressed',String(!hidden));\n    translateBtn.textContent=hidden?'中译已隐藏':'中译显示中';\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>"},{"label":"HR3.10","source":"26aut/ENGLISH/HR_Chapter_3_10_Working_in_My_Family_Bilingual.html","topic":"女性就业与平等机会","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"theme-color\" content=\"#f5f6fa\">\n\u003cmeta name=\"subject\" content=\"english\">\n\u003cmeta name=\"type\" content=\"reference\">\n\u003cmeta name=\"course\" content=\"阅读\">\n\u003cmeta name=\"date\" content=\"2026-10-28\">\n\u003cmeta name=\"description\" content=\"Chapter 3.10《Working in My Family: Equal Opportunities for Women》：10道阅读理解问答，关键词高亮与逐题中文翻译。\">\n\u003ctitle>阅读3.10｜Working in n\u003cbody>\u003cmain class=\"container\" id=\"app\">\n\u003cheader class=\"hero\">\u003cdiv class=\"eyebrow\">READING COMPREHENSION · CHAPTER 3.10\u003c/div>\n\u003ch1>Working in My Family\u003cbr>Equal Opportunities for Women\u003c/h1>\n\u003cp>家庭中的工作：女性的平等机会 · 课堂参考答案整理\u003c/p>\n\u003cdiv class=\"stats\">\u003cspan class=\"pill\">10 道阅读问答\u003c/span>\u003cspan class=\"pill\">中英对照\u003c/span>\u003cspan class=\"pill\">关键词高亮\u003c/span>\u003cspan class=\"pill\">记忆线索\u003c/span>\u003c/div>\u003c/header>\n\u003cdiv class=\"toolbar\">\u003cdiv class=\"tools\">\n\u003cbutton id=\"zhBtn\" class=\"btn\" type=\"button\" aria-pressed=\"false\">隐藏中文翻译\u003c/button>\n\u003cbutton id=\"answerBtn\" class=\"btn\" type=\"button\" aria-pressed=\"false\">隐藏答案 · 自测\u003c/button>\n\u003cbutton id=\"cueBtn\" class=\"btn\" type=\"button\" aria-pressed=\"false\">隐藏记忆线索\u003c/button>\n\u003c/div>\u003cnav class=\"quick\" aria-label=\"题号跳转\">跳转 \u003ca href=\"#q1\">01\u003c/a>\u003ca href=\"#q2\">02\u003c/a>\u003ca href=\"#q3\">03\u003c/a>\u003ca href=\"#q4\">04\u003c/a>\u003ca href=\"#q5\">05\u003c/a>\u003ca href=\"#q6\">06\u003c/a>\u003ca href=\"#q7\">07\u003c/a>\u003ca href=\"#q8\">08\u003c/a>\u003ca href=\"#q9\">09\u003c/a>\u003ca href=\"#q10\">10\u003c/a>\u003c/nav>\u003c/div>\n\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"swatch\">\u003c/i>黄色：题目关键词\u003c/span>\u003cspan>\u003ci class=\"swatch answer\">\u003c/i>绿色：答案关键词\u003c/span>\u003c/div>\n\u003csection class=\"cards\" aria-label=\"阅读理解题与参考答案\">\n\u003carticle class=\"question-card\" id=\"q1\" data-num=\"1\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">01\u003c/span>\u003cspan class=\"card-chapter\">CHAPTER 3.10\u003c/span>\u003c/div>\n      \u003cdiv class=\"section-label question-label\">QUESTION · 题目\u003c/div>\n      \u003cp class=\"english question-en\">What \u003cmark class=\"qmark\">expectations\u003c/mark> were there for women when \u003cmark class=\"qmark\">Tsubaki\u003c/mark> \u003cmark class=\"qmark\">graduated from high school\u003c/mark>?\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>当椿（Tsubaki）高中毕业时，社会对女性有什么期待？\u003c/p>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"answer-content\">\u003cdiv class=\"section-label answer-label\">ANSWER · 答案\u003c/div>\n      \u003cp class=\"english answer-en\">Women were expected to \u003cmark class=\"amark\">take care of their families and children\u003c/mark> and do \u003cmark class=\"amark\">all the housework\u003c/mark>.\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>人们认为女性应该照顾家人和孩子，并承担所有家务。\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003cspan class=\"cue-label\">记忆线索\u003c/span>照顾家庭＋孩子＋家务\u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q2\" data-num=\"2\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">02\u003c/span>\u003cspan class=\"card-chapter\">CHAPTER 3.10\u003c/span>\u003c/div>\n      \u003cdiv class=\"section-label question-label\">QUESTION · 题目\u003c/div>\n      \u003cp class=\"english question-en\">What \u003cmark class=\"qmark\">expectations\u003c/mark> were there for women when \u003cmark class=\"qmark\">Yuri\u003c/mark> graduated from \u003cmark class=\"qmark\">junior college\u003c/mark>?\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>当由里（Yuri）从短期大学毕业时，社会对女性有什么期待？\u003c/p>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"answer-content\">\u003cdiv class=\"section-label answer-label\">ANSWER · 答案\u003c/div>\n      \u003cp class=\"english answer-en\">It was quite common for women to \u003cmark class=\"amark\">end their careers\u003c/mark> \u003cmark class=\"amark\">after marriage\u003c/mark> or after \u003cmark class=\"amark\">having a child\u003c/mark>.\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>当时女性在结婚或生孩子之后结束职业生涯，是相当普遍的事。\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003cspan class=\"cue-label\">记忆线索\u003c/span>婚后／生育后离职\u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q3\" data-num=\"3\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">03\u003c/span>\u003cspan class=\"card-chapter\">CHAPTER 3.10\u003c/span>\u003c/div>\n      \u003cdiv class=\"section-label question-label\">QUESTION · 题目\u003c/div>\n      \u003cp class=\"english question-en\">What \u003cmark class=\"qmark\">type of job\u003c/mark> did \u003cmark class=\"qmark\">Yuri\u003c/mark> get?\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>由里找到了什么类型的工作？\u003c/p>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"answer-content\">\u003cdiv class=\"section-label answer-label\">ANSWER · 答案\u003c/div>\n      \u003cp class=\"english answer-en\">She got a \u003cmark class=\"amark\">general staff position\u003c/mark>, which was \u003cmark class=\"amark\">different from\u003c/mark> a \u003cmark class=\"amark\">regular full-time position\u003c/mark>.\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>她得到了一份一般职（general staff）的工作，与常规全职职位不同。\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003cspan class=\"cue-label\">记忆线索\u003c/span>general staff ≠ regular full-time\u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q4\" data-num=\"4\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">04\u003c/span>\u003cspan class=\"card-chapter\">CHAPTER 3.10\u003c/span>\u003c/div>\n      \u003cdiv class=\"section-label question-label\">QUESTION · 题目\u003c/div>\n      \u003cp class=\"english question-en\">What was the \u003cmark class=\"qmark\">economic situation\u003c/mark> in Japan when \u003cmark class=\"qmark\">Sakura\u003c/mark> \u003cmark class=\"qmark\">graduated from university\u003c/mark>?\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>樱（Sakura）大学毕业时，日本的经济和就业状况如何？\u003c/p>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"answer-content\">\u003cdiv class=\"section-label answer-label\">ANSWER · 答案\u003c/div>\n      \u003cp class=\"english answer-en\">Japan was in the middle of the \u003cmark class=\"amark\">employment ice age\u003c/mark>, which made it \u003cmark class=\"amark\">difficult\u003c/mark> for graduates to find \u003cmark class=\"amark\">full-time positions\u003c/mark>.\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>日本正处于就业冰河期，毕业生很难找到全职工作。\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003cspan class=\"cue-label\">记忆线索\u003c/span>就业冰河期 → 全职难找\u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q5\" data-num=\"5\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">05\u003c/span>\u003cspan class=\"card-chapter\">CHAPTER 3.10\u003c/span>\u003c/div>\n      \u003cdiv class=\"section-label question-label\">QUESTION · 题目\u003c/div>\n      \u003cp class=\"english question-en\">What \u003cmark class=\"qmark\">kind of job\u003c/mark> did \u003cmark class=\"qmark\">Sakura\u003c/mark> get?\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>樱找到了什么样的工作？\u003c/p>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"answer-content\">\u003cdiv class=\"section-label answer-label\">ANSWER · 答案\u003c/div>\n      \u003cp class=\"english answer-en\">She got a \u003cmark class=\"amark\">part-time job\u003c/mark>.\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>她找到了一份兼职工作。\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003cspan class=\"cue-label\">记忆线索\u003c/span>Sakura → part-time\u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q6\" data-num=\"6\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">06\u003c/span>\u003cspan class=\"card-chapter\">CHAPTER 3.10\u003c/span>\u003c/div>\n      \u003cdiv class=\"section-label question-label\">QUESTION · 题目\u003c/div>\n      \u003cp class=\"english question-en\">\u003cmark class=\"qmark\">How much more\u003c/mark> was a \u003cmark class=\"qmark\">man&#x27;s salary\u003c/mark> than a \u003cmark class=\"qmark\">woman&#x27;s\u003c/mark> when \u003cmark class=\"qmark\">Sakura\u003c/mark> started working?\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>樱开始工作时，男性的工资比女性高多少？\u003c/p>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"answer-content\">\u003cdiv class=\"section-label answer-label\">ANSWER · 答案\u003c/div>\n      \u003cp class=\"english answer-en\">Sakura earned only \u003cmark class=\"amark\">70%\u003c/mark> as much as a man. In other words, a man&#x27;s salary was about \u003cmark class=\"amark\">43% higher\u003c/mark> than hers.\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>樱的收入只有男性的70%。换算过来，男性的工资比她高约43%（以她的工资为比较基准）。\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003cspan class=\"cue-label\">记忆线索\u003c/span>女 = 男的70%；男比女高约43%\u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q7\" data-num=\"7\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">07\u003c/span>\u003cspan class=\"card-chapter\">CHAPTER 3.10\u003c/span>\u003c/div>\n      \u003cdiv class=\"section-label question-label\">QUESTION · 题目\u003c/div>\n      \u003cp class=\"english question-en\">Does \u003cmark class=\"qmark\">Momoko\u003c/mark> have a \u003cmark class=\"qmark\">full-time job\u003c/mark> or a \u003cmark class=\"qmark\">part-time job\u003c/mark>?\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>桃子（Momoko）做的是全职工作还是兼职工作？\u003c/p>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"answer-content\">\u003cdiv class=\"section-label answer-label\">ANSWER · 答案\u003c/div>\n      \u003cp class=\"english answer-en\">She has a \u003cmark class=\"amark\">full-time job\u003c/mark>.\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>她有一份全职工作。\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003cspan class=\"cue-label\">记忆线索\u003c/span>Momoko → full-time\u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q8\" data-num=\"8\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">08\u003c/span>\u003cspan class=\"card-chapter\">CHAPTER 3.10\u003c/span>\u003c/div>\n      \u003cdiv class=\"section-label question-label\">QUESTION · 题目\u003c/div>\n      \u003cp class=\"english question-en\">What is an \u003cmark class=\"qmark\">example\u003c/mark> of \u003cmark class=\"qmark\">sexual harassment\u003c/mark>?\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>什么行为属于性骚扰？请举一个例子。\u003c/p>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"answer-content\">\u003cdiv class=\"section-label answer-label\">ANSWER · 答案\u003c/div>\n      \u003cp class=\"english answer-en\">\u003cmark class=\"amark\">Inappropriate touching\u003c/mark> or making \u003cmark class=\"amark\">inappropriate remarks\u003c/mark> about \u003cmark class=\"amark\">women&#x27;s bodies\u003c/mark>.\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>不适当的身体触碰，或对女性身体发表不恰当的评论。\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003cspan class=\"cue-label\">记忆线索\u003c/span>性骚扰＝不当触碰／身体评论\u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q9\" data-num=\"9\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">09\u003c/span>\u003cspan class=\"card-chapter\">CHAPTER 3.10\u003c/span>\u003c/div>\n      \u003cdiv class=\"section-label question-label\">QUESTION · 题目\u003c/div>\n      \u003cp class=\"english question-en\">What is an \u003cmark class=\"qmark\">example\u003c/mark> of \u003cmark class=\"qmark\">maternity harassment\u003c/mark>?\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>什么行为属于妊娠或生育相关骚扰？请举一个例子。\u003c/p>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"answer-content\">\u003cdiv class=\"section-label answer-label\">ANSWER · 答案\u003c/div>\n      \u003cp class=\"english answer-en\">\u003cmark class=\"amark\">Criticizing\u003c/mark> a \u003cmark class=\"amark\">pregnant woman\u003c/mark> for \u003cmark class=\"amark\">not working as hard\u003c/mark> as others.\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>因为孕妇没有像其他人一样努力工作而批评她。\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003cspan class=\"cue-label\">记忆线索\u003c/span>妊娠骚扰＝因怀孕而指责\u003c/div>\n    \u003c/article>\n\u003carticle class=\"question-card\" id=\"q10\" data-num=\"10\">\n      \u003cdiv class=\"card-top\">\u003cspan class=\"number\">10\u003c/span>\u003cspan class=\"card-chapter\">CHAPTER 3.10\u003c/span>\u003c/div>\n      \u003cdiv class=\"section-label question-label\">QUESTION · 题目\u003c/div>\n      \u003cp class=\"english question-en\">What is the \u003cmark class=\"qmark\">glass ceiling\u003c/mark>?\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>什么是“玻璃天花板”？\u003c/p>\n      \u003cdiv class=\"separator\">\u003c/div>\n      \u003cdiv class=\"answer-content\">\u003cdiv class=\"section-label answer-label\">ANSWER · 答案\u003c/div>\n      \u003cp class=\"english answer-en\">The glass ceiling is an \u003cmark class=\"amark\">invisible barrier\u003c/mark> that \u003cmark class=\"amark\">prevents women\u003c/mark> from advancing to \u003cmark class=\"amark\">higher positions\u003c/mark> in a company.\u003c/p>\n      \u003cp class=\"translation\">\u003cspan class=\"translation-icon\">中译\u003c/span>“玻璃天花板”是指阻碍女性在公司晋升至更高职位的无形障碍。\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003cspan class=\"cue-label\">记忆线索\u003c/span>玻璃天花板＝女性晋升的无形障碍\u003c/div>\n    \u003c/article>\n\u003c/section>\n\u003cdiv class=\"notice\">整理说明：基于所提供的老师参考答案，修正了部分拼写和英语语法（例如 Sakura 的拼写、第 3 题的职位表达）。第 6 题原答案“女性工资是男性的 70%”，因此若回答“男性比女性多多少”，应换算为约 43%，不能直接写 30%。此处没有把任何题目擅自标成老师指定重点。\u003c/div>\n\u003c/main>\n\u003cscript>\n(()=>{const app=document.getElementById('app');const actions=[['zhBtn','hide-zh','隐藏中文翻译','显示中文翻译'],['answerBtn','hide-answer','隐藏答案 · 自测','显示答案'],['cueBtn','hide-cue','隐藏记忆线索','显示记忆线索']];for(const [id,cls,normal,active] of actions){const btn=document.getElementById(id);btn.addEventListener('click',()=>{let on=app.classList.toggle(cls);btn.setAttribute('aria-pressed',String(on));btn.textContent=on?active:normal})}})();\n\u003c/script>\u003c/body>\u003c/html>"}]</script><script>(()=>{
 const entries=JSON.parse(document.getElementById('data').textContent);
 const nav=document.getElementById('tabs'),host=document.getElementById('pages'),panels=new Map();
 let lastGroup='';
 for(const info of entries){
   if(info.group && info.group!==lastGroup){const g=document.createElement('span');g.className='group';g.textContent=info.group;nav.append(g);lastGroup=info.group;}
   const id=info.label.replace(/[^a-z0-9]/gi,'-');
   const b=document.createElement('button');b.type='button';b.className='tab';b.textContent=info.label;b.setAttribute('role','tab');b.setAttribute('aria-controls','panel-'+id);b.id='tab-'+id;nav.append(b);
   const section=document.createElement('section');section.className='panel';section.hidden=true;section.setAttribute('role','tabpanel');section.setAttribute('aria-labelledby',b.id);section.id='panel-'+id;
   const heading=document.createElement('div');heading.className='panelhead';heading.textContent=info.label+(info.topic?' · '+info.topic:' · 单词与配对练习');section.append(heading);
   const frame=document.createElement('iframe');frame.className='iframe';frame.title=info.label;frame.setAttribute('scrolling','no');section.append(frame);host.append(section);
   panels.set(info.label,{b,section,frame,info,loaded:false});
   frame.addEventListener('load',()=>{
      try{
       const doc=frame.contentDocument;if(!doc)return;
       if(info.inner){const btn=doc.querySelector('.page-tab[data-page="'+info.inner+'"]');if(btn)btn.click();}
       const update=()=>{const h=Math.max(doc.documentElement?.scrollHeight||0,doc.body?.scrollHeight||0,500);frame.style.height=h+'px';};
       update();
       if(typeof ResizeObserver!=='undefined'){const ro=new ResizeObserver(()=>requestAnimationFrame(update));ro.observe(doc.documentElement);if(doc.body)ro.observe(doc.body);}
       doc.addEventListener('click',()=>requestAnimationFrame(update));setTimeout(update,250);setTimeout(update,1000);
      }catch(e){frame.style.height='1000px';}
   });
   b.addEventListener('click',()=>activate(info.label,true));
 }
 function activate(label,change){
   if(!panels.has(label))label=entries[0].label;
   for(const [k,p] of panels){const yes=k===label;p.section.hidden=!yes;p.b.setAttribute('aria-selected',String(yes));p.b.tabIndex=yes?0:-1;}
   const p=panels.get(label);
   if(!p.loaded){p.loaded=true;p.frame.srcdoc=p.info.html;}
   if(change){history.replaceState(null,'','#'+label);nav.scrollIntoView({block:'start',behavior:'smooth'});}
   document.title=label+' · HR 阅读合集';
 }
 function hash(){const h=decodeURIComponent(location.hash.slice(1));return panels.has(h)?h:entries[0].label;}
 window.addEventListener('hashchange',()=>activate(hash(),false));
 nav.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const keys=entries.map(x=>x.label),idx=keys.findIndex(x=>panels.get(x).b.getAttribute('aria-selected')==='true');const next=keys[(idx+(e.key==='ArrowRight'?1:-1)+keys.length)%keys.length];activate(next,true);panels.get(next).b.focus();});
 activate(hash(),false);
})();</script></body></html>
