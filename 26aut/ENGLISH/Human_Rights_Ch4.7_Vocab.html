<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Rights 4.7 词汇复习</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+JP:wght@400;600&display=swap');

  :root{
    --cream:#f6f1e4;
    --parchment:#efe6d2;
    --sage:#8a9a7c;
    --sage-dark:#657357;
    --plum:#6e4e5c;
    --gold:#c9a24b;
    --ink:#3c352b;
    --wrong:#b05c52;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--cream);
    background-image:
      radial-gradient(circle at 10% 10%, rgba(201,162,75,0.08), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(110,78,92,0.08), transparent 40%);
    font-family:'EB Garamond','Noto Serif JP',serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }

  h1{
    font-weight:600;
    font-size:1.5rem;
    margin:0 0 4px;
    color:var(--plum);
    text-align:center;
  }
  .subtitle{
    font-style:italic;
    color:var(--sage-dark);
    margin-bottom:18px;
    text-align:center;
    font-size:0.9rem;
  }

  .page-tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .page-tab{
    border:1px solid var(--plum);
    background:transparent;
    color:var(--plum);
    padding:8px 18px;
    border-radius:999px;
    font-family:inherit;
    font-size:0.92rem;
    cursor:pointer;
    transition:all 0.2s;
  }
  .page-tab.active{
    background:var(--plum);
    color:#fff;
  }

  .page{
    display:none;
    width:100%;
    max-width:600px;
  }
  .page.active{
    display:block;
  }

  .section-title{
    text-align:center;
    color:var(--plum);
    font-weight:600;
    font-size:1.15rem;
    margin-bottom:12px;
  }

  .list-view{
    background:linear-gradient(160deg,#fbf7ea,var(--parchment));
    border:1px solid rgba(201,162,75,0.4);
    border-radius:18px;
    box-shadow:0 8px 24px rgba(60,53,43,0.12);
    padding:6px 20px;
  }
  .list-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid rgba(110,78,92,0.15);
  }
  .list-row:last-child{
    border-bottom:none;
  }
  .list-word{
    flex:0 0 auto;
    background:none;
    color:var(--plum);
    font-weight:700;
    font-size:1.05rem;
    white-space:nowrap;
  }
  .list-def-col{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .list-def{
    font-size:0.98rem;
    line-height:1.45;
    color:var(--ink);
  }
  .list-def-cn{
    font-size:0.85rem;
    color:var(--sage-dark);
  }
  .list-pos{
    font-size:0.72rem;
    color:var(--sage-dark);
    margin-left:4px;
    font-style:italic;
  }
  .kw{
    background:#f3d675;
    padding:1px 5px;
    border-radius:5px;
    font-weight:600;
    box-shadow:0 1px 2px rgba(60,53,43,0.12);
  }

  /* matching game */
  .match-controls{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .match-progress{
    text-align:center;
    color:var(--plum);
    font-size:0.95rem;
    margin-bottom:14px;
    letter-spacing:0.02em;
  }
  .match-grid{
    display:flex;
    gap:14px;
  }
  .match-col{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .match-item{
    background:linear-gradient(160deg,#fbf7ea,var(--parchment));
    border:1px solid rgba(201,162,75,0.5);
    border-radius:10px;
    padding:10px 12px;
    font-size:0.88rem;
    line-height:1.3;
    cursor:pointer;
    transition:all 0.15s;
    min-height:44px;
    display:flex;
    align-items:center;
    box-shadow:0 2px 6px rgba(60,53,43,0.08);
  }
  .match-item.word{
    font-weight:600;
    color:var(--plum);
    justify-content:center;
    text-align:center;
  }
  .match-item.def{
    color:var(--ink);
  }
  .match-item.selected{
    border-color:var(--gold);
    background:linear-gradient(160deg,#fff8e0,#f3e4bd);
    box-shadow:0 0 0 2px rgba(201,162,75,0.5);
  }
  .match-item.correct{
    background:linear-gradient(160deg,#e7edd9,#d4e0c2);
    border-color:var(--sage);
    color:var(--sage-dark);
    cursor:default;
    opacity:0.75;
  }
  .match-item.wrong{
    background:#f3d9d5;
    border-color:var(--wrong);
    animation:shake 0.3s;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  .btn{
    border:1px solid var(--sage);
    background:var(--sage);
    color:#fff;
    font-family:inherit;
    font-size:0.95rem;
    padding:8px 18px;
    border-radius:10px;
    cursor:pointer;
    transition:transform 0.15s, opacity 0.2s;
  }
  .btn.gold{
    background:var(--gold);
    border-color:var(--gold);
  }
  .btn:active{transform:scale(0.96);}

  .win-banner{
    text-align:center;
    color:var(--sage-dark);
    font-weight:600;
    margin-top:14px;
    display:none;
  }

  footer{
    margin-top:30px;
    font-size:0.75rem;
    color:var(--sage-dark);
    opacity:0.7;
    text-align:center;
  }

  .speak-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;
    height:26px;
    margin-left:8px;
    padding:0;
    border:1px solid var(--sage);
    background:transparent;
    color:var(--sage-dark);
    border-radius:50%;
    cursor:pointer;
    vertical-align:middle;
    transition:background 0.15s, color 0.15s, transform 0.15s;
    flex:0 0 auto;
  }
  .speak-btn svg{width:14px;height:14px;display:block;}
  .speak-btn:active{transform:scale(0.92);}
  .speak-btn.playing{background:var(--sage);color:#fff;}
</style>
</head>
<body>

<h1>人権 Human Rights 词汇复习</h1>
<div class="subtitle">Chapter 4.7</div>

<div class="page-tabs">
  <button class="page-tab active" data-page="p47">4.7 背诵</button>
  <button class="page-tab" data-page="pmatch">🎲 配对练习</button>
</div>

<!-- PAGE 1: Chapter 4.7 recitation list -->
<div class="page active" id="p47">
  <div class="section-title">Chapter 4.7 — Reasons for Lack of School Attendance and Solution</div>
  <div class="list-view" id="list47"></div>
</div>

<!-- PAGE 2: matching game -->
<div class="page" id="pmatch">
  <div class="section-title">全部单词配对练习（左侧按字母顺序）</div>
  <div class="match-controls">
    <button class="btn gold" id="reshuffleBtn">🔀 重新打乱释义顺序</button>
  </div>
  <div class="match-progress" id="matchProgress">已配对 0 / 12</div>
  <div class="match-grid">
    <div class="match-col" id="wordCol"></div>
    <div class="match-col" id="defCol"></div>
  </div>
  <div class="win-banner" id="winBanner">🎉 全部配对完成！点击上方按钮再来一组</div>
</div>

<footer>Osaka Jogakuin · Integrated Reading / IR Human Rights Book — Ch 4.7</footer>

<script>
const data47 = [
  ["conflict","fighting between two or more groups of people or countries","n","冲突；纷争","fighting between two or more groups"],
  ["adequately","in a way that is enough or satisfactory for a particular purpose","adv","适当地；充分地","enough or satisfactory"],
  ["priority","something that is very important and must be dealt with before other things","n","优先事项；优先(顺位)","must be dealt with before other things"],
  ["sewage","large underground pipes or passage which are used to take dirty water and human waste away from houses and other buildings","n","污水；下水","take dirty water and human waste away"],
  ["disposal","act of getting rid of something, especially by throwing it away","n","处理；处置","getting rid of something"],
  ["sanitation","the system for taking dirty water and other waste products away from buildings in order to protect people's health","n","卫生设施","protect people's health"],
  ["malnutrition","physical weakness and bad health caused by having too little food","n","营养不良","too little food"],
  ["inaction","failure to do anything that might provide a solution to a problem","n","不作为；无行动","failure to do anything"],
  ["burden","something difficult or unpleasant that you have to deal with or worry about","n","负担；重担","difficult or unpleasant"],
  ["flee","to escape by running away, especially because of danger or fear","v","逃离；避难","escape by running away"],
  ["mortality","the number of deaths within a particular society and within a particular period of time","n","死亡率","number of deaths"],
  ["stable","firmly fixed or not likely to move or change","adj","稳定的","firmly fixed"]
];

const SPEAK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

function speakText(raw, btn){
  if(!('speechSynthesis' in window)) return;
  const text = raw.replace(/\(s\)/g,'').replace(/[()]/g,'').replace(/\s+/g,' ').trim();
  const synth = window.speechSynthesis;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.85;
  const voice = synth.getVoices().find(v=>/^en[-_]US/i.test(v.lang));
  if(voice) u.voice = voice;
  if(btn) btn.classList.add('playing');
  const done = ()=>{ if(btn) btn.classList.remove('playing'); };
  u.onend = done;
  u.onerror = done;
  synth.speak(u);
}

function makeSpeakBtn(word){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'speak-btn';
  b.setAttribute('aria-label','朗读 ' + word);
  b.innerHTML = SPEAK_ICON;
  b.addEventListener('click', e=>{ e.stopPropagation(); speakText(word, b); });
  return b;
}

function buildHighlightedDef(defText, keyword){
  const frag = document.createDocumentFragment();
  const idx = keyword ? defText.indexOf(keyword) : -1;
  if(idx === -1){
    frag.appendChild(document.createTextNode(defText));
    return frag;
  }
  if(idx > 0) frag.appendChild(document.createTextNode(defText.slice(0, idx)));
  const kw = document.createElement('span');
  kw.className = 'kw';
  kw.textContent = defText.slice(idx, idx + keyword.length);
  frag.appendChild(kw);
  const rest = defText.slice(idx + keyword.length);
  if(rest) frag.appendChild(document.createTextNode(rest));
  return frag;
}

function renderList(containerId, data){
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  data.forEach(([w,d,pos,cn,kw])=>{
    const row = document.createElement('div');
    row.className = 'list-row';
    const wordEl = document.createElement('span');
    wordEl.className = 'list-word';
    wordEl.textContent = w;
    wordEl.appendChild(makeSpeakBtn(w));
    const defCol = document.createElement('span');
    defCol.className = 'list-def-col';
    const defEl = document.createElement('span');
    defEl.className = 'list-def';
    defEl.appendChild(buildHighlightedDef(d, kw));
    const posEl = document.createElement('span');
    posEl.className = 'list-pos';
    posEl.textContent = `[${pos}]`;
    defEl.appendChild(posEl);
    const cnEl = document.createElement('span');
    cnEl.className = 'list-def-cn';
    cnEl.textContent = cn;
    defCol.appendChild(defEl);
    defCol.appendChild(cnEl);
    row.appendChild(wordEl);
    row.appendChild(defCol);
    el.appendChild(row);
  });
}
renderList('list47', data47);

// page tab switching
document.querySelectorAll('.page-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.page-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.page).classList.add('active');
  });
});

// ---- matching game ----
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const wordCol = document.getElementById('wordCol');
const defCol = document.getElementById('defCol');
const matchProgress = document.getElementById('matchProgress');
const winBanner = document.getElementById('winBanner');

let roundPairs = [];
let matchedCount = 0;
let selectedWord = null;
let selectedDef = null;
let lock = false;

function startRound(){
  const pool = [...data47].sort((a,b)=> a[0].localeCompare(b[0]));

  roundPairs = pool.map((item, i)=>({id:i, word:item[0], def:item[1]}));
  matchedCount = 0;
  selectedWord = null;
  selectedDef = null;
  lock = false;
  winBanner.style.display = 'none';
  matchProgress.textContent = `已配对 0 / ${roundPairs.length}`;

  const words = roundPairs; // alphabetical, unshuffled
  const defs = shuffle(roundPairs);

  wordCol.innerHTML = "";
  defCol.innerHTML = "";

  words.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'match-item word';
    el.textContent = p.word;
    el.appendChild(makeSpeakBtn(p.word));
    el.dataset.id = p.id;
    el.addEventListener('click', ()=>onPick(el, 'word', p.id));
    wordCol.appendChild(el);
  });

  defs.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'match-item def';
    el.textContent = p.def;
    el.dataset.id = p.id;
    el.addEventListener('click', ()=>onPick(el, 'def', p.id));
    defCol.appendChild(el);
  });
}

function onPick(el, kind, id){
  if(lock || el.classList.contains('correct')) return;

  if(kind === 'word'){
    if(selectedWord) selectedWord.el.classList.remove('selected');
    selectedWord = {el, id};
    el.classList.add('selected');
  } else {
    if(selectedDef) selectedDef.el.classList.remove('selected');
    selectedDef = {el, id};
    el.classList.add('selected');
  }

  if(selectedWord && selectedDef){
    lock = true;
    if(selectedWord.id === selectedDef.id){
      selectedWord.el.classList.remove('selected');
      selectedDef.el.classList.remove('selected');
      selectedWord.el.classList.add('correct');
      selectedDef.el.classList.add('correct');
      matchedCount++;
      matchProgress.textContent = `已配对 ${matchedCount} / ${roundPairs.length}`;
      selectedWord = null;
      selectedDef = null;
      lock = false;
      if(matchedCount === roundPairs.length){
        winBanner.style.display = 'block';
      }
    } else {
      selectedWord.el.classList.add('wrong');
      selectedDef.el.classList.add('wrong');
      setTimeout(()=>{
        selectedWord.el.classList.remove('selected','wrong');
        selectedDef.el.classList.remove('selected','wrong');
        selectedWord = null;
        selectedDef = null;
        lock = false;
      }, 500);
    }
  }
}

document.getElementById('reshuffleBtn').addEventListener('click', startRound);

startRound();
</script>

</body>
</html>
