<h1>ABAB副词</h1><p class="intro">相同的节拍，不同的感觉。先认场景，再比较词义。</p>
<div class="note">ABAB：两拍词基重复，如 きらきら。おそるおそる 属于长词基重复；しみじみ 属于连浊叠式；てきぱき 属于近似叠式。重复形式不决定词性，也不都是拟声拟态词。</div>
