<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Zoe 的学习资料库，按学期、课程和课次整理课堂知识。">
  <meta name="application-name" content="Zoe Study">
  <meta name="theme-color" content="#f7f4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zoe Study">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Zoe's Study Archive</title>
  <link rel="manifest" href="./manifest.webmanifest?v=20261011-2">
  <link rel="icon" type="image/png" href="./apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180x180.png">
  <link rel="stylesheet" href="./assets/archive.css?v=20261011-3">
  <script type="module" src="./assets/archive.js?v=20261011-2"></script>
</head>
<body>
  <a class="skip-link" href="#materials">跳到资料列表</a>
  <header class="site-header">
    <div class="header-left">
      <h1>Zoe's <span>Study Archive</span></h1>
      <div class="semester-navigation">
        <p id="semesterLabel" class="semester-label">2026 秋学期</p>
        <button id="currentSemesterButton" class="text-button" type="button" hidden>返回当前学期</button>
        <details class="archive-menu" id="archiveMenu">
          <summary>历史资料 <span aria-hidden="true">⌄</span></summary>
          <div id="archiveOptions" class="archive-options"></div>
        </details>
      </div>
    </div>
    <div class="header-stats" aria-label="当前学期统计">
      <p class="stat-chip"><strong id="totalCount">—</strong> <span>份资料</span></p>
      <p class="stat-chip"><strong id="subjectCount">—</strong> <span>个科目</span></p>
    </div>
  </header>
  <div class="controls">
    <div class="search-row">
      <div class="search-wrap">
        <label class="visually-hidden" for="searchInput">搜索资料名称、知识点或课程</label>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7.5"/><path d="m17 17 4 4"/></svg>
        <input type="search" id="searchInput" placeholder="搜索资料名称、知识点或课程…" autocomplete="off">
      </div>
      <button type="button" id="filterToggle" class="utility-button filter-toggle" aria-expanded="false" aria-controls="advancedFilters" hidden>筛选</button>
      <button type="button" id="clearFilters" class="text-button" disabled>清除筛选</button>
    </div>
    <div class="filter-row">
      <div id="courseFilter" class="filter-group" role="group" aria-label="课程筛选"></div>
      <div class="sort-control">
        <label for="sortSelect">排序</label>
        <select id="sortSelect">
          <option value="lesson">按课次</option>
          <option value="updated">最近更新</option>
          <option value="title">按名称</option>
        </select>
      </div>
    </div>
    <div id="advancedFilters" class="advanced-filters">
      <div id="subjectFilter" class="filter-group" role="group" aria-label="科目筛选"></div>
      <div id="typeFilter" class="filter-group" role="group" aria-label="类型筛选"></div>
    </div>
  </div>
  <main id="materials" class="layout" tabindex="-1">
    <div id="loadStatus" class="load-status" role="status" aria-live="polite" aria-atomic="true">
      <span id="statusMessage">正在载入资料目录…</span>
      <button type="button" id="retryButton" class="utility-button" hidden>重新加载</button>
      <details id="errorDetails" hidden><summary>错误详情</summary><p id="errorMessage"></p></details>
    </div>
    <p id="resultsInfo" class="results-info" aria-live="polite" aria-atomic="true"></p>
    <div id="cardGrid" class="card-grid" aria-busy="true"></div>
    <div id="emptyState" class="empty-state" hidden>
      <p id="emptyMessage">没有找到符合条件的资料</p>
      <button type="button" id="emptyClearButton" class="utility-button">清除筛选</button>
    </div>
  </main>
  <footer>每一回，慢慢积累。</footer>
  <noscript><p class="noscript-message">请启用 JavaScript 查看资料目录。<a href="./26aut/数据科学第1回_知识点_汉字假名.html">也可以直接打开第一回资料。</a></p></noscript>
</body>
</html>
