<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>含义接近 · 容易混淆 · Vocabulary Compendium</title><style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;600&display=swap');

*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'EB Garamond','Noto Serif SC',serif;line-height:1.6;padding-bottom:60px}.hero{text-align:center;padding:32px 20px 20px}.jp{color:var(--rose);font-style:italic;letter-spacing:2px}.hero h1{margin:3px 0 8px;font-size:2em}.sub{color:#7a7488;font-style:italic}.divider{width:220px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto 0}.nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 14px;margin:18px auto}.nav a,.nav button{font:inherit;font-size:.92em;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:#5f5870;text-decoration:none;cursor:pointer}.nav a.current{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:600}.nav a:hover,.nav button:hover{border-color:var(--gold)}main{max-width:860px;margin:auto;padding:0 18px}.summary{text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0 18px;color:#7a7488}.unit{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:13px;overflow:hidden}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;background:var(--parchment);cursor:pointer}.title{font-weight:600;color:var(--sage-dark);font-size:1.08em}.meta{font-size:.82em;color:#857c96;white-space:nowrap}.chev{color:var(--gold);transition:.2s}.unit.open .chev{transform:rotate(180deg)}.body{max-height:0;overflow:hidden;transition:max-height .3s}.unit.open .body{max-height:6000px}.note{margin:14px 18px 0;padding:10px 13px;border-left:3px solid var(--plum);background:#f6e6ee;border-radius:0 8px 8px 0;font-family:'Noto Serif SC',serif;font-size:.9em;color:#6a5572}.cards{display:grid;gap:10px;padding:13px 18px 18px}.card{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:11px 14px}.row{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}.en{font-size:1.2em;font-weight:700}.zh{font-family:'Noto Serif SC',serif;color:#8983a0;font-size:.9em}.src{margin-left:auto;font-size:.76em;color:#857c96;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 7px}.def{margin-top:3px}.def mark{background:var(--gold-light);font-weight:700;padding:1px 4px;border-radius:4px}footer{text-align:center;color:#9992ab;font-style:italic;margin-top:38px}@media(max-width:600px){.hero h1{font-size:1.6em}.head{padding:13px 14px}.note{margin:12px 14px 0}.cards{padding:11px 14px 15px}.src{margin-left:0}}</style></head><body><header class="hero"><div class="jp">まぎらわしい言葉</div><h1>含义接近 · 容易混淆</h1><div class="sub">这些词的中文或英文释义较接近，背诵时需要特别留意使用场景和细微差别。</div><div class="divider"></div></header><nav class="nav"><a href="vocabulary_compendium.html" class="">词汇总表</a><a href="vocabulary_word_families.html" class="">词族与变形</a><a href="vocabulary_confusable_meanings.html" class="current">近义易混词</a><a href="vocabulary_related_topics.html" class="">同主题关联词</a><button id="open">全部展开</button><button id="close">全部收起</button></nav><main><div class="summary" id="sum"></div><div id="groups"></div></main><footer>词汇辨析整理 · Vocabulary Compendium</footer><script src="vocabulary_confusable_data.js"></script><script>(()=>{const q=s=>document.querySelector(s),qa=s=>document.querySelectorAll(s),root=q('#groups'),G=window.VOCAB_GROUPS||[];q('#sum').textContent=`${G.length} groups · ${G.reduce((n,g)=>n+g.w.length,0)} word cards · 点击每组展开`;G.forEach((g,i)=>{const u=document.createElement('section');u.className='unit'+(i===0?' open':'');u.innerHTML=`<div class="head"><span class="title">${String(i+1).padStart(2,'0')} · ${g.t}</span><span class="meta">${g.w.length} words</span><span class="chev">▾</span></div><div class="body"><div class="note"><b>辨析提示：</b>${g.n}</div><div class="cards">${g.w.map(x=>`<div class="card"><div class="row"><span class="en">${x[0]}</span><span class="zh">${x[1]}</span><span class="src">${x[3]}</span></div><div class="def">${x[2]}</div></div>`).join('')}</div></div>`;u.querySelector('.head').onclick=()=>u.classList.toggle('open');root.appendChild(u)});q('#open').onclick=()=>qa('.unit').forEach(x=>x.classList.add('open'));q('#close').onclick=()=>qa('.unit').forEach(x=>x.classList.remove('open'))})();</script></body></html>
