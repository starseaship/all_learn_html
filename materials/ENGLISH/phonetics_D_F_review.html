<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发音学 D＋F 复习</title><style>
:root{--bg:#f4f1eb;--paper:#fffefa;--ink:#292724;--muted:#716c63;--line:#ddd6ca;--accent:#315e63;--soft:#e7f0ef;--hi:#fff0a8;--hib:#d6a72b;--ok:#eaf8ee;--bad:#fff0f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",Arial,sans-serif;line-height:1.5}button,input{font:inherit}.wrap{width:min(1120px,calc(100% - 18px));margin:14px auto 50px}.tabs{position:sticky;top:6px;z-index:9;display:flex;gap:6px;padding:6px;margin:0 auto 14px;width:max-content;max-width:100%;background:rgba(255,254,250,.96);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 20px #0001}.tabs button,.actions button{border:1px solid var(--accent);border-radius:999px;background:#fff;color:var(--accent);padding:8px 13px;font-weight:700;cursor:pointer}.tabs button.active,.actions button.primary{background:var(--accent);color:#fff}.panel[hidden]{display:none}.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #0000000d;overflow:hidden;margin-bottom:16px}.head{padding:22px;background:linear-gradient(135deg,#fffefa,#edf5f4);border-bottom:1px solid var(--line)}h1{font-size:clamp(25px,4vw,39px);margin:0 0 6px}h2{margin:0;font-size:22px}h3{margin:0 0 9px;color:var(--accent)}p{margin:5px 0;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.legend{display:inline-block;margin-top:10px;padding:4px 9px;border-radius:999px;background:var(--hi);border:1px solid var(--hib);font-weight:700;color:#5d4600}.content{padding:16px}.focus-grid,.cards,.quiz-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.focus{display:grid;grid-template-columns:30px minmax(70px,.8fr) 1fr;align-items:center;gap:8px;padding:10px;border:1px solid #e5ce6e;background:#fff9d8;border-radius:10px}.num{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:#ece8df;font-size:13px;font-weight:800;color:#625d55}.focus .num,.highlight .num{background:var(--hi);border:1px solid var(--hib);color:#5d4600}.ipa{font-family:"Charis SIL","Doulos SIL","Noto Sans",sans-serif;font-size:18px;font-weight:650}.group{padding:15px 0;border-top:1px solid var(--line)}.group:first-child{border-top:0}.card{display:grid;grid-template-columns:32px minmax(72px,.8fr) 1fr;align-items:center;gap:8px;min-height:50px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}.hide-answer .word,.hide-ipa .ipa{color:transparent;border-bottom:2px solid #746d63;user-select:none}.quiz-card{display:grid;grid-template-columns:32px 1fr;gap:8px;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.quiz-card input{grid-column:2;width:100%;border:0;border-bottom:2px solid #827b71;background:transparent;padding:6px 3px;outline:none}.feedback{grid-column:2;min-height:18px;font-size:13px;color:#9b2626}input.ok{background:var(--ok);border-bottom-color:#29834a}input.bad{background:var(--bad);border-bottom-color:#bd3a3a}.score{min-height:24px;margin-top:10px;color:var(--accent);font-weight:800}.filter-vowel .f-consonant,.filter-consonant .f-vowel{display:none}@media(max-width:850px){.focus-grid,.cards,.quiz-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.wrap{width:calc(100% - 10px);margin-top:5px}.tabs{width:100%}.tabs button{flex:1;padding:8px 5px;font-size:13px}.focus-grid,.cards,.quiz-grid{grid-template-columns:1fr}.head,.content{padding:15px}.card{grid-template-columns:30px 86px 1fr}}
</style></head><body><main class="wrap"><nav class="tabs"><button id="tabD" class="active">D复习表</button><button id="tabQuiz">D随机默写</button><button id="tabF">F题范围</button></nav>
<section id="panelD" class="panel"><div class="box"><header class="head"><h1>D题：IPA → 英文拼写</h1><p>老师指定五页范围，共105个词项。黄色序号是老师点名词；knit 是老师额外补充。</p><span class="legend">黄色序号＝老师重点</span><div class="actions"><button id="toggleD" class="primary">隐藏英文答案</button><button id="onlyDFocus">只看老师重点</button><button id="allD">显示全部</button></div></header><div class="content"><h2>老师点名15词</h2><div id="dFocus" class="focus-grid" style="margin-top:12px"></div><div id="dGroups"></div></div></div></section>
<section id="panelQuiz" class="panel" hidden><div class="box"><header class="head"><h1>D随机默写</h1><p>包含五页全部词项，并加入老师补充的 knit。每次重新打乱都会换顺序。</p><div class="actions"><button id="reshuffle" class="primary">重新打乱</button><button id="checkD">检查答案</button><button id="revealD">显示答案</button><button id="clearD">清空</button></div><div id="dScore" class="score"></div></header><div id="dQuiz" class="content quiz-grid"></div></div></section>
<section id="panelF" class="panel" hidden><div class="box"><header class="head"><h1>F题：教材 p.31 范围</h1><p>共80个词项，音标按教材写法保留，包括重音、送气 ʰ、dark L ɫ 与长音符号。</p><span class="legend">黄色序号＝老师重点</span><div class="actions"><button id="showF" class="primary">显示全部</button><button id="vowelF">只看元音</button><button id="consonantF">只看辅音</button><button id="toggleF">隐藏音标</button><button id="practiceF">随机20题</button></div></header><div class="content"><div id="fPracticeBox" hidden><h2>随机20题：写完整音标</h2><div class="actions"><button id="checkF">检查答案</button></div><div id="fScore" class="score"></div><div id="fQuiz" class="quiz-grid" style="margin-top:10px"></div></div><div id="fGroups"></div></div></div></section>
</main><script>
const D=[{"title":"第1组：/iː/–/i/ 与 /e/–/æ/","items":[{"ipa":"[iːt]","word":"eat"},{"ipa":"[it]","word":"it"},{"ipa":"[fiːt]","word":"feet"},{"ipa":"[fit]","word":"fit"},{"ipa":"[fiːl]","word":"feel"},{"ipa":"[fil]","word":"fill"},{"ipa":"[liːv]","word":"leave"},{"ipa":"[liv]","word":"live"},{"ipa":"[riːtʃ]","word":"reach"},{"ipa":"[ritʃ]","word":"rich"},{"ipa":"[pʰet]","word":"pet"},{"ipa":"[pʰæt]","word":"pat"},{"ipa":"[pʰen]","word":"pen"},{"ipa":"[pʰæn]","word":"pan"},{"ipa":"[beg]","word":"beg"},{"ipa":"[bæg]","word":"bag"},{"ipa":"[sed]","word":"said"},{"ipa":"[sæd]","word":"sad"},{"ipa":"[send]","word":"send"},{"ipa":"[sænd]","word":"sand"}]},{"title":"第2组：/uː/–/u/ 与 /æ/–/ɑ/","items":[{"ipa":"[pʰuːl]","word":"pool"},{"ipa":"[pʰul]","word":"pull"},{"ipa":"[fuːl]","word":"fool"},{"ipa":"[ful]","word":"full"},{"ipa":"[huːd]","word":"who’d"},{"ipa":"[hud]","word":"hood"},{"ipa":"[æd]","word":"add"},{"ipa":"[ɑd]","word":"odd"},{"ipa":"[bænd]","word":"band"},{"ipa":"[bɑnd]","word":"bond"},{"ipa":"[blæk]","word":"black"},{"ipa":"[blɑk]","word":"block"},{"ipa":"[tʰæp]","word":"tap"},{"ipa":"[tʰɑp]","word":"top"},{"ipa":"[kʰæt]","word":"cat"},{"ipa":"[kʰɑt]","word":"cot"},{"ipa":"[mæp]","word":"map"},{"ipa":"[mɑp]","word":"mop"},{"ipa":"[hæt]","word":"hat"},{"ipa":"[hɑt]","word":"hot"}]},{"title":"第3组：/æ/–/ʌ/–/ɑ/","items":[{"ipa":"[ˈæŋkəl]","word":"ankle"},{"ipa":"[ˈʌŋkəl]","word":"uncle"},{"ipa":"[bæg]","word":"bag"},{"ipa":"[bʌg]","word":"bug"},{"ipa":"[stæf]","word":"staff"},{"ipa":"[stʌf]","word":"stuff"},{"ipa":"[mæd]","word":"mad"},{"ipa":"[mʌd]","word":"mud"},{"ipa":"[klʌk]","word":"cluck"},{"ipa":"[klɑk]","word":"clock"},{"ipa":"[nʌt]","word":"nut"},{"ipa":"[nɑt]","word":"not"},{"ipa":"[stʌk]","word":"stuck"},{"ipa":"[stɑk]","word":"stock"},{"ipa":"[rʌb]","word":"rub"},{"ipa":"[rɑb]","word":"rob"},{"ipa":"[kʰæp]","word":"cap"},{"ipa":"[kʰʌp]","word":"cup"},{"ipa":"[kʰɑp]","word":"cop"},{"ipa":"[hæt]","word":"hat"},{"ipa":"[hʌt]","word":"hut"},{"ipa":"[hɑt]","word":"hot"},{"ipa":"[læk]","word":"lack"},{"ipa":"[lʌk]","word":"luck"},{"ipa":"[lɑk]","word":"lock"}]},{"title":"第4组：/e/–/ei/ 与 /ou/–/ɔː/","items":[{"ipa":"[pʰen]","word":"pen"},{"ipa":"[pʰein]","word":"pain"},{"ipa":"[tʰest]","word":"test"},{"ipa":"[tʰeist]","word":"taste"},{"ipa":"[det]","word":"debt"},{"ipa":"[deit]","word":"date"},{"ipa":"[get]","word":"get"},{"ipa":"[geit]","word":"gate"},{"ipa":"[sel]","word":"sell"},{"ipa":"[seil]","word":"sale"},{"ipa":"[let]","word":"let"},{"ipa":"[leit]","word":"late"},{"ipa":"[bout]","word":"boat"},{"ipa":"[bɔːt]","word":"bought"},{"ipa":"[boul]","word":"bowl"},{"ipa":"[bɔːl]","word":"ball"},{"ipa":"[kʰout]","word":"coat"},{"ipa":"[kʰɔːt]","word":"caught"},{"ipa":"[wouk]","word":"woke"},{"ipa":"[wɔːk]","word":"walk"}]},{"title":"第5组：卷舌元音 /ɚ/ 与 /ɑr/","items":[{"ipa":"[pʰɚs]","word":"purse"},{"ipa":"[pʰɑrs]","word":"parse"},{"ipa":"[bɚn]","word":"burn"},{"ipa":"[bɑrn]","word":"barn"},{"ipa":"[dɚt]","word":"dirt"},{"ipa":"[dɑrt]","word":"dart"},{"ipa":"[ˈkʰɚtən]","word":"curtain"},{"ipa":"[ˈkʰɑrtən]","word":"carton"},{"ipa":"[fɚ]","word":"fur"},{"ipa":"[fɑr]","word":"far"},{"ipa":"[fɚm]","word":"firm"},{"ipa":"[fɑrm]","word":"farm"},{"ipa":"[ˈfɚðɚ]","word":"further"},{"ipa":"[ˈfɑrðɚ]","word":"farther"},{"ipa":"[stɚ]","word":"stir"},{"ipa":"[stɑr]","word":"star"},{"ipa":"[hɚt]","word":"hurt"},{"ipa":"[hɑrt]","word":"heart"},{"ipa":"[hɚd]","word":"heard"},{"ipa":"[hɑrd]","word":"hard"}]}],F=[{"title":"元音 /i:/","kind":"vowel","items":[{"word":"week","ipa":"[wi:k]"},{"word":"eating","ipa":"[í:tiŋ]"}]},{"title":"元音 /i/","kind":"vowel","items":[{"word":"in","ipa":"[in]"},{"word":"be","ipa":"[bi]"},{"word":"it","ipa":"[it]"},{"word":"if","ipa":"[if]"}]},{"title":"元音 /e/","kind":"vowel","items":[{"word":"Emi","ipa":"[émi]"},{"word":"welcome","ipa":"[wélkəm]"},{"word":"eleven","ipa":"[ilévən]"}]},{"title":"元音 /æ/","kind":"vowel","items":[{"word":"can’t","ipa":"[kʰænt]"},{"word":"Saturday","ipa":"[sǽtərdei]"}]},{"title":"元音 /ə/","kind":"vowel","items":[{"word":"a","ipa":"[ə]"},{"word":"some","ipa":"[səm]"},{"word":"us","ipa":"[əs]"},{"word":"at","ipa":"[ət]"}]},{"title":"元音 /ʌ/","kind":"vowel","items":[{"word":"love","ipa":"[lʌv]"},{"word":"come","ipa":"[kʰʌm]"}]},{"title":"元音 /ər/","kind":"vowel","items":[{"word":"are","ipa":"[ər]"},{"word":"there","ipa":"[ðər]"}]},{"title":"元音 /u:/","kind":"vowel","items":[{"word":"student","ipa":"[stjú:dənt]"},{"word":"too","ipa":"[tʰú:]"}]},{"title":"元音 /u/","kind":"vowel","items":[{"word":"to","ipa":"[tu]"},{"word":"could","ipa":"[kud]"}]},{"title":"元音 /ɔ:/","kind":"vowel","items":[{"word":"talking","ipa":"[tʰɔ́:kiŋ]"}]},{"title":"元音 /ɑ/","kind":"vowel","items":[{"word":"what","ipa":"[wɑ́t, hwɑ́t]"}]},{"title":"元音 /ai/","kind":"vowel","items":[{"word":"I","ipa":"[ai]"}]},{"title":"元音 /ou/","kind":"vowel","items":[{"word":"oh","ipa":"[óu]"},{"word":"OK","ipa":"[oukéi, oukʰéi]"}]},{"title":"辅音 /p/","kind":"consonant","items":[{"word":"people","ipa":"[pʰí:pəɫ]"},{"word":"prepare","ipa":"[pripʰéər]"},{"word":"party","ipa":"[pʰɑ́rti]"}]},{"title":"辅音 /b/","kind":"consonant","items":[{"word":"barbecue","ipa":"[bɑ́rbikjù:]"}]},{"title":"辅音 /t/","kind":"consonant","items":[{"word":"Tim","ipa":"[tʰím]"},{"word":"time","ipa":"[tʰáim]"}]},{"title":"辅音 /d/","kind":"consonant","items":[{"word":"dorm","ipa":"[dɔ́:rm]"},{"word":"do","ipa":"[dú:]"},{"word":"introduce","ipa":"[intrədjú:s]"}]},{"title":"辅音 /k/","kind":"consonant","items":[{"word":"came","ipa":"[kʰéim]"},{"word":"can","ipa":"[kən]"},{"word":"course","ipa":"[kʰɔ́:rs]"}]},{"title":"辅音 /g/","kind":"consonant","items":[{"word":"going","ipa":"[góuiŋ]"},{"word":"great","ipa":"[gréit]"},{"word":"garden","ipa":"[gɑ́rdən]"}]},{"title":"辅音 /f/","kind":"consonant","items":[{"word":"from","ipa":"[frəm]"},{"word":"for","ipa":"[fə, fər]"},{"word":"friends","ipa":"[fréndz]"}]},{"title":"辅音 /v/","kind":"consonant","items":[{"word":"have","ipa":"[hǽv]"},{"word":"of","ipa":"[əv]"}]},{"title":"辅音 /θ/","kind":"consonant","items":[{"word":"anything","ipa":"[éniθiŋ]"}]},{"title":"辅音 /ð/","kind":"consonant","items":[{"word":"the","ipa":"[ðə]"},{"word":"this","ipa":"[ðis]"},{"word":"with","ipa":"[wið]"}]},{"title":"辅音 /s/","kind":"consonant","items":[{"word":"semester","ipa":"[səméstər]"},{"word":"students","ipa":"[stjú:dənts]"},{"word":"outside","ipa":"[àu(t)sáid]"}]},{"title":"辅音 /z/","kind":"consonant","items":[{"word":"is","ipa":"[iz]"}]},{"title":"辅音 /ʃ/","kind":"consonant","items":[{"word":"sure","ipa":"[ʃúər]"},{"word":"should","ipa":"[ʃud]"}]},{"title":"辅音 /h/","kind":"consonant","items":[{"word":"hi","ipa":"[hái]"},{"word":"here","ipa":"[híər]"}]},{"title":"辅音 /dʒ/","kind":"consonant","items":[{"word":"Japan","ipa":"[dʒəpʰǽn]"}]},{"title":"辅音 /m/","kind":"consonant","items":[{"word":"I’m","ipa":"[aim]"},{"word":"me","ipa":"[mi]"},{"word":"my","ipa":"[mai]"}]},{"title":"辅音 /n/","kind":"consonant","items":[{"word":"new","ipa":"[njú:]"},{"word":"and","ipa":"[ən]"},{"word":"no","ipa":"[nóu]"}]},{"title":"辅音 /ŋ/","kind":"consonant","items":[{"word":"bring","ipa":"[bríŋ]"}]},{"title":"辅音 /l/","kind":"consonant","items":[{"word":"last","ipa":"[læst]"},{"word":"please","ipa":"[plí:z]"}]},{"title":"暗 L /ɫ/","kind":"consonant","items":[{"word":"there’ll","ipa":"[ðərɫ]"},{"word":"help","ipa":"[héɫp]"},{"word":"I’ll","ipa":"[aiɫ]"}]},{"title":"辅音 /w/","kind":"consonant","items":[{"word":"wait","ipa":"[wéit]"},{"word":"we","ipa":"[wi]"},{"word":"would","ipa":"[wud]"}]},{"title":"辅音 /r/","kind":"consonant","items":[{"word":"front","ipa":"[frʌnt]"},{"word":"problem","ipa":"[pʰrɑ́bləm]"}]},{"title":"辅音 /j/","kind":"consonant","items":[{"word":"you","ipa":"[ju]"},{"word":"yes","ipa":"[jés]"}]}],DFOCUS=["beg", "band", "knit", "boat", "fur", "reach", "tap", "stuck", "caught", "farm", "said", "cat", "mad", "walk", "star"],FFOCUS=["a", "party", "sure", "no", "front", "too", "great", "here", "bring", "problem", "oh", "friends", "Japan", "wait", "have"],DEXTRA={word:'knit',ipa:'[nit]'};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return s.trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/^\[/,'').replace(/\]$/,'').replace(/\s+/g,'')}
function setTab(name){const map={D:['#panelD','#tabD'],Q:['#panelQuiz','#tabQuiz'],F:['#panelF','#tabF']};Object.values(map).forEach(([p,t])=>{$ (p).hidden=true;$(t).classList.remove('active')});$(map[name][0]).hidden=false;$(map[name][1]).classList.add('active');scrollTo(0,0)}
$('#tabD').onclick=()=>setTab('D');$('#tabQuiz').onclick=()=>setTab('Q');$('#tabF').onclick=()=>setTab('F');
const dFlat=D.flatMap(g=>g.items),dAll=[...dFlat,DEXTRA];
function renderDFocus(){$('#dFocus').innerHTML=DFOCUS.map((w,i)=>{const x=dAll.find(v=>v.word===w)||{word:w,ipa:''};return `<div class="focus"><span class="num">${i+1}</span><strong>${x.word}</strong><span class="ipa">${x.ipa}</span></div>`}).join('')}
function renderD(){let n=0;$('#dGroups').innerHTML=D.map(g=>`<section class="group"><h3>${g.title}</h3><div class="cards">${g.items.map(x=>{n++;const hi=DFOCUS.includes(x.word)?' highlight':'';return `<article class="card${hi}" data-focus="${hi?'1':'0'}"><span class="num">${n}</span><strong class="word">${x.word}</strong><span class="ipa">${x.ipa}</span></article>`}).join('')}</div></section>`).join('')}
renderDFocus();renderD();
$('#toggleD').onclick=e=>{$('#panelD').classList.toggle('hide-answer');e.target.textContent=$('#panelD').classList.contains('hide-answer')?'显示英文答案':'隐藏英文答案'};
$('#onlyDFocus').onclick=()=>$$('#dGroups .card').forEach(x=>x.style.display=x.dataset.focus==='1'?'':'none');$('#allD').onclick=()=>$$('#dGroups .card').forEach(x=>x.style.display='');
let currentD=[];function renderDQuiz(){currentD=shuffle(dAll);$('#dScore').textContent='';$('#dQuiz').innerHTML=currentD.map((x,i)=>`<article class="quiz-card ${DFOCUS.includes(x.word)?'highlight':''}"><span class="num">${i+1}</span><span class="ipa">${x.ipa}</span><input data-a="${x.word.replace(/"/g,'&quot;')}" autocomplete="off" spellcheck="false" placeholder="写英文单词"><div class="feedback"></div></article>`).join('')}renderDQuiz();
$('#reshuffle').onclick=renderDQuiz;$('#clearD').onclick=()=>{$$('#dQuiz input').forEach(x=>{x.value='';x.className=''});$$('#dQuiz .feedback').forEach(x=>x.textContent='');$('#dScore').textContent=''};$('#revealD').onclick=()=>$$('#dQuiz input').forEach(x=>x.parentElement.querySelector('.feedback').textContent='答案：'+x.dataset.a);$('#checkD').onclick=()=>{let f=0,c=0;$$('#dQuiz input').forEach(x=>{const fb=x.parentElement.querySelector('.feedback');x.classList.remove('ok','bad');if(!norm(x.value)){fb.textContent='';return}f++;if(norm(x.value)===norm(x.dataset.a)){c++;x.classList.add('ok');fb.textContent='正确'}else{x.classList.add('bad');fb.textContent='答案：'+x.dataset.a}});$('#dScore').textContent=`已填写 ${f} / ${currentD.length}；正确 ${c} 题`};
function renderF(){let n=0;$('#fGroups').innerHTML=F.map(g=>`<section class="group f-${g.kind}"><h3>${g.title}</h3><div class="cards">${g.items.map(x=>{n++;const hi=FFOCUS.includes(x.word)?' highlight':'';return `<article class="card${hi}"><span class="num">${n}</span><strong class="word">${x.word}</strong><span class="ipa">${x.ipa}</span></article>`}).join('')}</div></section>`).join('')}renderF();
$('#showF').onclick=()=>$('#panelF').classList.remove('filter-vowel','filter-consonant');$('#vowelF').onclick=()=>{$('#panelF').classList.remove('filter-consonant');$('#panelF').classList.add('filter-vowel')};$('#consonantF').onclick=()=>{$('#panelF').classList.remove('filter-vowel');$('#panelF').classList.add('filter-consonant')};$('#toggleF').onclick=e=>{$('#panelF').classList.toggle('hide-ipa');e.target.textContent=$('#panelF').classList.contains('hide-ipa')?'显示音标':'隐藏音标'};
const fFlat=F.flatMap(g=>g.items);let currentF=[];function renderFQuiz(){currentF=shuffle(fFlat).slice(0,20);$('#fPracticeBox').hidden=false;$('#fScore').textContent='';$('#fQuiz').innerHTML=currentF.map((x,i)=>`<article class="quiz-card ${FFOCUS.includes(x.word)?'highlight':''}"><span class="num">${i+1}</span><strong>${x.word}</strong><input data-a="${x.ipa.replace(/"/g,'&quot;')}" autocomplete="off" spellcheck="false" placeholder="写完整音标"><div class="feedback"></div></article>`).join('');$('#fPracticeBox').scrollIntoView({behavior:'smooth'})}$('#practiceF').onclick=renderFQuiz;$('#checkF').onclick=()=>{let f=0,c=0;$$('#fQuiz input').forEach(x=>{const fb=x.parentElement.querySelector('.feedback');x.classList.remove('ok','bad');if(!norm(x.value)){fb.textContent='';return}f++;if(norm(x.value)===norm(x.dataset.a)){c++;x.classList.add('ok');fb.textContent='正确'}else{x.classList.add('bad');fb.textContent='答案：'+x.dataset.a}});$('#fScore').textContent=`已填写 ${f} / ${currentF.length}；正确 ${c} 题`};
</script></body></html>
