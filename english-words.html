<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Zoe 的英语单词库：按英文搜索、编号正倒序排序，以及按编号区间筛选。">
  <meta name="theme-color" content="#f7f4ef">
  <title>英语单词 | Zoe's Study Archive</title>
  <link rel="icon" type="image/png" href="./assets/icons/meibao-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/meibao-180.png">
  <link rel="stylesheet" href="./assets/tokens.css">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--bg); -webkit-text-size-adjust: 100%; }
    body { margin: 0; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; line-height: 1.55; }
    body::before { content: ""; position: fixed; z-index: -1; top: -150px; right: -110px; width: 430px; height: 430px; background: radial-gradient(circle, rgba(249,196,206,.3), transparent 68%); pointer-events: none; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--lav-deep); outline-offset: 3px; }
    .skip-link { position: absolute; top: -100px; left: 18px; padding: 10px 14px; background: var(--text); color: #fff; z-index: 5; }
    .skip-link:focus { top: 8px; }
    .topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 20px; padding: 13px clamp(18px, 4vw, 54px); border-bottom: 1px solid var(--border); }
    .brand { color: var(--text); font: 700 18px/1.2 Georgia, "Times New Roman", serif; text-decoration: none; }
    .brand span { color: #85508f; }
    .nav { display: flex; flex-wrap: wrap; gap: 8px; }
    .nav a { display: inline-flex; align-items: center; min-height: 38px; padding: 7px 13px; border: 1px solid var(--border); border-radius: 22px; color: var(--dim); background: var(--surface); text-decoration: none; font-size: 13px; font-weight: 600; }
    .nav a[aria-current="page"] { background: var(--text); border-color: var(--text); color: #fff; }
    main { max-width: 1180px; margin: 0 auto; padding: 32px clamp(18px,4vw,54px) 64px; }
    .intro { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: end; gap: 14px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 6px; color: var(--lav-deep); font-size: 12px; font-weight: 750; letter-spacing: .1em; }
    h1 { font-size: clamp(28px, 4vw, 38px); line-height: 1.2; letter-spacing: -.025em; margin: 0 0 8px; }
    .intro p:last-child { margin: 0; color: var(--dim); font-size: 14px; }
    .total { background: var(--surface); border: 1px solid var(--border); padding: 10px 16px; border-radius: 14px; color: var(--dim); font-size: 13px; white-space: nowrap; }
    .total strong { color: var(--text); font-size: 21px; font-variant-numeric: tabular-nums; }
    .filters { background: var(--surface); border: 1px solid var(--border); padding: 22px; border-radius: 20px; box-shadow: var(--shadow); }
    .controls-grid { display: grid; grid-template-columns: minmax(230px,1.7fr) minmax(120px,.55fr) minmax(130px,.55fr) auto; gap: 14px; align-items: end; }
    .control { min-width: 0; display: flex; flex-direction: column; gap: 7px; }
    label { font-size: 12px; font-weight: 700; color: var(--dim); }
    .control input { width: 100%; min-height: 44px; border: 1px solid var(--border); background: #fff; border-radius: 11px; padding: 9px 12px; color: var(--text); font-size: 16px; }
    .control input:focus { border-color: var(--lav-deep); }
    #search { padding-left: 38px; }
    .search-container { position: relative; }
    .search-container svg { position: absolute; width: 18px; height: 18px; top: 50%; left: 13px; transform: translateY(-50%); pointer-events: none; color: var(--dim); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; }
    .sort-btn, .reset-btn, .more-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 43px; border-radius: 11px; font-size: 13px; font-weight: 700; padding: 9px 15px; border: 1px solid var(--border); background: #fff; color: var(--text); }
    .sort-btn { background: var(--lav); border-color: #d8c9ee; color: var(--lav-deep); white-space: nowrap; }
    .sort-btn:hover, .reset-btn:hover, .more-btn:hover { border-color: var(--lav-deep); }
    .actions .hint { color: var(--dim); font-size: 12px; margin: 0; }
    .status-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; align-items: center; padding: 21px 2px 12px; }
    #results { margin: 0; color: var(--dim); font-size: 13px; }
    #rangeError { margin: 0; color: #a34760; font-size: 13px; }
    .word-list { display: grid; gap: 10px; }
    .word-card { display: grid; grid-template-columns: minmax(65px, 88px) 1fr; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 18px 20px; }
    .word-number { font-size: 14px; font-weight: 750; color: var(--lav-deep); font-variant-numeric: tabular-nums; padding-top: 4px; }
    .word-title-row { display: flex; gap: 8px 12px; align-items: baseline; flex-wrap: wrap; }
    .word-title { margin: 0; font-size: 21px; font-weight: 750; overflow-wrap: anywhere; line-height: 1.3; }
    .phonetic { color: var(--dim); font-size: 13px; }
    .meaning { margin: 7px 0 0; font-size: 14px; color: var(--text); }
    .definition { margin: 5px 0 0; color: var(--dim); font-size: 13px; line-height: 1.65; }
    .japanese { margin: 4px 0 0; color: var(--dim); font-size: 13px; line-height: 1.65; }
    .pos { display: inline-block; margin-right: 7px; color: var(--blue-deep); font-size: 12px; font-weight: 700; }
    .example { margin: 10px 0 0; padding-left: 12px; border-left: 3px solid var(--mint); font-size: 13px; color: var(--dim); }
    .example-translation { display: block; margin-top: 3px; }
    .state-panel { padding: 46px 20px; text-align: center; color: var(--dim); background: var(--surface); border: 1px dashed #d8ced8; border-radius: 16px; }
    .state-panel h2 { margin: 0 0 8px; font-size: 17px; color: var(--text); }
    .state-panel p { margin: 0; font-size: 13px; line-height: 1.8; }
    .more-wrap { display: flex; justify-content: center; margin-top: 18px; }
    .more-btn { min-width: 150px; }
    .footer { padding: 0 15px 28px; text-align: center; color: var(--dim); font-size: 12px; }
    @media (max-width: 770px) {
      .controls-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .search-control { grid-column: 1/-1; }
      .sort-column { grid-column: 1/-1; }
      .filters { padding: 18px; }
      .sort-column .sort-btn { width: 100%; }
    }
    @media (max-width: 470px) {
      .topbar { padding: 12px 16px; }
      .brand { font-size: 16px; }
      main { padding-top: 24px; }
      .intro { margin-bottom: 18px; }
      .word-card { grid-template-columns: 1fr; gap: 4px; padding: 15px 16px; }
      .word-number { padding: 0; font-size: 12px; }
      .word-title { font-size: 20px; }
      .filters { padding: 15px; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#wordList">跳到单词列表</a>
  <header class="topbar">
    <a class="brand" href="./index.html">Zoe's <span>Study Archive</span></a>
    <nav class="nav" aria-label="主导航">
      <a href="./index.html">学习资料</a>
      <a href="./english-words.html" aria-current="page">英语单词</a>
    </nav>
  </header>
  <main>
    <div class="intro">
      <div>
        <p class="eyebrow">VOCABULARY LIBRARY</p>
        <h1>英语单词</h1>
        <p>查单词、按编号浏览，或只看指定编号区间。</p>
      </div>
      <div class="total"><strong id="totalCount">—</strong> 个单词</div>
    </div>
    <section class="filters" aria-label="单词搜索和筛选">
      <div class="controls-grid">
        <div class="control search-control">
          <label for="search">搜索英文单词</label>
          <div class="search-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7.5"></circle><path d="m17 17 4 4"></path></svg>
            <input type="search" id="search" placeholder="输入单词开头字母，如 S、SW" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="control">
          <label for="fromNumber">起始编号（含）</label>
          <input id="fromNumber" type="number" min="0" step="1" inputmode="numeric" placeholder="如 1530">
        </div>
        <div class="control">
          <label for="toNumber">结束编号（含）</label>
          <input id="toNumber" type="number" min="0" step="1" inputmode="numeric" placeholder="如 1610">
        </div>
        <div class="control sort-column">
          <label for="sortDirection">编号排序</label>
          <button type="button" id="sortDirection" class="sort-btn" aria-pressed="false">↑ 正序</button>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="clearFilters" class="reset-btn">重置条件</button>
        <p class="hint">输入起止编号即可筛选区间，例如 1530–1610；搜索和筛选可以同时使用。</p>
      </div>
    </section>
    <div class="status-row">
      <p id="results" role="status" aria-live="polite">正在载入单词…</p>
      <p id="rangeError" role="alert" hidden></p>
    </div>
    <div id="wordList" class="word-list" aria-label="单词列表"></div>
    <div id="emptyState" class="state-panel" hidden>
      <h2 id="emptyTitle">没有符合条件的单词</h2>
      <p id="emptyDescription">请调整搜索词或编号区间。</p>
    </div>
    <div class="more-wrap" id="moreWrap" hidden><button type="button" class="more-btn" id="loadMore">显示更多单词</button></div>
  </main>
  <footer class="footer">每一回，慢慢积累。</footer>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const ui = {
        search: $('search'), from: $('fromNumber'), to: $('toNumber'),
        direction: $('sortDirection'), reset: $('clearFilters'),
        total: $('totalCount'), results: $('results'), error: $('rangeError'),
        list: $('wordList'), empty: $('emptyState'),
        emptyTitle: $('emptyTitle'), emptyDescription: $('emptyDescription'),
        more: $('moreWrap'), loadMore: $('loadMore')
      };
      const PAGE_SIZE = 80;
      let words = [];
      let loaded = false;
      let loadError = '';
      let descending = false;
      let visibleCount = PAGE_SIZE;

      function normalizeWords(raw) {
        const entries = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.words) ? raw.words : []);
        const seen = new Set();
        return entries.reduce((result, entry) => {
          if (!entry || typeof entry !== 'object') return result;
          const number = Number(entry.id ?? entry.number ?? entry.no);
          const word = String(entry.word ?? entry.english ?? '').trim();
          if (!Number.isSafeInteger(number) || number < 0 || !word || seen.has(number)) return result;
          seen.add(number);
          result.push({
            number, word,
            phonetic: String(entry.phonetic ?? '').trim(),
            pos: String(entry.pos ?? entry.partOfSpeech ?? '').trim(),
            meaning: String(entry.meaning ?? '').trim(),
            definition: String(entry.definition ?? '').trim(),
            japanese: String(entry.japanese ?? '').trim(),
            example: String(entry.example ?? '').trim(),
            translation: String(entry.exampleTranslation ?? entry.translation ?? '').trim()
          });
          return result;
        }, []);
      }
      function make(tag, className, value) {
        const el = document.createElement(tag);
        if (className) el.className = className;
        if (value !== undefined) el.textContent = value;
        return el;
      }
      function makeCard(entry) {
        const card = make('article', 'word-card');
        card.append(make('span', 'word-number', '#' + entry.number));
        const main = make('div', 'word-details');
        const titleRow = make('div', 'word-title-row');
        titleRow.append(make('h2', 'word-title', entry.word));
        if (entry.phonetic) titleRow.append(make('span', 'phonetic', entry.phonetic));
        main.append(titleRow);
        if (entry.meaning || entry.pos) {
          const meaning = make('p', 'meaning');
          if (entry.pos) meaning.append(make('span', 'pos', entry.pos));
          if (entry.meaning) meaning.append(document.createTextNode(entry.meaning));
          main.append(meaning);
        }
        if (entry.definition) main.append(make('p', 'definition', entry.definition));
        if (entry.japanese) main.append(make('p', 'japanese', '日文：' + entry.japanese));
        if (entry.example || entry.translation) {
          const example = make('p', 'example');
          if (entry.example) example.append(document.createTextNode(entry.example));
          if (entry.translation) example.append(make('span', 'example-translation', entry.translation));
          main.append(example);
        }
        card.append(main);
        return card;
      }
      function boundValue(field) {
        return field.value.trim() === '' ? null : Number(field.value);
      }
      function render() {
        if (!loaded) return;
        const query = ui.search.value.trim().toLocaleLowerCase('en');
        const from = boundValue(ui.from);
        const to = boundValue(ui.to);
        const invalid = (from !== null && (!Number.isSafeInteger(from) || from < 0))
          || (to !== null && (!Number.isSafeInteger(to) || to < 0))
          || (from !== null && to !== null && from > to);
        ui.error.hidden = !invalid;
        ui.error.textContent = invalid ? '请输入有效的非负整数编号，且起始编号不能大于结束编号。' : '';
        ui.direction.textContent = descending ? '↓ 倒序' : '↑ 正序';
        ui.direction.setAttribute('aria-pressed', String(descending));
        ui.total.textContent = String(words.length);
        const filtered = invalid ? [] : words.filter(entry =>
          (!query || entry.word.toLocaleLowerCase('en').startsWith(query))
          && (from === null || entry.number >= from)
          && (to === null || entry.number <= to)
        ).sort((a, b) => (descending ? b.number - a.number : a.number - b.number) || a.word.localeCompare(b.word, 'en'));
        ui.results.textContent = '显示 ' + filtered.length + ' / ' + words.length + ' 个单词'
          + (filtered.length > visibleCount ? '（已加载前 ' + visibleCount + ' 个）' : '');
        ui.list.replaceChildren();
        const fragment = document.createDocumentFragment();
        for (const entry of filtered.slice(0, visibleCount)) fragment.append(makeCard(entry));
        ui.list.append(fragment);
        ui.more.hidden = filtered.length <= visibleCount;
        ui.loadMore.textContent = '显示更多单词（剩余 ' + (filtered.length - visibleCount) + ' 个）';
        const noData = words.length === 0;
        const isEmpty = invalid || filtered.length === 0;
        ui.empty.hidden = !isEmpty;
        if (isEmpty) {
          ui.emptyTitle.textContent = invalid ? '编号区间无效' : (noData ? '单词库尚未录入数据' : '没有符合条件的单词');
          ui.emptyDescription.textContent = invalid
            ? '请检查起始编号与结束编号。'
            : (noData ? '页面功能已经准备好。将编号、英文单词和释义添加到 data/english-words.json 后，这里会自动显示。'
              : '请调整英文搜索词或编号范围。');
        }
      }
      function refresh() { visibleCount = PAGE_SIZE; render(); }
      [ui.search, ui.from, ui.to].forEach(el => el.addEventListener('input', refresh));
      ui.direction.addEventListener('click', () => { descending = !descending; refresh(); });
      ui.reset.addEventListener('click', () => {
        ui.search.value = '';
        ui.from.value = '';
        ui.to.value = '';
        descending = false;
        refresh();
      });
      ui.loadMore.addEventListener('click', () => { visibleCount += PAGE_SIZE; render(); });
      async function load() {
        try {
          const response = await fetch('./data/english-words.json', { cache: 'no-cache' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          words = normalizeWords(await response.json());
        } catch (error) {
          loadError = '无法载入单词数据（' + String(error.message || error) + '），请刷新页面重试。';
        }
        loaded = true;
        if (loadError) {
          ui.results.textContent = loadError;
          ui.empty.hidden = false;
          ui.emptyTitle.textContent = '单词数据加载失败';
          ui.emptyDescription.textContent = '请检查 data/english-words.json 文件是否存在且为有效 JSON。';
          return;
        }
        render();
      }
      load();
    })();
  </script>
</body>
</html>
