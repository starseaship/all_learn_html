<script>
const chapters=[{"id":"sf13","title":"Sustainable Futures 1.3 · Japan Cannot Support Itself","sections":[{"title":"Structure Work","items":[{"q":"What is the topic sentence?","a":"Japan depends on other countries for many of its needs, such as food, energy, wood, and materials for clothes.","zhq":"主题句是什么？","zha":"日本在食物、能源、木材和服装材料等许多方面依赖其他国家。"},{"q":"How much of Japan’s food is produced domestically, and how much is imported? Which countries supply much of the imported food?","a":"Japan produces about 39% domestically and imports about 61%. Much of the imported food comes from America, China, and Australia.","zhq":"日本国内生产多少食物、进口多少？大量进口食物来自哪些国家？","zha":"日本国内生产约39%，进口约61%。大量进口食物来自美国、中国和澳大利亚。"},{"q":"How much of Japan’s energy is produced domestically, and how much is imported? Where do much of its oil and natural gas come from?","a":"Only about 4% is produced domestically and about 96% is imported. Much of Japan’s oil and natural gas comes from the Middle East.","zhq":"日本国内生产多少能源、进口多少？大量石油和天然气来自哪里？","zha":"日本国内只生产约4%，约96%依靠进口。大量石油和天然气来自中东。"},{"q":"How much of its own wood can Japan supply?","a":"Japan can supply about 30% of its own wood.","zhq":"日本可以自行供应多少木材？","zha":"日本可以自行供应约30%的木材。"},{"q":"What is wool used to make, and where does Japan’s imported wool come from?","a":"Wool is used to make coats and sweaters. Most of it comes from sheep in Australia and New Zealand.","zhq":"羊毛用来制作什么？日本进口的羊毛来自哪里？","zha":"羊毛用来制作外套和毛衣，大部分来自澳大利亚和新西兰的绵羊。"},{"q":"What is cotton used to make, and where does almost half of Japan’s imported cotton come from?","a":"Cotton is used to make towels and traditional Japanese clothes. Almost half of the imported cotton comes from the U.S.A.","zhq":"棉花用来制作什么？日本近一半的进口棉花来自哪里？","zha":"棉花用来制作毛巾和传统日本服装，近一半的进口棉花来自美国。"},{"q":"What is the concluding sentence?","a":"Japan should make greater efforts to supply its own needs. This is a challenge as Japan tries to build a more sustainable future.","zhq":"结尾句是什么？","zha":"日本应该更加努力地满足自身需求。这是日本建设更可持续未来时面临的一项挑战。"}]},{"title":"Comprehension Check","items":[{"q":"According to the paragraph, why is it impossible for Japan alone to support its own people?","a":"A — Because Japan has few resources.","zhq":"根据文章，为什么日本无法仅靠自己养活本国人口？","zha":"A——因为日本资源较少。"},{"q":"How much land would Japan need to support its current population without any imports?","a":"C — About 1.5 million km², around four times its present land area.","zhq":"如果完全不进口，日本需要多少土地才能养活现有人口？","zha":"C——约150万平方公里，大约是现有国土面积的四倍。"},{"q":"What does Japan import the greatest amount of from other countries?","a":"A — Energy supplies.","zhq":"日本从其他国家进口比例最高的是什么？","zha":"A——能源供应。"},{"q":"Which country exports wool to Japan?","a":"B — Australia.","zhq":"哪个国家向日本出口羊毛？","zha":"B——澳大利亚。"},{"q":"What should Japan do to make a more sustainable future?","a":"C — Work harder to supply its own needs.","zhq":"为了创造更可持续的未来，日本应该做什么？","zha":"C——更加努力地满足自身需求。"}]}]},{"id":"sf17","title":"Sustainable Futures 1.7 · Understanding Our Ecological Footprints","sections":[{"title":"Structure Work — 1–16","items":[{"q":"What do our footprints show?","a":"The space that we take when we stand or walk.","zhq":"我们的脚印显示什么？","zha":"显示我们站立或行走时占据的空间。"},{"q":"What do our ecological footprints show?","a":"The space that we take on earth to support our life.","zhq":"我们的生态足迹显示什么？","zha":"显示地球为了支撑我们的生活而被我们占用的空间。"},{"q":"What is the thesis statement?","a":"This essay will explain the origin of ecological footprints, apply the idea to Japan, and then the whole world.","zhq":"文章的中心论点句是什么？","zha":"本文将解释生态足迹概念的起源，并把这一概念应用到日本及整个世界。"},{"q":"What did the writers first want to measure?","a":"How much land was needed for the long-term support of any group of people.","zhq":"作者首先想测量什么？","zha":"维持任意人群长期生活需要多少土地。"},{"q":"What did the writers want to increase?","a":"Our understanding of how we depend on nature for many services.","zhq":"作者希望增进什么？","zha":"增进我们对人类如何依赖自然提供各种服务的理解。"},{"q":"What did the writers intend to find out?","a":"How much land would be needed to provide resources and deal with waste for an unlimited number of years.","zhq":"作者打算弄清什么？","zha":"在无限长的时间里，提供资源并处理废弃物需要多少土地。"},{"q":"What does sustainability mean?","a":"The ability to continue for an unlimited number of years.","zhq":"可持续性是什么意思？","zha":"能够无限期地持续下去。"},{"q":"What example illustrates sustainability?","a":"An average Canadian needs an area of 207 m × 207 m, or 42,849 m², to provide resources and deal with waste sustainably.","zhq":"哪个例子说明了可持续性？","zha":"一名普通加拿大人需要207米×207米、即42,849平方米的土地，才能以可持续方式获得资源并处理废弃物。"},{"q":"What is the first way Japan spreads its ecological footprint?","a":"Japan imports lots of resources from outside its own land.","zhq":"日本把生态足迹扩展到其他国家的第一种方式是什么？","zha":"日本从国土之外进口大量资源。"},{"q":"What is the second way Japan spreads its ecological footprint?","a":"Some of Japan’s wastes are sent overseas.","zhq":"第二种方式是什么？","zha":"日本的一部分废弃物被运往海外。"},{"q":"How many planets would be needed if everyone lived like the average Canadian or American?","a":"At least three planets.","zhq":"如果所有人都像普通加拿大人或美国人那样生活，需要多少个地球？","zha":"至少需要三个地球。"},{"q":"What is the first problem of living on only one earth?","a":"People in developed countries use far more than their fair share of the earth’s resources.","zhq":"只生活在一个地球上的第一个问题是什么？","zha":"发达国家的人使用了远超公平份额的地球资源。"},{"q":"What is the second problem?","a":"Many people in developing countries live with far less than their fair share of resources.","zhq":"第二个问题是什么？","zha":"许多发展中国家的人获得的资源远低于他们应有的公平份额。"},{"q":"What is the third problem?","a":"We use resources faster than they can be renewed and produce wastes faster than they can be safely returned to the environment.","zhq":"第三个问题是什么？","zha":"我们消耗资源的速度快于资源更新的速度，产生废弃物的速度也快于环境能够安全吸收的速度。"},{"q":"What does the ecological footprint help us understand?","a":"How we depend on the earth and how we influence the earth.","zhq":"生态足迹帮助我们理解什么？","zha":"理解我们如何依赖地球，以及我们如何影响地球。"},{"q":"What do we need to reduce?","a":"Our ecological footprints, by using fewer resources and producing less waste.","zhq":"我们需要减少什么？","zha":"减少生态足迹，也就是减少资源使用和废弃物产生。"}]},{"title":"Comprehension Check","items":[{"q":"How did the concept of “ecological footprint” become widely known?","a":"A — Through a book, Our Ecological Footprint.","zhq":"“生态足迹”概念是如何广为人知的？","zha":"A——通过《Our Ecological Footprint》这本书。"},{"q":"Why do Wackernagel and Rees refer to “enough land” in their book?","a":"C — To examine the impact of humans on the earth.","zhq":"Wackernagel和Rees为什么在书中讨论“足够的土地”？","zha":"C——为了考察人类对地球的影响。"},{"q":"Which is true about Canada?","a":"B — It is a large country with a small population.","zhq":"关于加拿大，哪一项正确？","zha":"B——加拿大国土面积大，但人口较少。"},{"q":"If people in Japan lived like the average Canadian, how many people could be sustainably supported using only the islands of Japan?","a":"B — About 9 million people.","zhq":"如果日本居民都像普通加拿大人那样生活，仅靠日本国土可持续供养多少人？","zha":"B——约900万人。"},{"q":"How has Japan been able to support its very large population?","a":"B — By importing lots of resources and sending wastes overseas.","zhq":"日本如何供养庞大人口？","zha":"B——通过进口大量资源并把部分废弃物运往海外。"},{"q":"If the ecologically useful land on earth were equally divided, how much would each person have?","a":"C — 14,884 m².","zhq":"如果地球上具有生态用途的土地平均分配，每个人可以分到多少？","zha":"C——14,884平方米。"},{"q":"If everyone on earth lived like the average Canadian or American, how many planets would we need?","a":"B — Three planets.","zhq":"如果所有人都像普通加拿大人或美国人那样生活，需要多少个地球？","zha":"B——三个地球。"},{"q":"What does “living in a sustainable way” mean?","a":"C — Reducing the use of energy and resources.","zhq":"“以可持续方式生活”是什么意思？","zha":"C——减少能源和资源的使用。"},{"q":"What does the essay indicate is important for us to do?","a":"A — Change our habits.","zhq":"文章指出我们做什么很重要？","zha":"A——改变我们的习惯。"},{"q":"Why is it important to understand ecological footprints?","a":"D — So we can understand how we depend on and influence the earth.","zhq":"为什么理解生态足迹很重要？","zha":"D——因为这能帮助我们理解自己如何依赖并影响地球。"}]}]},{"id":"sf27","title":"Sustainable Futures 2.7 · Feeding the World: Nature and Technology","sections":[{"title":"Comprehension Check Questions","items":[{"q":"What danger has come from the use of antibiotics in factory farming?","a":"Some bacteria can no longer be killed by antibiotics. These super-bacteria are causing health problems for humans.","zhq":"工厂化养殖使用抗生素带来了什么危险？","zha":"一些细菌已经无法被抗生素杀死，这些“超级细菌”正在给人类造成健康问题。"},{"q":"What makes intensive farming different from traditional farming?","a":"Intensive farming aims for the highest possible food production in an area and depends heavily on chemicals, machines, and other technology.","zhq":"集约化农业与传统农业有什么不同？","zha":"集约化农业追求单位面积内尽可能高的产量，并高度依赖化学品、机器和其他技术。"},{"q":"How was corn developed into the corn that we have today?","a":"For hundreds or thousands of years, people selected and planted seeds from plants that looked better, tasted better, or produced more food.","zhq":"今天的玉米是如何培育出来的？","zha":"数百乃至数千年来，人们不断选择外观更好、味道更好或产量更高的植物种子继续种植。"},{"q":"Why do modern farms use “Roundup”?","a":"They use it to kill weeds. GMO crops are changed so that Roundup does not damage the crop plants.","zhq":"现代农场为什么使用Roundup？","zha":"用它来杀死杂草；转基因作物经过改造，不会被Roundup伤害。"},{"q":"What is necessary for GMO food to be sold in Japan?","a":"It must be labeled as GMO food.","zhq":"转基因食品在日本销售必须满足什么条件？","zha":"必须标注为转基因食品。"},{"q":"What are two advantages of indoor farming?","a":"It does not depend on the weather, and no insect-killing chemicals are needed because there are no insects indoors.","zhq":"室内农业的两个优点是什么？","zha":"不受天气影响；室内没有昆虫，因此不需要使用杀虫化学品。"},{"q":"Modern farming damages the land. What does organic farming do to the land?","a":"It allows the land to continue producing food year after year instead of becoming salty, dead land.","zhq":"现代农业会损害土地，有机农业对土地有什么作用？","zha":"它能让土地年复一年继续生产食物，避免土地盐化并变成无法耕种的死地。"},{"q":"What is one disadvantage of organic farming?","a":"It requires more labor and other costs, so organic food is more expensive to produce.","zhq":"有机农业的一个缺点是什么？","zha":"它需要更多人工和其他成本，因此生产有机食品更昂贵。"},{"q":"Why is it necessary to consider different methods of farming?","a":"The population is growing, so we need more food, but each method has benefits and problems. We must find the best way to feed everyone while protecting the environment.","zhq":"为什么必须考虑不同的农业方法？","zha":"人口增长意味着需要更多食物，但每种方法都有优点和问题；我们必须找到既能养活所有人又能保护环境的最佳方式。"},{"q":"What is the main topic of this essay?","a":"The essay examines modern approaches—intensive farming and GMOs—and alternatives—indoor farming and organic farming.","zhq":"这篇文章的主要主题是什么？","zha":"文章考察了集约化农业和转基因农业等现代方法，以及室内农业和有机农业等替代方法。"}]}]},{"id":"pv27","title":"Peace & Values 2.7 · Leaders of Social Change","sections":[{"title":"Rigoberta Menchu","items":[{"q":"What happened to Rigoberta Menchu’s brother and mother?","a":"They were taken and killed by the Guatemalan army during the civil war.","zhq":"Rigoberta Menchu的兄弟和母亲遭遇了什么？","zha":"他们在危地马拉内战期间被军队抓走并杀害。"},{"q":"What did she do after she escaped to Mexico?","a":"She risked her life to speak out against the Guatemalan army and organized groups to oppose the oppression of indigenous people.","zhq":"她逃到墨西哥后做了什么？","zha":"她冒着生命危险公开反对危地马拉军队，并组织团体反抗对原住民的压迫。"},{"q":"Why did she win a Nobel Peace Prize?","a":"She won it for organizing opposition to the oppression of indigenous people in Guatemala.","zhq":"她为什么获得诺贝尔和平奖？","zha":"因为她组织人们反抗危地马拉对原住民的压迫。"},{"q":"How did she help people in poverty?","a":"She worked with medical companies to offer low-cost medicines.","zhq":"她如何帮助贫困人口？","zha":"她与医药公司合作，提供低价药品。"},{"q":"What is the Nobel Women’s Initiative?","a":"It is an organization that pushes for peace and equality around the world.","zhq":"什么是Nobel Women’s Initiative？","zha":"这是一个推动全球和平与平等的组织。"}]},{"title":"Martin Luther King, Jr.","items":[{"q":"What type of discrimination was common in the U.S. before the 1960s?","a":"Racial discrimination and segregation were common. Black and white people had separate restaurants, schools, water fountains, and bus seats.","zhq":"20世纪60年代以前，美国普遍存在什么歧视？","zha":"种族歧视和种族隔离很普遍，黑人和白人使用不同的餐馆、学校、饮水设施和公交座位。"},{"q":"What is one example of nonviolent resistance?","a":"The bus boycott organized by Martin Luther King, Jr. from 1955 to 1956.","zhq":"非暴力抵抗的一个例子是什么？","zha":"Martin Luther King Jr.在1955年至1956年组织的公交车抵制运动。"},{"q":"Before the bus boycott, what did a black person have to do if a white person was standing?","a":"The black person had to stand up and give the seat to the white person.","zhq":"公交车抵制运动前，如果有白人站着，黑人必须做什么？","zha":"黑人必须站起来，把座位让给白人。"},{"q":"How did black people protest the law about behavior on buses?","a":"They stopped riding the buses and often walked many miles to work and back.","zhq":"黑人如何抗议公交车上的歧视规定？","zha":"他们停止乘坐公交车，经常步行很远上下班。"},{"q":"What was the result of this protest?","a":"The government decided that separate seats for black and white people were against the law.","zhq":"这场抗议的结果是什么？","zha":"政府裁定黑人和白人分开乘坐的规定违法。"}]},{"title":"Malala Yousafzai","items":[{"q":"What did the Taliban ban?","a":"They banned girls from going to school.","zhq":"塔利班禁止了什么？","zha":"禁止女孩上学。"},{"q":"What did Malala Yousafzai do when she was still a child?","a":"She spoke out publicly against the ban on girls’ education.","zhq":"Malala Yousafzai还是孩子时做了什么？","zha":"她公开反对禁止女孩接受教育的规定。"},{"q":"How did the Taliban react when Malala Yousafzai spoke out?","a":"They decided that she should die, and a gunman shot her in the head on a bus.","zhq":"Malala公开发声后，塔利班如何回应？","zha":"他们决定杀死她，一名枪手在公交车上向她头部开枪。"},{"q":"How did Malala Yousafzai’s life change?","a":"She survived, was taken to England for medical treatment, recovered, and received worldwide support.","zhq":"Malala的人生发生了什么变化？","zha":"她幸存下来，被送往英国治疗并康复，也获得了全世界的支持。"},{"q":"What does Malala Yousafzai do now?","a":"She continues to speak against religious extremism and created the Malala Fund to help girls have the same opportunities as boys.","zhq":"Malala现在做什么？","zha":"她继续反对宗教极端主义，并创立Malala Fund，帮助女孩获得与男孩同等的机会。"}]},{"title":"Mahatma Gandhi","items":[{"q":"What was Mahatma Gandhi’s life like as a child and young man?","a":"He was born into a good family, married at age 13, received a good education in India and England, and became a lawyer.","zhq":"Mahatma Gandhi童年和青年时期的生活如何？","zha":"他出生于条件良好的家庭，13岁结婚，在印度和英国接受良好教育，后来成为律师。"},{"q":"What did Mahatma Gandhi fight against in South Africa?","a":"He fought against apartheid, the system of racial separation.","zhq":"Gandhi在南非反对什么？","zha":"他反对种族隔离制度。"},{"q":"What did Mahatma Gandhi do when he returned to India?","a":"He became the leader of nonviolent protests against British rule.","zhq":"Gandhi回到印度后做了什么？","zha":"他成为反对英国统治的非暴力抗议领袖。"},{"q":"What is one of the actions that Mahatma Gandhi led in India?","a":"He led people on a 250-mile walk to the sea to collect salt and protest the British salt tax.","zhq":"Gandhi在印度领导过哪一项行动？","zha":"他领导人们步行250英里到海边取盐，以抗议英国征收的盐税。"},{"q":"What is the type of protest he used called today?","a":"It is called nonviolent protest or nonviolent resistance.","zhq":"他使用的抗议方式今天叫什么？","zha":"称为非暴力抗议或非暴力抵抗。"}]}]}];
const nav=document.getElementById("nav"),app=document.getElementById("app");chapters.forEach(ch=>{const link=document.createElement("a");link.href="#"+ch.id;link.textContent=ch.id==="pv27"?"P&V 2.7":ch.id.replace("sf","SF ");nav.appendChild(link);const chapter=document.createElement("section");chapter.className="chapter";chapter.id=ch.id;const h2=document.createElement("h2");h2.textContent=ch.title;chapter.appendChild(h2);const inner=document.createElement("div");inner.className="inner";let chapterNumber=0;ch.sections.forEach(sec=>{const h3=document.createElement("h3");h3.textContent=sec.title;inner.appendChild(h3);sec.items.forEach(item=>{chapterNumber++;const card=document.createElement("article");card.className="qa";const q=document.createElement("div");q.className="question";const num=document.createElement("span");num.className="num";num.textContent=chapterNumber;const qtext=document.createElement("div");qtext.textContent=item.q;q.append(num,qtext);const answer=document.createElement("div");answer.className="answer";const label=document.createElement("div");label.className="label";label.textContent="Answer";const atext=document.createElement("div");atext.textContent=item.a;const zh=document.createElement("div");zh.className="zh";const zhq=document.createElement("p"),zhqLabel=document.createElement("strong");zhqLabel.textContent="中文题目：";zhq.append(zhqLabel,document.createTextNode(item.zhq));const zha=document.createElement("p"),zhaLabel=document.createElement("strong");zhaLabel.textContent="中文答案：";zha.append(zhaLabel,document.createTextNode(item.zha));zh.append(zhq,zha);answer.append(label,atext,zh);card.append(q,answer);inner.appendChild(card)})});chapter.appendChild(inner);app.appendChild(chapter)});
